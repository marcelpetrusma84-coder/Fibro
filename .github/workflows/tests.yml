# Automatische tests (3 nov 2026): bij elke pull request en elke wijziging op main draaien alle tests van Fibro.
# Op de pull request zie je dan een groen vinkje (alles goed) of een rood kruis (iets mis; klik voor de uitleg).
#  - Tests (Node): alle tests in tests/ (node tests/alle-tests.mjs), plus bij een pull request de controle of elk
#    veranderd script ook een nieuw ?v=-nummer kreeg (tests/tools/controleer-versies.mjs).
#  - Browsertests: echte Stekky's in Chrome met nep-camera en nep-server (de lijst: tests/tools/browsertests.txt),
#    in 4 groepjes tegelijk (tests/tools/browsertests.py).
name: Tests

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Tests (Node)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Typescript (voor de tests van de pushfunctie)
        run: npm install --no-save --no-package-lock typescript@5
      - name: Alle tests
        run: node tests/alle-tests.mjs
      - name: Nieuwe ?v=-nummers bij veranderde scripts
        if: github.event_name == 'pull_request'
        run: node tests/tools/controleer-versies.mjs "origin/${{ github.base_ref }}" HEAD

  browser:
    # 27 nov 2026 (Marcel: "snellere controles"): de browsertests staan in tests/tools/browsertests.txt en draaien in
    # 4 groepjes tegelijk (tests/tools/browsertests.py): ongeveer 8 minuten in plaats van 25. Een proef die mislukt,
    # draait nog één keer; lukt hij dan wel, dan staat hij als "wankel" in de samenvatting (de controle blijft groen).
    name: Browsertests (groepje ${{ matrix.groep }} van 4)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        groep: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Playwright en Chrome
        run: |
          pip install playwright==1.*
          # 11 nov 2026: lukt het installeren van de extra Ubuntu-pakketten niet binnen 4 minuten (storing bij
          # Ubuntu; het bleef 20 minuten hangen), dan alleen Chrome zelf; de GitHub-computer heeft de meeste pakketten al.
          timeout 240 python -m playwright install --with-deps chromium || python -m playwright install chromium
      - name: Browsertests (groepje ${{ matrix.groep }})
        run: python -I tests/tools/browsertests.py --groep ${{ matrix.groep }} --van 4
