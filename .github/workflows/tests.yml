# Automatische tests (3 nov 2026): bij elke pull request en elke wijziging op main draaien alle tests van Fibro.
# Op de pull request zie je dan een groen vinkje (alles goed) of een rood kruis (iets mis; klik voor de uitleg).
#  - Tests (Node): alle tests in tests/ (node tests/alle-tests.mjs), plus bij een pull request de controle of elk
#    veranderd script ook een nieuw ?v=-nummer kreeg (tests/tools/controleer-versies.mjs).
#  - Browsertests: twee echte Fibro's in Chrome met nep-camera en nep-server: bellen en webcam in 5 spellen
#    (tests/tools/proef228.py) en de postbus als je niet tegelijk online bent (tests/tools/proef231.py).
name: Tests

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Tests (Node)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Typescript (voor de tests van de pushfunctie)
        run: npm install --no-save --no-package-lock typescript@5
      - name: Alle tests
        run: node tests/alle-tests.mjs
      - name: Nieuwe ?v=-nummers bij veranderde scripts
        if: github.event_name == 'pull_request'
        run: node tests/tools/controleer-versies.mjs "origin/${{ github.base_ref }}" HEAD

  browser:
    name: Browsertests (bellen in spellen, postbus)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Playwright en Chrome
        run: |
          pip install playwright==1.*
          python -m playwright install --with-deps chromium
      - name: Bellen en webcam met twee spelers (5 spellen)
        run: python -I tests/tools/proef228.py .
      - name: Postbus (nooit tegelijk online)
        if: ${{ !cancelled() }}
        run: python -I tests/tools/proef231.py .
      - name: Pushmeldingen voor spellen (twee spelers)
        if: ${{ !cancelled() }}
        run: python -I tests/tools/proef234.py .
      - name: Buzzgeluid met de regel van de iPhone
        if: ${{ !cancelled() }}
        run: python -I tests/tools/proef232.py .
      - name: Makkelijker contact (delen, zeg hoi, na een uitnodiging naar de chat)
        if: ${{ !cancelled() }}
        run: python -I tests/tools/proef236.py .
      - name: Meldingen meteen aanzetten (Home, welkomstscherm, iPhone)
        if: ${{ !cancelled() }}
        run: python -I tests/tools/proef237.py .
      - name: Likes en reacties onder foto's, muziek en video's
        if: ${{ !cancelled() }}
        run: python -I tests/tools/proef238.py .
      - name: Meerdere foto's tegelijk in de chat en groot bekijken
        if: ${{ !cancelled() }}
        run: python -I tests/tools/proef239.py .
      - name: Aan het typen en gelezen-vinkjes
        if: ${{ !cancelled() }}
        run: python -I tests/tools/proef240.py .
      - name: Nieuw bij je vrienden op Home
        if: ${{ !cancelled() }}
        run: python -I tests/tools/proef241.py .
      - name: Spraakberichtjes
        if: ${{ !cancelled() }}
        run: python -I tests/tools/proef242.py .
      - name: Quiz-widget (proef243)
        if: ${{ !cancelled() }}
        run: python -I tests/tools/proef243.py .
      - name: Schaken met webcamrondjes naast elkaar, zoals dammen (gouden en rode rand)
        if: ${{ !cancelled() }}
        run: python -I tests/tools/proef270.py .
      - name: Profielmuziek uit tijdens een spel tegen de computer (en daarna weer verder)
        if: ${{ !cancelled() }}
        run: python -I tests/tools/proef271.py .
      - name: Nummers uit je playlist verwijderen (blijft weg na opnieuw openen)
        if: ${{ !cancelled() }}
        run: python -I tests/tools/proef272.py .
      - name: Inloggen tijdens laden, navigatiebalk iPhone, geluid bij bellen
        if: ${{ !cancelled() }}
        run: python -I tests/tools/proef273.py .
      - name: Spreekwolkje in het spel als je een berichtje krijgt
        if: ${{ !cancelled() }}
        run: python -I tests/tools/proef274.py .
      - name: iPhone met Vergrendelingsmodus: foto kiezen op Home, profiel en vriendprofiel laden
        if: ${{ !cancelled() }}
        run: python -I tests/tools/proef275.py .
