<!DOCTYPE html>
<html lang="nl" style="background:#1a0a2e;">
<script>
  const f = localStorage.getItem('fibro_lettertype')
  if (f) {
    document.write("<style>*{font-family:" + f + " !important}</style>")
    var fn = f.split(",")[0].replace(/[\x27\x22]/g, "").trim()
    if (fn) document.write('<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=' + fn.replace(/ /g, "+") + ':wght@400;600&display=swap">')
  }
</script>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Fibro — Bellen</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
:root { --bg:#1a0a2e; --card:rgba(255,255,255,0.06); --border:rgba(255,255,255,0.12); --accent:#c084fc; --accent2:#f0abfc; --text:#f3e8ff; --muted:rgba(243,232,255,0.5); }
body { background:var(--bg); color:var(--text); font-family:sans-serif; max-width:480px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.bel-avatar { width:120px; height:120px; border-radius:50%; background:linear-gradient(135deg,var(--accent),var(--accent2)); display:flex; align-items:center; justify-content:center; font-size:52px; animation:pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(192,132,252,0.5)} 50%{box-shadow:0 0 0 20px rgba(192,132,252,0)} }
.bel-naam { font-size:26px; font-weight:600; margin-top:20px; }
.bel-status { font-size:16px; color:var(--muted); margin-top:8px; }
.bel-knoppen { display:flex; gap:20px; margin-top:30px; }
.bel-btn { width:64px; height:64px; border-radius:50%; border:none; cursor:pointer; font-size:26px; display:flex; align-items:center; justify-content:center; }
.btn-ophangen { background:#f87171; }
.btn-opnemen { background:#22c55e; }
.btn-mic { background:var(--card); border:0.5px solid var(--border); }
video { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; display:none; }
.overlay { position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; }
.terug-btn { position:fixed; top:16px; left:16px; z-index:10; background:rgba(0,0,0,0.4); border:0.5px solid var(--border); border-radius:20px; padding:8px 14px; color:var(--text); font-size:13px; cursor:pointer; }
.gesprek-tijd { font-size:18px; color:var(--accent); font-family:monospace; margin-top:8px; }
#lokaalMedia { position:fixed; bottom:120px; right:16px; width:100px; height:140px; border-radius:12px; object-fit:cover; z-index:3; border:2px solid rgba(255,255,255,0.3); background:#111; }
</style>
<link rel="stylesheet" href="android-fix.css">
</head>
<body>
<button class="terug-btn" onclick="window.location.href='chat.html'">← terug</button>
<audio id="remoteAudio" autoplay style="display:none"></audio>
<video id="remoteMedia" autoplay playsinline></video>
<video id="lokaalMedia" autoplay playsinline muted></video>
<div class="overlay" id="ui">
  <div class="bel-avatar" id="avatar">👤</div>
  <div class="bel-naam" id="naam">Laden...</div>
  <div class="bel-status" id="status">Verbinden...</div>
  <div class="gesprek-tijd" id="tijd" style="display:none">0:00</div>
  <div class="bel-knoppen" id="knoppen-keuze" style="display:none;flex-direction:column;align-items:center;gap:16px;">
    <button onclick="startBellen(false)" style="width:200px;height:56px;border-radius:28px;background:#22c55e;border:none;font-size:18px;cursor:pointer;color:white;font-weight:600;">📞 Bellen</button>
    <button onclick="startBellen(true)" style="width:200px;height:56px;border-radius:28px;background:#3b82f6;border:none;font-size:18px;cursor:pointer;color:white;font-weight:600;">📹 Videobellen</button>
    <button onclick="window.location.href='chat.html'" style="width:200px;height:56px;border-radius:28px;background:rgba(255,255,255,0.1);border:0.5px solid rgba(255,255,255,0.2);font-size:16px;cursor:pointer;color:white;">Annuleer</button>
  </div>
  <div class="bel-knoppen" id="knoppen-bellen">
    <button class="bel-btn btn-ophangen" onclick="annuleer()">📵</button>
  </div>
  <div class="bel-knoppen" id="knoppen-inkomend" style="display:none;flex-direction:column;gap:10px;">
    <div style="display:flex;gap:14px;justify-content:center;">
      <button class="bel-btn btn-ophangen" onclick="weiger()">📵</button>
      <button class="bel-btn btn-opnemen" onclick="neem(false)" title="Audio opnemen">📞</button>
      <button class="bel-btn btn-opnemen" onclick="neem(true)" title="Video opnemen">📹</button>
    </div>
  </div>
  <div class="bel-knoppen" id="knoppen-gesprek" style="display:none">
    <button class="bel-btn btn-mic" id="micBtn" onclick="togMic()">🎤</button>
    <button class="bel-btn btn-mic" id="camBtn" onclick="togCam()">📷</button>
    <button class="bel-btn btn-ophangen" onclick="hangop()">📵</button>
  </div>
</div>
<script>
// ── Beltoon (in code gemaakt, geen geluidsbestanden) ──
// 'uitgaand' = overgaan voor wie belt: 425 Hz, 1 s aan / 4 s uit (zoals in Nederland)
// 'inkomend' = beltoon voor wie gebeld wordt: belletje-deuntje, elke 2,5 s
let belCtx = null, belHerhaal = null, belMax = null, belSoort = null
function belContext() {
  try {
    if (!belCtx) {
      const AC = window.AudioContext || window.webkitAudioContext
      if (!AC) return null
      belCtx = new AC()
    }
    if (belCtx.state === 'suspended') belCtx.resume().catch(() => {})
  } catch (e) { return null }
  return belCtx
}
function belNoot(ctx, freq, start, duur, vol) {
  const osc = ctx.createOscillator(), gain = ctx.createGain()
  osc.type = 'sine'; osc.frequency.value = freq
  osc.connect(gain); gain.connect(ctx.destination)
  gain.gain.setValueAtTime(0.0001, start)
  gain.gain.exponentialRampToValueAtTime(vol, start + 0.02)
  gain.gain.setValueAtTime(vol, start + Math.max(0.02, duur - 0.2))
  gain.gain.exponentialRampToValueAtTime(0.0001, start + duur)
  osc.start(start); osc.stop(start + duur + 0.05)
}
function speelOvergaan() {
  const ctx = belContext()
  if (!ctx || ctx.state !== 'running') return // nog geen geluid toegestaan: overslaan i.p.v. opstapelen
  const t = ctx.currentTime + 0.03
  belNoot(ctx, 425, t, 1.0, 0.15)
}
function speelBeltoon() {
  if (navigator.vibrate) { try { navigator.vibrate([300, 150, 300]) } catch (e) {} }
  const ctx = belContext()
  if (!ctx || ctx.state !== 'running') return
  const t = ctx.currentTime + 0.03
  const noten = [784, 988, 1175, 988, 784, 988, 1175, 1568] // G-B-D, twee keer, hoog eind
  noten.forEach((f, i) => belNoot(ctx, f, t + i * 0.14, 0.32, 0.28))
}
function startBeltoon(soort = 'uitgaand') {
  stopBeltoon()
  belSoort = soort
  const speel = soort === 'inkomend' ? speelBeltoon : speelOvergaan
  speel()
  belHerhaal = setInterval(speel, soort === 'inkomend' ? 2500 : 5000)
  belMax = setTimeout(stopBeltoon, 46000) // nooit langer dan de beltijd van 45 s
}
function stopBeltoon() {
  if (belHerhaal) { clearInterval(belHerhaal); belHerhaal = null }
  if (belMax) { clearTimeout(belMax); belMax = null }
  belSoort = null
  if (navigator.vibrate) { try { navigator.vibrate(0) } catch (e) {} }
}
// Browsers staan geluid pas toe na een tik: bij de eerste tik de beltoon alsnog aanzetten
;['pointerdown', 'touchstart', 'keydown'].forEach(ev =>
  document.addEventListener(ev, () => { if (belSoort) belContext() }, { passive: true, capture: true })
)
</script>
<script type="module">
import { supabase } from './supabase.js?v=95'
import { initBellen, belOp, accepteerOproep, weigerooproep, hangOp, toggleMic, zetVriendId, schakelVideo, isVideoActiefLokaal } from './bellen.js?v=95'

const params = new URLSearchParams(window.location.search)
const vriendId = params.get('vriend')
const vriendNaam = params.get('naam') || 'Vriend'
let timer = null, sec = 0, micAan = true, videoModus = false
// Wachtkanaal voor een inkomende oproep: hoort het als de beller ophangt, en laat de beller weten als je weigert
let wachtKanaal = null
function gesprekKanaalNaam(a, b) { const ids = [a, b].sort(); return 'belgesprek_' + ids[0] + '_' + ids[1] }
function sluitWachtKanaal() { if (wachtKanaal) { supabase.removeChannel(wachtKanaal); wachtKanaal = null } }

document.getElementById('naam').textContent = vriendNaam

const { data: { session } } = await supabase.auth.getSession()

// ── Weergavenaam van een vriend: via P2P ontvangen en lokaal bewaard ──
function belNaam(vriendId, username) {
  try {
    const n = String(localStorage.getItem('vriend_naam_' + vriendId + '_' + (session?.user?.id || '')) || '').trim()
    if (n) return n
  } catch(e) {}
  return username || 'Vriend'
}
if (!session) { window.location.href = 'login.html' }

initBellen(session.user.id, {
  onVerbonden: () => { stopBeltoon(); startTimer() },
  onVideoStatus: (actief) => {
    const remoteMedia = document.getElementById('remoteMedia')
    if (remoteMedia) remoteMedia.style.display = actief ? 'block' : 'none'
    document.getElementById('status').textContent = actief ? '📹 Video aan' : '📞 Audio'
    setTimeout(() => { if (timer) document.getElementById('status').textContent = 'Verbonden' }, 1500)
  },
  onOproep: async (info) => {
    const { data: v } = await supabase.from('profiles').select('*').eq('id', info.van).single()
    document.getElementById('avatar').textContent = v?.avatar_url || '👤'
    document.getElementById('naam').textContent = belNaam(info.van, v?.username)
    document.getElementById('status').textContent = (videoModus ? '📹 Videogesprek — ' : '📞 Belt je op...')
    document.getElementById('knoppen-bellen').style.display = 'none'
    document.getElementById('knoppen-inkomend').style.display = 'flex'
    startBeltoon('inkomend')
  },
  onEind: (doorOns) => {
    stopBeltoon()
    const wasVerbonden = !!timer
    clearInterval(timer)
    if (!wasVerbonden && !doorOns) document.getElementById('status').textContent = 'Niet opgenomen'
    setTimeout(() => window.location.href = 'chat.html', wasVerbonden ? 800 : 1500)
  }
})

if (vriendId && !params.get('inkomend')) {
  // Toon keuzescherm
  document.getElementById('knoppen-bellen').style.display = 'none'
  document.getElementById('status').textContent = 'Kies hoe je wilt bellen'
  document.getElementById('knoppen-keuze').style.display = 'flex'
} else if (vriendId && params.get('inkomend')) {
  // Geef vriendId door aan bellen.js zodat accepteerOproep het kanaal kan openen
  zetVriendId(vriendId)
  videoModus = params.get('video') === '1'
  // Inkomend gesprek: direct opnemen-scherm tonen
  document.getElementById('knoppen-keuze').style.display = 'none'
  document.getElementById('knoppen-bellen').style.display = 'none'
  document.getElementById('knoppen-inkomend').style.display = 'flex'
  document.getElementById('status').textContent = (videoModus ? '📹 Videogesprek — ' : '📞 Belt je op...')
  startBeltoon('inkomend')
  wachtKanaal = supabase
    .channel(gesprekKanaalNaam(session.user.id, vriendId), { config: { broadcast: { self: false } } })
    .on('broadcast', { event: 'signaal' }, (msg) => {
      if (msg.payload?.type !== 'ophangen') return
      // Beller hing op voordat er werd opgenomen
      stopBeltoon(); sluitWachtKanaal()
      document.getElementById('knoppen-inkomend').style.display = 'none'
      document.getElementById('status').textContent = 'Gemiste oproep'
      setTimeout(() => window.location.href = 'chat.html', 1500)
    })
    .subscribe()
  // Niemand neemt op: na de beltijd terug naar de chat
  setTimeout(() => { if (!timer && wachtKanaal) { stopBeltoon(); sluitWachtKanaal(); window.location.href = 'chat.html' } }, 46000)
  // Laad beller info
  const { data: v } = await supabase.from('profiles').select('*').eq('id', vriendId).single()
  if (v) {
    document.getElementById('avatar').textContent = v.avatar_url || '👤'
    document.getElementById('naam').textContent = belNaam(vriendId, v.username)
  }
}

function startTimer() {
  // iOS fix: audio moet gestart worden na gebruikersinteractie
  const audioEl = document.getElementById('remoteAudio')
  if (audioEl) { audioEl.play().catch(e => console.log('audio play:', e)) }
  document.getElementById('knoppen-bellen').style.display = 'none'
  document.getElementById('knoppen-inkomend').style.display = 'none'
  document.getElementById('knoppen-gesprek').style.display = 'flex'
  document.getElementById('status').textContent = 'Verbonden'
  document.getElementById('tijd').style.display = 'block'
  if (videoModus) {
    document.getElementById('remoteMedia').style.display = 'block'
    document.getElementById('lokaalMedia').style.display = 'block'
  } else {
    document.getElementById('remoteMedia').style.display = 'none'
    document.getElementById('lokaalMedia').style.display = 'none'
  }
  timer = setInterval(() => {
    sec++
    const m = Math.floor(sec/60), s = sec%60
    document.getElementById('tijd').textContent = m+':'+String(s).padStart(2,'0')
  }, 1000)
}

window.startBellen = async (video) => {
  belContext() // geluid 'ontgrendelen' nu de tik nog vers is
  videoModus = video
  document.getElementById('knoppen-keuze').style.display = 'none'
  document.getElementById('knoppen-bellen').style.display = 'flex'
  document.getElementById('status').textContent = video ? 'Videobellen...' : 'Aan het bellen...'
  const gelukt = await belOp(vriendId, video)
  if (gelukt) startBeltoon('uitgaand')
}
window.annuleer = async () => { stopBeltoon(); await hangOp(); window.location.href = 'chat.html' }
window.weiger = async () => {
  stopBeltoon()
  if (wachtKanaal) {
    // Via het wachtkanaal, zodat de beller het echt hoort
    try { await wachtKanaal.send({ type: 'broadcast', event: 'signaal', payload: { type: 'ophangen', data: {} } }) } catch (e) {}
    sluitWachtKanaal()
  } else {
    await weigerooproep()
  }
  window.location.href = 'chat.html'
}
window.neem = async (video) => {
  stopBeltoon()
  sluitWachtKanaal() // bellen.js opent zelf het gesprekskanaal
  videoModus = video
  const ok = await accepteerOproep(video)
  if(ok) document.getElementById('status').textContent = 'Verbinding maken...'
}
window.hangop = async () => { stopBeltoon(); await hangOp(); window.location.href = 'chat.html' }
window.togMic = () => { micAan = toggleMic(); document.getElementById('micBtn').textContent = micAan ? '🎤' : '🔇' }
window.togCam = async () => {
  const camAan = isVideoActiefLokaal()
  const ok = await schakelVideo(!camAan)
  if (ok) {
    document.getElementById('camBtn').textContent = !camAan ? '📷' : '🚫'
    document.getElementById('lokaalMedia').style.display = !camAan ? 'block' : 'none'
  }
}
</script>
</body>
</html>
