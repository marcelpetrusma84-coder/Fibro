<!DOCTYPE html>
<html lang="nl" data-taal style="background:#1a0a2e">
<head>
<meta charset="UTF-8">
<!-- fediverse-terug.html (25 nov 2026): hier stuurt je eigen fediverse-server je naartoe na het inloggen (fediverse.js).
     De inlogcode wordt via de server van Stekky omgeruild voor een inlogsleutel; die blijft op dit toestel. Daarna terug. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://qmgatbphiplrfxrljtbe.supabase.co wss://qmgatbphiplrfxrljtbe.supabase.co; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1a0a2e">
<script src="huisregel.js?v=2"></script>
<script src="foutmelder.js?v=4"></script>
<script src="taal.js?v=151"></script>
<title>Stekky</title>
<link href="lettertypen/basis.css?v=1" rel="stylesheet">
<style>
body { margin:0; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px; box-sizing:border-box;
  background:linear-gradient(160deg,#8b3fd1 0%,#6a2bab 45%,#1a0a2e 100%); color:#fff; font-family:'DM Sans',sans-serif; text-align:center; }
.kaart { max-width:360px; background:rgba(26,10,46,0.6); border-radius:18px; padding:24px; }
.knop { display:inline-block; margin-top:16px; background:#8b3fd1; color:#fff; border-radius:12px; padding:10px 18px; text-decoration:none; font-weight:600; }
</style>
</head>
<body>
<div class="kaart">
  <div style="font-size:36px">🐘</div>
  <p id="tekst">Bezig met inloggen…</p>
  <a id="terug" class="knop" href="index.html" hidden>Terug</a>
</div>
<script type="module">
import { supabase } from './supabase.js?v=95'
import { verwerkTerug, melding } from './fediverse.js?v=1'
const T = window.T || (s => s)
const tekst = document.getElementById('tekst'), terug = document.getElementById('terug')
tekst.textContent = T('Bezig met inloggen…')
terug.textContent = T('Terug')
const geefPas = async () => { const { data } = await supabase.auth.getSession(); return data && data.session ? data.session.access_token : null }
const zoekdeel = location.search
history.replaceState(null, '', location.pathname) // de code niet in de geschiedenis laten staan
const r = await verwerkTerug(zoekdeel, { geefPas })
terug.href = r.terugNaar || 'index.html'
if (r.ok) {
  tekst.textContent = T('Je bent ingelogd. Je gaat zo terug naar Stekky…')
  setTimeout(() => location.replace(terug.href), 900)
} else {
  tekst.textContent = r.fout === 'inloggen' ? T('Inloggen lukte niet. Probeer het nog eens.') : melding(r.fout)
  terug.hidden = false
}
</script>
</body>
</html>
