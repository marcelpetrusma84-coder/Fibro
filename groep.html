* { box-sizing:border-box; margin:0; padding:0; }
:root { --bg:#1a0a2e; --card:rgba(255,255,255,0.06); --border:rgba(255,255,255,0.14); --accent:#c084fc; --accent2:#f0abfc; --text:#ffffff; --muted:rgba(255,255,255,0.75); --knop:#8b3fd1; }
html, body { height:100%; }
body { background:var(--bg); font-family:'DM Sans',sans-serif; color:var(--text); max-width:480px; margin:0 auto; display:flex; flex-direction:column; height:100dvh; overflow:hidden; }
[hidden] { display:none !important; }
button { font-family:inherit; }
.kop { margin:10px 10px 0; padding:10px 12px; display:flex; align-items:center; gap:10px; border-radius:18px; background:rgba(255,255,255,0.07); border:1px solid var(--border); flex-shrink:0; }
.terug { flex-shrink:0; min-height:46px; padding:0 14px 0 10px; font-size:16px; font-weight:700; color:#1e0d32; border:1px solid #f6e8ff; border-radius:14px; background:linear-gradient(145deg,#f0d7ff,#cc9bf5 75%); box-shadow:inset 0 1px 0 #fff,0 3px 0 #6c458a; cursor:pointer; }
.terug:active { transform:translateY(2px); box-shadow:inset 0 1px 3px rgba(0,0,0,.25),0 1px 0 #6c458a; }
.kop-tekst { flex:1; min-width:0; display:flex; flex-direction:column; }
.kop-titel { font-family:'Playfair Display',serif; font-style:italic; font-size:20px; color:var(--accent); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.kop-naam { font-size:16px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.kop-sub { font-size:13px; color:var(--muted); }
.rond-knop { width:44px; height:44px; flex-shrink:0; border-radius:50%; border:1px solid var(--border); background:rgba(255,255,255,0.08); color:#e9d5ff; display:flex; align-items:center; justify-content:center; cursor:pointer; }
.vlak { flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:20px 16px; display:flex; flex-direction:column; gap:14px; }
.vraag { font-family:'Playfair Display',serif; font-style:italic; font-size:18px; color:var(--accent); }
.keuze { text-align:left; display:flex; align-items:center; gap:14px; padding:16px; border-radius:18px; background:var(--card); border:1px solid var(--border); color:#fff; cursor:pointer; width:100%; }
.keuze:disabled { cursor:default; opacity:.6; }
.keuze-icoon { width:54px; height:54px; flex-shrink:0; border-radius:50%; display:flex; align-items:center; justify-content:center; }

<script type="module">
  import { supabase } from './supabase.js?v=95'
  import { haalPrivateKeyOp, eigenPubliekeSleutel } from './crypto.js?v=182'
  import { versleutelGroepsbericht, openGroepsbericht, MAX_LEDEN } from './groepsleutel.js?v=1'
  import { houOpen } from './lijntjes.js?v=1'
  import { bewaardeSessieZonderInternet } from './offline.js?v=146'
  import { zoekSticker } from './stickervellen.js?v=236'

  const T = window.T || ((s, v) => String(s).replace(/\{(\w+)\}/g, (m, k) => (v && k in v) ? v[k] : m))
  const $ = id => document.getElementById(id)
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
  const GELDIG_ID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i
  const KLEUREN = ['#c084fc', '#f0abfc', '#a5b4fc', '#fcd34d', '#86efac', '#fda4af', '#7dd3fc', '#fdba74']
  const kleurVan = id => { let h = 0; for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return KLEUREN[h % KLEUREN.length] }
  const EMOJIS = ['😊','😂','❤','🔥','👍','🎉','😍','🤔','😢','😎','🌿','🌸','✨','🎵','🙌','💬','🦋','🌙','⭐','🍀','🎮','🐱','🌈','🎨']

  let ik = null, mijnPriv = null, mijnPub = null
  let groep = null, leden = [], ledenTijd = 0, lijn = null
  const getoond = new Set()

  function toast(tekst) {
    const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = tekst
    document.body.appendChild(t); setTimeout(() => t.remove(), 2600)
  }
  function toon(scherm) { for (const s of ['kiezen', 'leden', 'gesprek']) $(s).hidden = s !== scherm }
  function avatarHtml(p) {
    const a = String(p?.avatar_url || '')
    if (a && [...a].length <= 4 && !/^https?:/i.test(a)) return esc(a)
    return esc([...(p ? naamVan(p) : '?')][0].toUpperCase())
  }
  // Namen: een vriend zie je met zijn weergavenaam (die hij met jou deelde, zoals in de gewone chat), iemand die je niet
  // kent met zijn gebruikersnaam. Zijn weergavenaam krijg je niet: die deelt hij alleen met zijn vrienden.
  function naamVan(p) {
    if (!p) return T('Oud lid')
    if (p.id !== ik) { try { const n = String(localStorage.getItem('vriend_naam_' + p.id + '_' + ik) || '').trim(); if (n) return n } catch (e) {} }
    return p.username || '?'
  }
  // De server weigert een groep als iemand erin 'Groepen met onbekenden' uit heeft staan en niet iedereen kent.
  function foutTekst(error, kandidaten) {
    if (error && error.hint === 'onbekenden') {
      const wie = (kandidaten || []).find(p => p && p.id === error.details)
      return wie ? T('{naam} wil alleen in groepen waarin iedereen een vriend is.', { naam: naamVan(wie) })
        : T('Iemand wil alleen in groepen waarin iedereen een vriend is.')
    }
    return navigator.onLine ? T('Dat lukte niet') : T('Geen internet')
  }
  const tijdTekst = iso => { const d = new Date(iso); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') }

  async function sessie() {
    let { data: { session } } = await supabase.auth.getSession()
    if (!session) session = bewaardeSessieZonderInternet()
    return session
  }

  // ── Vrienden (alleen geaccepteerd) ──
  async function haalVrienden() {
    const { data, error } = await supabase.from('friendships')
      .select('friend_id, profiles!friendships_friend_id_fkey(id, username, avatar_url, public_key)')
      .eq('user_id', ik).eq('status', 'accepted')
    if (error) throw error
    return (data || []).map(r => r.profiles).filter(p => p && p.id).sort((a, b) => naamVan(a).localeCompare(naamVan(b)))
  }

  // ── 2. Nieuwe groep ──
  let soort = 'chat'
  let laatsteVrienden = []
  const gekozen = new Set()
  function werkTellerBij() {
    const max = MAX_LEDEN[soort]
    $('teller').textContent = T('{n} van {max}', { n: gekozen.size + 1, max })
    $('maakKnop').disabled = gekozen.size < 1 || !$('groepNaam').value.trim()
    for (const r of $('vriendenLijst').querySelectorAll('.vriend')) {
      const vol = gekozen.size + 1 >= max && !gekozen.has(r.dataset.id)
      r.querySelector('input').disabled = vol
      r.classList.toggle('gekozen', gekozen.has(r.dataset.id))
    }
  }
  async function startNieuw(s) {
    soort = s; gekozen.clear()
    toon('leden')
    $('groepNaam').value = ''
    $('maakMelding').textContent = ''
    const lijst = $('vriendenLijst')
    lijst.innerHTML = '<div class="leeg">' + esc(T('Even laden...')) + '</div>'
    let vrienden = []
    try { vrienden = await haalVrienden() } catch (e) { lijst.innerHTML = '<div class="leeg">' + esc(T('Laden lukte niet')) + '</div>'; return }
    if (!vrienden.length) { lijst.innerHTML = '<div class="leeg">' + esc(T('Je hebt nog geen vrienden om toe te voegen.')) + '</div>'; werkTellerBij(); return }
    lijst.innerHTML = ''
    laatsteVrienden = vrienden
    for (const v of vrienden) {
      const r = document.createElement('label'); r.className = 'vriend'; r.dataset.id = v.id
      r.innerHTML = '<span class="av" style="background:' + kleurVan(v.id) + '">' + avatarHtml(v) + '</span><span class="vriend-naam"></span><input type="checkbox">'
      r.querySelector('.vriend-naam').textContent = naamVan(v)
      r.querySelector('input').setAttribute('aria-label', T('{naam} toevoegen', { naam: naamVan(v) }))
      r.querySelector('input').addEventListener('change', e => { if (e.target.checked) gekozen.add(v.id); else gekozen.delete(v.id); werkTellerBij() })
      lijst.appendChild(r)
    }
    werkTellerBij()
  }
  $('groepNaam').addEventListener('input', werkTellerBij)
  $('maakKnop').addEventListener('click', async () => {
    const naam = $('groepNaam').value.trim()
    if (!naam || !gekozen.size) return
    $('maakKnop').disabled = true
    $('maakMelding').textContent = ''
    const { data, error } = await supabase.rpc('maak_groep', { p_naam: naam, p_soort: soort, p_leden: [...gekozen] })
    if (error || !data) {
      console.warn('[groep] maken mislukt', error)
      $('maakMelding').textContent = error && error.hint === 'onbekenden' ? foutTekst(error, laatsteVrienden)
        : navigator.onLine ? T('Groep maken lukte niet. Probeer het opnieuw.') : T('Geen internet')
      werkTellerBij(); return
    }
    history.replaceState(null, '', 'groep.html?id=' + data)
    await openGroep(data)
  })

  // ── 3. Gesprek ──
  async function haalLeden(forceer) {
    if (!forceer && leden.length && Date.now() - ledenTijd < 60000) return leden
    const { data, error } = await supabase.rpc('groep_leden_info', { p_groep: groep.id })
    if (error) throw error
    leden = data || []; ledenTijd = Date.now()
    werkKopBij()
    return leden
  }
  function werkKopBij() {
    $('groepTitel').textContent = groep?.naam || ''
    $('groepSub').textContent = leden.length ? T('{n} leden', { n: leden.length }) : ''
  }
  const lidVan = id => leden.find(l => l.id === id)

  function sysBericht(tekst) {
    const d = document.createElement('div'); d.className = 'sys'; d.textContent = tekst; $('berichten').appendChild(d)
  }
  function naarOnder() { const b = $('berichten'); b.scrollTop = b.scrollHeight }

  let vorigeAfzender = null
  async function tekenBericht(r, onder = true) {
    if (!r || getoond.has(r.id)) return
    getoond.add(r.id)
    const mijn = r.sender_id === ik
    const afz = mijn ? { id: ik, public_key: mijnPub } : lidVan(r.sender_id)
    const rij = document.createElement('div')
    rij.className = 'b-rij' + (mijn ? ' mijn' : '') + (vorigeAfzender === r.sender_id ? ' vervolg' : '')
    rij.dataset.id = r.id
    vorigeAfzender = r.sender_id
    const kleur = kleurVan(r.sender_id)
    rij.innerHTML = '<span class="av" style="background:' + kleur + '">' + avatarHtml(afz) + '</span>'
      + '<div class="b-kol">' + (mijn ? '' : '<div class="b-naam" style="color:' + kleur + '"></div>') + '<div class="bubbel"></div><div class="b-tijd">' + esc(tijdTekst(r.created_at)) + '</div></div>'
    if (!mijn) rij.querySelector('.b-naam').textContent = naamVan(afz)
    $('berichten').appendChild(rij)
    const bub = rij.querySelector('.bubbel')
    const uit = await openGroepsbericht(r.content, { groepId: groep.id, van: r.sender_id, ik, mijnPriv, afzenderPub: afz?.public_key, serverTijd: Date.parse(r.created_at) })
    if (uit.status === 'ok' || uit.status === 'tijd') {
      const fx = /^fxsticker:(f\d+-\d+)$/.exec(uit.tekst)
      const st = fx ? zoekSticker(fx[1]) : null
      if (st) {
        bub.replaceWith(Object.assign(document.createElement('img'), { className: 'b-sticker', src: st.src, alt: T('Sticker') }))
      } else {
        bub.textContent = uit.tekst
      }
    } else {
      bub.classList.add('slot')
      bub.textContent = uit.status === 'niet-voor-mij' ? T('🔒 Verstuurd voordat je lid werd')
        : !afz ? T('🔒 Van iemand die niet meer in de groep zit')
        : uit.status === 'vervalst' ? T('⚠️ [bericht klopt niet — onderweg veranderd]') : T('🔒 [versleuteld bericht — kan niet lezen]')
    }
    if (onder) naarOnder()
  }

  async function laadBerichten() {
    const { data, error } = await supabase.from('groep_berichten').select('id, sender_id, content, created_at')
      .eq('groep_id', groep.id).order('created_at', { ascending: false }).limit(100)
    if (error) { sysBericht(T('Berichten laden lukte niet')); return }
    for (const r of (data || []).reverse()) await tekenBericht(r, false)
    naarOnder()
  }
  async function haalGemist() {
    const { data } = await supabase.from('groep_berichten').select('id, sender_id, content, created_at')
      .eq('groep_id', groep.id).order('created_at', { ascending: false }).limit(50)
    for (const r of (data || []).reverse()) await tekenBericht(r)
  }

  async function openGroep(id) {
    toon('gesprek')
    $('berichten').innerHTML = ''
    getoond.clear(); vorigeAfzender = null
    const { data, error } = await supabase.from('groepen').select('id, naam, soort, maker').eq('id', id).maybeSingle()
    if (error || !data) { $('groepTitel').textContent = T('Groep'); sysBericht(T('Deze groep bestaat niet meer, of je bent geen lid.')); zetInvoer(false); return }
    groep = data
    werkKopBij()
    sysBericht(T('🔒 Berichten in deze groep zijn end-to-end versleuteld'))
    if (!mijnPriv) { sysBericht(T('Je sleutel staat niet op dit toestel. Zet hem terug met je herstelcode (Stijl > Instellingen).')); zetInvoer(false) }
    try { await haalLeden(true) } catch (e) { sysBericht(T('Leden laden lukte niet')) }
    await laadBerichten()
    lijn?.stop?.()
    lijn = houOpen('groep-' + groep.id, () => supabase
      .channel('groep-' + groep.id, { config: { private: true } })
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'groep_berichten', filter: 'groep_id=eq.' + groep.id }, async p => {
        const r = p.new
        if (r.sender_id !== ik && !lidVan(r.sender_id)) { try { await haalLeden(true) } catch (e) {} }
        await tekenBericht(r)
      }), haalGemist)
  }
  function zetInvoer(aan) { $('bericht').disabled = !aan; $('verstuur').disabled = !aan }

  let bezig = false
  async function verstuur(tekst) {
    if (!groep || !mijnPriv || bezig) return false
    bezig = true
    try {
      await haalLeden()
      const ontvangers = leden.map(l => l.id === ik ? { id: ik, public_key: mijnPub } : l)
      const { content, overgeslagen } = await versleutelGroepsbericht(tekst, { groepId: groep.id, van: ik, mijnPriv, leden: ontvangers })
      const { data, error } = await supabase.from('groep_berichten').insert({ groep_id: groep.id, sender_id: ik, content }).select('id, sender_id, content, created_at').single()
      if (error || !data) { console.warn('[groep] versturen mislukt', error); toast(navigator.onLine ? T('Niet verstuurd. Probeer het opnieuw.') : T('Geen internet')); return false }
      await tekenBericht(data)
      if (overgeslagen.length) toast(T('{n} lid kan dit nog niet lezen (geen sleutel)', { n: overgeslagen.length }))
      return true
    } catch (e) {
      console.warn('[groep] versleutelen mislukt', e); toast(T('Niet verstuurd. Probeer het opnieuw.')); return false
    } finally { bezig = false }
  }
  async function verstuurInvoer() {
    const inv = $('bericht'); const tekst = inv.value.trim()
    if (!tekst) return
    inv.value = ''
    $('emojiRaster').hidden = true
    if (!(await verstuur(tekst))) inv.value = tekst
  }
  $('verstuur').addEventListener('click', verstuurInvoer)
  $('bericht').addEventListener('keydown', e => { if (e.key === 'Enter') verstuurInvoer() })

  // chatbalk: emoji's en stickers; foto, spraak en spel komen later in groepen
  $('emojiKnop').addEventListener('click', () => {
    const r = $('emojiRaster')
    if (!r.childElementCount) for (const e of EMOJIS) {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = e
      b.addEventListener('click', () => { $('bericht').value += e; $('bericht').focus() })
      r.appendChild(b)
    }
    r.hidden = !r.hidden; $('stickerRaster').hidden = true
  })
  let stickerKeuze = null
  $('stickerKnop').addEventListener('click', async () => {
    const r = $('stickerRaster')
    if (!stickerKeuze) {
      try {
        const [{ maakStickerkeuze }, fx] = await Promise.all([import('./stickerkeuze.js?v=236'), import('./stickerfx.js?v=235')])
        stickerKeuze = maakStickerkeuze(r, { uid: () => ik, onKies: async st => {
          if (!st) return
          if (String(st.vel).startsWith('e')) { toast(T('Eigen stickers kun je nog niet in een groep sturen')); return }
          fx.speelGeluid(st.g)
          r.hidden = true
          await verstuur('fxsticker:' + st.vel + '-' + st.nr)
        } })
      } catch (e) { toast(T('Stickers laden lukte niet')); return }
    }
    r.hidden = !r.hidden; $('emojiRaster').hidden = true
    if (!r.hidden) stickerKeuze.vernieuw?.()
  })
  for (const b of document.querySelectorAll('.balk-knop.later')) b.addEventListener('click', () => toast(T('Komt binnenkort in groepen')))

  // ── Leden ──
  async function tekenLedenPaneel() {
    await haalLeden(true).catch(() => {})
    const ikBeheerder = lidVan(ik)?.rol === 'beheerder'
    const lijst = $('ledenLijst'); lijst.innerHTML = ''
    for (const l of leden) {
      const r = document.createElement('div'); r.className = 'lid'
      r.innerHTML = '<span class="av" style="background:' + kleurVan(l.id) + '">' + avatarHtml(l) + '</span><span class="vriend-naam"></span>'
      const naam = r.querySelector('.vriend-naam')
      naam.textContent = naamVan(l) + (l.id === ik ? ' (' + T('jij') + ')' : '')
      if (l.rol === 'beheerder') { const s = document.createElement('span'); s.className = 'lid-rol'; s.textContent = T('beheerder'); r.appendChild(s) }
      if (ikBeheerder && l.id !== ik) {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'klein-knop rood'; b.textContent = T('Weghalen')
        b.addEventListener('click', async () => {
          if (!confirm(T('{naam} uit de groep halen?', { naam: naamVan(l) }))) return
          const { error } = await supabase.rpc('groep_lid_weg', { p_groep: groep.id, p_lid: l.id })
          if (error) toast(T('Dat lukte niet')); else tekenLedenPaneel()
        })
        r.appendChild(b)
      }
      lijst.appendChild(r)
    }
    $('toevoegenDeel').hidden = !ikBeheerder
    if (ikBeheerder) {
      const tl = $('toevoegenLijst'); tl.innerHTML = ''
      const max = MAX_LEDEN[groep.soort] || 50
      let vrienden = []
      try { vrienden = (await haalVrienden()).filter(v => !lidVan(v.id)) } catch (e) {}
      if (leden.length >= max) tl.innerHTML = '<div class="leeg">' + esc(T('De groep is vol ({max})', { max })) + '</div>'
      else if (!vrienden.length) tl.innerHTML = '<div class="leeg">' + esc(T('Al je vrienden zitten al in de groep')) + '</div>'
      else for (const v of vrienden) {
        const r = document.createElement('div'); r.className = 'lid'
        r.innerHTML = '<span class="av" style="background:' + kleurVan(v.id) + '">' + avatarHtml(v) + '</span><span class="vriend-naam"></span>'
        r.querySelector('.vriend-naam').textContent = naamVan(v)
        const b = document.createElement('button'); b.type = 'button'; b.className = 'klein-knop'; b.textContent = T('Toevoegen')
        b.addEventListener('click', async () => {
          b.disabled = true
          const { error } = await supabase.rpc('groep_lid_toevoegen', { p_groep: groep.id, p_lid: v.id })
          if (error) { toast(foutTekst(error, [v, ...leden])); b.disabled = false } else tekenLedenPaneel()
        })
        r.appendChild(b); tl.appendChild(r)
      }
    }
  }
  $('ledenKnop').addEventListener('click', () => { $('ledenPaneel').hidden = false; tekenLedenPaneel() })
  $('paneelDicht').addEventListener('click', () => { $('ledenPaneel').hidden = true })
  $('ledenPaneel').addEventListener('click', e => { if (e.target.id === 'ledenPaneel') $('ledenPaneel').hidden = true })
  $('verlaatKnop').addEventListener('click', async () => {
    if (!confirm(T('Wil je de groep "{naam}" verlaten?', { naam: groep?.naam || '' }))) return
    const { error } = await supabase.rpc('groep_lid_weg', { p_groep: groep.id, p_lid: ik })
    if (error) { toast(T('Dat lukte niet')); return }
    location.href = 'chat.html'
  })

  // ── Terug ──
  $('kiezenTerug').addEventListener('click', () => { location.href = 'chat.html' })
  $('ledenTerug').addEventListener('click', () => toon('kiezen'))
  $('gesprekTerug').addEventListener('click', () => { lijn?.stop?.(); location.href = 'chat.html' })
  for (const b of document.querySelectorAll('.keuze[data-soort]')) b.addEventListener('click', () => startNieuw(b.dataset.soort))

  // ── Start ──
  async function init() {
    const s = await sessie()
    if (!s) { location.href = 'login.html'; return }
    ik = s.user.id
    mijnPriv = haalPrivateKeyOp(ik)
    if (mijnPriv) { try { mijnPub = await eigenPubliekeSleutel(mijnPriv) } catch (e) { mijnPriv = null } }
    const id = new URLSearchParams(location.search).get('id')
    if (id && GELDIG_ID.test(id)) await openGroep(id)
    else toon('kiezen')
  }
  init()
</script>
</body>
</html>
