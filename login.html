<!DOCTYPE html>
<html lang="nl" style="background:#1a0a2e;">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fibro — Inloggen</title>
  <style>
    @import url('lettertypen/basis.css?v=1');
    :root { --bg:#1a0a2e; --surface:#161618; --border:#2a2a2e; --accent:#c084fc; --accent-dim:#f0abfc; --text:#f3e8ff; --text-muted:#666660; --danger:#ff5c5c; --radius:12px; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--bg); color:var(--text); font-family:'DM Mono',monospace; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px; overflow:hidden; }
    body::before { content:''; position:fixed; inset:0; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E"); pointer-events:none; z-index:0; }
    .container { width:100%; max-width:420px; position:relative; z-index:1; animation:fadeUp 0.4s ease both; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
    .logo { text-align:center; margin-bottom:40px; }
    .logo h1 { font-family:'DM Serif Display',serif; font-size:48px; letter-spacing:-1px; color:var(--text); }
    .logo h1 span { color:var(--accent); }
    .logo p { font-size:11px; color:var(--text-muted); letter-spacing:2px; text-transform:uppercase; margin-top:6px; }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:32px; }
    .tabs { display:flex; gap:4px; margin-bottom:28px; background:var(--bg); padding:4px; border-radius:8px; }
    .tab { flex:1; padding:8px; border:none; background:transparent; color:var(--text-muted); font-family:'DM Mono',monospace; font-size:12px; letter-spacing:1px; text-transform:uppercase; cursor:pointer; border-radius:6px; transition:all 0.2s; }
    .tab.active { background:var(--surface); color:var(--accent); border:1px solid var(--border); }
    .panel { display:none; }
    .panel.active { display:block; }
    .field { margin-bottom:16px; }
    label { display:block; font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--text-muted); margin-bottom:8px; }
    input { width:100%; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:12px 16px; color:var(--text); font-family:'DM Mono',monospace; font-size:16px !important; outline:none; transition:border-color 0.2s,transform 0.2s; }
    input:focus { border-color:var(--accent); }
    input::placeholder { color:var(--text-muted); }
    .btn { width:100%; padding:14px; border:none; border-radius:8px; font-family:'DM Mono',monospace; font-size:13px; letter-spacing:1px; text-transform:uppercase; cursor:pointer; transition:all 0.2s; margin-top:8px; min-height:44px; }
    .btn-primary { background:var(--accent); color:#0d0d0f; font-weight:500; }
    .btn-primary:hover { background:#d4ff6e; transform:translateY(-1px); }
    .btn-primary:disabled { opacity:0.5; cursor:not-allowed; transform:none; }
    .btn-ghost { background:transparent; color:var(--text-muted); border:1px solid var(--border); margin-top:12px; }
    .message { padding:12px 16px; border-radius:8px; font-size:13px; margin-bottom:16px; display:none; }
    .message.error { background:rgba(255,92,92,0.1); border:1px solid rgba(255,92,92,0.3); color:var(--danger); display:block; }
    .message.success { background:rgba(192,132,252,0.1); border:1px solid rgba(192,132,252,0.3); color:var(--accent); display:block; }
    .herstelsleutel-info { font-size:12px; color:var(--text-muted); line-height:1.6; margin-top:16px; padding:12px; border:1px dashed var(--border); border-radius:8px; }
    .spinner { display:inline-block; width:14px; height:14px; border:2px solid rgba(13,13,15,0.3); border-top-color:#0d0d0f; border-radius:50%; animation:spin 0.6s linear infinite; margin-right:8px; vertical-align:middle; }
    @keyframes spin { to{transform:rotate(360deg)} }
    .e2e-badge { display:inline-flex; align-items:center; gap:5px; background:rgba(34,197,94,0.1); border:0.5px solid rgba(34,197,94,0.3); border-radius:20px; padding:3px 8px; font-size:10px; color:#22c55e; margin-top:8px; }
  </style>
  <link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="android-fix.css?v=1">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="stijl.css?v=3">
</head>
<body>

<div class="container">
  <div class="logo">
    <h1>Fi<span>b</span>ro</h1>
    <p>Jouw persoonlijke ruimte</p>
  </div>

  <div class="card">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('inloggen')">Inloggen</button>
      <button class="tab" onclick="switchTab('registreren')">Registreren</button>
      <button class="tab" onclick="switchTab('herstellen')">Herstel</button>
    </div>

    <!-- INLOGGEN -->
    <div class="panel active" id="panel-inloggen">
      <div class="message" id="login-msg"></div>
      <div class="field">
        <label>Gebruikersnaam</label>
        <input type="text" id="login-username" placeholder="bijv. ChonkyCapibara404" autocomplete="username" />
      </div>
      <div class="field">
        <label>Wachtwoord</label>
        <input type="password" id="login-wachtwoord" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <button class="btn btn-primary" onclick="inloggen()" id="login-btn">Inloggen</button>
      <div style="text-align:center;margin-top:8px;">
        <span class="e2e-badge">🔒 End-to-end versleuteld</span>
      </div>
    </div>

    <!-- REGISTREREN -->
    <div class="panel" id="panel-registreren">
      <div class="message" id="reg-msg"></div>
      <div id="reg-form">
        <div class="field">
          <label>Gebruikersnaam</label>
          <div style="display:flex;gap:8px;align-items:center;">
            <input type="text" id="reg-username" placeholder="Klik op 🎲 voor een naam" autocomplete="off" readonly style="flex:1;cursor:default;" />
            <button type="button" onclick="nieuweNaam()" style="background:var(--accent);border:none;border-radius:8px;padding:12px 14px;font-size:18px;cursor:pointer;flex-shrink:0;min-height:44px;">🎲</button>
          </div>
          <div style="font-size:11px;color:var(--text-muted);margin-top:4px;">⚠ Onthoud deze naam — je hebt hem nodig om in te loggen</div>
        </div>
        <div class="field">
          <label>Wachtwoord</label>
          <input type="password" id="reg-wachtwoord" placeholder="Minimaal 8 tekens" autocomplete="new-password" />
        </div>
        <div class="field">
          <label>Geboortejaar</label>
          <input type="number" id="reg-jaar" placeholder="bijv. 2005" min="1900" max="2025" />
        </div>
        <div class="field" style="display:flex;align-items:flex-start;gap:10px;margin-top:4px;">
          <input type="checkbox" id="reg-akkoord" style="width:18px;height:18px;margin-top:2px;flex-shrink:0;" />
          <label for="reg-akkoord" style="text-transform:none;letter-spacing:0;font-size:12px;line-height:1.5;cursor:pointer;">
            Ik ga akkoord met de <span style="color:var(--accent)">spelregels van Fibro</span>
          </label>
        </div>
        <button class="btn btn-primary" onclick="registreren()" id="reg-btn">Account aanmaken</button>
        <div class="herstelsleutel-info">💡 Na registratie zet je herstel met Face ID of je vingerafdruk aan.</div>
      </div>
    </div>

    <!-- HERSTEL -->
    <div class="panel" id="panel-herstellen">
      <div class="message" id="herstel-msg"></div>
      <div class="field">
        <label>Gebruikersnaam</label>
        <input type="text" id="herstel-username" placeholder="jouwuniekename" />
      </div>
      <div class="field">
        <label>Wachtwoord</label>
        <input type="password" id="herstel-wachtwoord" placeholder="je wachtwoord" autocomplete="current-password" />
      </div>
      <div class="field">
        <label>Herstelsleutel</label>
        <div style="display:flex;align-items:center;gap:0;">
          <span style="background:rgba(255,255,255,0.06);border:1px solid var(--border);border-right:none;border-radius:8px 0 0 8px;padding:10px 10px;font-size:14px;color:var(--text-muted);white-space:nowrap;">FIBRO-</span>
          <input type="text" id="herstelsleutel-input" placeholder="XXXXXXXXXXXX" maxlength="14" autocapitalize="characters" autocorrect="off" spellcheck="false" style="border-radius:0 8px 8px 0;flex:1;letter-spacing:1px;" oninput="formatHerstel(this)" />
        </div>
      </div>
      <button class="btn btn-primary" onclick="herstelMetSleutel()">Account herstellen</button>
      <div style="text-align:center;font-size:12px;opacity:0.6;margin:12px 0 2px;">of</div>
      <button class="btn btn-primary" onclick="herstelMetFaceId()">Herstel met Face ID</button>
    </div>
  </div>
</div>

<script type="module">
  import { createClient } from './supabase-lib.js?v=1'
  import { genereerKeypair, slaPrivateKeyOp, haalPrivateKeyOp, ontsleutelPrivateKey, normaliseerHerstelSleutel, versleutelPrivateKey } from './crypto.js?v=95'
  import { passkeyStatus, lijstDozen, maakDoos, openDoos, sleutelPastBij } from './passkey-kluis.js?v=1'

  const supabase = createClient(
    'https://qmgatbphiplrfxrljtbe.supabase.co',
    'sb_publishable_pyFn83YMR7K2O8K1s7g4YQ_mSJZwGSf'
  )

  // ── E2E: Controleer en maak keypair aan als die ontbreekt ──
  async function controleerKeypair(userId) {
    try {
      const bestaand = haalPrivateKeyOp(userId)
      const { data: prof } = await supabase.from('profiles').select('public_key').eq('id', userId).single()
      if (bestaand && prof?.public_key) return // Sleutelpaar compleet

      // VEILIGHEID: nooit een nieuwe keypair maken als er al een public_key
      // bestaat. Dat zou alle oude berichten permanent onleesbaar maken.
      if (!bestaand && prof?.public_key) {
        console.warn('Private key ontbreekt op dit apparaat, maar er bestaat al een public_key. Geen nieuwe keypair aangemaakt.')
        sessionStorage.setItem('fibro_sleutel_mist', '1')
        return
      }

      // Genereer nieuw keypair
      const keypair = await genereerKeypair()
      slaPrivateKeyOp(userId, keypair.privateKeyB64)
      await supabase.from('profiles').update({
        public_key: keypair.publicKeyB64
      }).eq('id', userId)

      console.log('🔒 Nieuw E2E keypair aangemaakt voor bestaand account')
    } catch(e) {
      console.error('Keypair aanmaken mislukt:', e)
    }
  }

  // ── Naam generator ──
  // --- Face ID-herstel (passkey + dichte doos, zie passkey-kluis.js) ---
  async function kanFaceIdGebruiken() {
    try { const s = await passkeyStatus(); return !!(s.passkeys && s.prf !== false) } catch (e) { return false }
  }

  function faceIdFoutTekst(e) {
    const c = e && e.code
    if (c === 'geannuleerd') return 'Geannuleerd. Probeer het opnieuw, of kies later.'
    if (c === 'bestaat-al') return 'Hier bestaat al een Fibro-passkey voor dit account.'
    if (c === 'geen-prf') return 'Deze browser kan Face ID-herstel niet gebruiken.'
    if (c === 'geen-doos') return 'Er is nog geen Face ID-herstel voor dit account.'
    if (c === 'past-niet') return 'De sleutel in de doos past niet bij je account.'
    return 'Mislukt: ' + ((e && e.message) || e)
  }

  // Venster over de pagina. actie() mag een fout gooien: dan blijft het venster open met de melding.
  function faceIdVenster({ titel, tekst, ja, nee, actie }) {
    return new Promise(resolve => {
      const achter = document.createElement('div')
      achter.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(10,4,20,0.82);display:flex;align-items:center;justify-content:center;padding:20px;'
      const kaart = document.createElement('div')
      kaart.style.cssText = 'max-width:360px;width:100%;background:var(--bg,#1a0a2e);border:1px solid var(--accent,#c084fc);border-radius:16px;padding:22px;text-align:center;color:var(--text,#f3e8ff);'
      const ic = document.createElement('div'); ic.style.cssText = 'font-size:36px;margin-bottom:8px;'; ic.textContent = '\u{1F512}'
      const h = document.createElement('div'); h.style.cssText = 'font-size:17px;font-weight:600;margin-bottom:8px;'; h.textContent = titel
      const p = document.createElement('div'); p.style.cssText = 'font-size:13px;line-height:1.6;opacity:0.85;margin-bottom:14px;'; p.textContent = tekst
      const melding = document.createElement('div'); melding.style.cssText = 'font-size:13px;min-height:18px;margin-bottom:10px;'
      const knopJa = document.createElement('button'); knopJa.className = 'btn btn-primary'; knopJa.style.width = '100%'; knopJa.textContent = ja
      const knopNee = document.createElement('button'); knopNee.textContent = nee
      knopNee.style.cssText = 'width:100%;margin-top:10px;background:none;border:none;color:inherit;opacity:0.7;font-size:13px;cursor:pointer;padding:8px;'
      kaart.append(ic, h, p, melding, knopJa, knopNee)
      achter.append(kaart)
      document.body.append(achter)
      const sluit = (w) => { achter.remove(); resolve(w) }
      knopNee.onclick = () => sluit(false)
      knopJa.onclick = async () => {
        knopJa.disabled = true; knopNee.disabled = true
        melding.style.color = 'inherit'; melding.textContent = 'Even geduld...'
        try {
          const klaar = await actie()
          melding.style.color = '#4ade80'; melding.textContent = klaar || 'Gelukt!'
          setTimeout(() => sluit(true), 1000)
        } catch (e) {
          melding.style.color = '#f87171'; melding.textContent = faceIdFoutTekst(e)
          knopJa.disabled = false; knopNee.disabled = false
          knopJa.textContent = 'Opnieuw proberen'
        }
      }
    })
  }

  const FACEID_LATER_DAGEN = 14
  function faceIdLaterGekozen(userId) {
    try {
      const t = parseInt(localStorage.getItem('fibro_faceid_later_' + userId) || '0', 10)
      return !!t && (Date.now() - t) < FACEID_LATER_DAGEN * 86400000
    } catch (e) { return false }
  }
  function faceIdZetLater(userId) {
    try { localStorage.setItem('fibro_faceid_later_' + userId, String(Date.now())) } catch (e) {}
  }

  // Doos openen en de sleutel op dit toestel zetten, alleen als hij bij het profiel past
  async function ontgrendelMetFaceId(userId, publiek) {
    const r = await openDoos(supabase, userId)
    if (!(await sleutelPastBij(r.privateKeyB64, publiek))) { const e = new Error('past niet'); e.code = 'past-niet'; throw e }
    slaPrivateKeyOp(userId, r.privateKeyB64)
    try { sessionStorage.removeItem('fibro_sleutel_mist') } catch (e) {}
    return 'Gelukt! Je berichten zijn weer leesbaar.'
  }

  async function ontgrendelVenster(userId, publiek) {
    return faceIdVenster({
      titel: 'Ontgrendel je berichten',
      tekst: 'Dit toestel heeft je sleutel nog niet. Ontgrendel met Face ID, je vingerafdruk of je toestelcode. Op een pc kun je je telefoon gebruiken via de QR-code.',
      ja: 'Ontgrendel met Face ID', nee: 'Later',
      actie: () => ontgrendelMetFaceId(userId, publiek)
    })
  }

  // Na inloggen: geen sleutel -> ontgrendelen aanbieden; wel sleutel maar geen doos -> aanzetten aanbieden
  async function naInloggenFaceId(userId, username) {
    try {
      if (!(await kanFaceIdGebruiken())) return
      const { data: prof } = await supabase.from('profiles').select('public_key, username').eq('id', userId).single()
      const publiek = prof && prof.public_key
      if (!publiek) return
      const naam = username || (prof && prof.username) || ''
      let dozen = []
      try { dozen = await lijstDozen(supabase, userId) } catch (e) { return }
      const lokaal = haalPrivateKeyOp(userId)
      if (!lokaal) {
        if (dozen.length) await ontgrendelVenster(userId, publiek)
      } else if (!dozen.length && !faceIdLaterGekozen(userId) && await sleutelPastBij(lokaal, publiek)) {
        const gedaan = await faceIdVenster({
          titel: 'Face ID-herstel aanzetten?',
          tekst: 'Dan krijg je je berichten op een nieuw toestel terug met alleen Face ID of je vingerafdruk, zonder herstelcode. De server bewaart alleen een dichte doos die hij zelf niet kan openen.',
          ja: 'Face ID-herstel aanzetten', nee: 'Niet nu',
          actie: async () => { await maakDoos(supabase, { userId, gebruikersnaam: naam, privateKeyB64: lokaal }); return 'Face ID-herstel staat aan.' }
        })
        if (!gedaan) faceIdZetLater(userId)
      }
    } catch (e) { console.warn('[faceid]', e) }
  }

  // Reserve voor wie geen Face ID-herstel kan of wil: de oude herstelcode
  async function maakHerstelcodeReserve(userId, privateKeyB64) {
    const code = maakHerstelSleutel()
    const hsHash = Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(code)))).map(b => b.toString(16).padStart(2, '0')).join('')
    await supabase.rpc('zet_herstelsleutel', { hash_in: hsHash })
    const kluisBlob = await versleutelPrivateKey(privateKeyB64, code)
    await supabase.from('sleutel_kluis').upsert({ user_id: userId, blob: kluisBlob })
    return code
  }

  function regKnop(tekst, hoofd) {
    const k = document.createElement('button')
    k.textContent = tekst
    if (hoofd) { k.className = 'btn btn-primary'; k.style.width = '100%' }
    else k.style.cssText = 'width:100%;margin-top:10px;background:none;border:none;color:inherit;opacity:0.7;font-size:13px;cursor:pointer;padding:8px;'
    return k
  }

  async function toonHerstelcodeNaRegistratie(userId, privateKeyB64) {
    const vak = document.getElementById('reg-form')
    vak.textContent = 'Herstelcode maken...'
    let code
    try { code = await maakHerstelcodeReserve(userId, privateKeyB64) }
    catch (e) { vak.textContent = 'Herstelcode maken mislukt. Je kunt Face ID-herstel later aanzetten na het inloggen.'; return }
    vak.textContent = ''
    const blok = document.createElement('div'); blok.style.cssText = 'text-align:center;padding:8px 0;'
    const t1 = document.createElement('div'); t1.style.cssText = 'font-size:12px;opacity:0.7;margin-bottom:12px;'; t1.textContent = 'Bewaar je herstelsleutel op een veilige plek'
    const c = document.createElement('div')
    c.style.cssText = "background:var(--bg);border:1.5px solid var(--accent);border-radius:10px;padding:16px;font-size:18px;letter-spacing:2px;color:var(--accent);font-family:'DM Mono',monospace;margin-bottom:12px;"
    c.textContent = code
    const t2 = document.createElement('div'); t2.style.cssText = 'font-size:11px;color:var(--danger,#f87171);margin-bottom:20px;'; t2.textContent = 'Dit zie je maar een keer! Schrijf het op.'
    const verder = regKnop('Ga naar inloggen', true); verder.onclick = () => window.switchTab('inloggen')
    blok.append(t1, c, t2, verder)
    vak.append(blok)
  }

  // Na registreren: meteen Face ID-herstel aanzetten; herstelcode alleen als reserve
  function toonRegistratieFaceId(userId, username, privateKeyB64) {
    const vak = document.getElementById('reg-form')
    vak.textContent = ''
    const blok = document.createElement('div'); blok.style.cssText = 'text-align:center;padding:8px 0;'
    const ic = document.createElement('div'); ic.style.cssText = 'font-size:32px;margin-bottom:12px;'; ic.textContent = '\u{1F389}'
    const h = document.createElement('div'); h.style.cssText = 'font-size:16px;margin-bottom:8px;'; h.textContent = 'Account aangemaakt!'
    const p = document.createElement('div'); p.style.cssText = 'font-size:13px;line-height:1.6;opacity:0.85;margin-bottom:14px;'
    p.textContent = 'Zet nu Face ID-herstel aan. Dan krijg je je berichten op een nieuw toestel terug met alleen Face ID of je vingerafdruk, zonder code.'
    const melding = document.createElement('div'); melding.style.cssText = 'font-size:13px;min-height:18px;margin-bottom:10px;'
    const ja = regKnop('Face ID-herstel aanzetten', true)
    const nee = regKnop('Geen Face ID? Gebruik een herstelcode', false)
    blok.append(ic, h, p, melding, ja, nee)
    vak.append(blok)
    nee.onclick = () => toonHerstelcodeNaRegistratie(userId, privateKeyB64)
    ja.onclick = async () => {
      ja.disabled = true; nee.disabled = true
      melding.style.color = 'inherit'; melding.textContent = 'Even geduld...'
      try {
        await maakDoos(supabase, { userId, gebruikersnaam: username, privateKeyB64 })
        melding.style.color = '#4ade80'; melding.textContent = 'Face ID-herstel staat aan.'
        ja.remove(); nee.remove()
        const verder = regKnop('Ga naar inloggen', true); verder.onclick = () => window.switchTab('inloggen')
        blok.append(verder)
      } catch (e) {
        melding.style.color = '#f87171'; melding.textContent = faceIdFoutTekst(e)
        ja.disabled = false; nee.disabled = false; ja.textContent = 'Opnieuw proberen'
      }
    }
  }

  const BIJVOEGLIJK = ['Turbo','Pixel','Neon','Fluffy','Sneaky','Chonky','Sparkly','Grumpy','Bouncy','Squishy','Dizzy','Glitchy','Funky','Wiggly','Zappy','Bubbly','Fuzzy','Goofy','Jazzy','Mighty','Nifty','Peppy','Quirky','Sassy','Ultra','Wacky','Zesty','Blobby','Clumsy','Derpy','Floppy','Jumpy','Kooky','Lazy','Moody','Nerdy','Silly','Zippy','Psycho','Mega','Hyper','Retro','Cyber','Magic','Spicy','Crispy']
  const DIEREN = ['Kikker','Panda','Hamster','Wasbeer','Capibara','Axolotl','Koala','Pinguin','Flamingo','Alpaca','Eekhoorn','Narwal','Quokka','Wombat','Platypus','Blobfish','Noodle','Pickle','Waffle','Muffin','Burrito','Spaghetti','Toaster','Pillow','Nugget','Avocado','Cactus']
  const ACHTER = ['42','88','99','404','1337','XL','Pro','Max','Zero','Alpha','Prime','9000','Plus','Elite','Ace','Boss','Legend','007','777']

  function genereerNaam() {
    const b = BIJVOEGLIJK[Math.floor(Math.random()*BIJVOEGLIJK.length)]
    const d = DIEREN[Math.floor(Math.random()*DIEREN.length)]
    const a = ACHTER[Math.floor(Math.random()*ACHTER.length)]
    return b+d+a
  }

  function nieuweNaam() {
    const input = document.getElementById('reg-username')
    input.value = genereerNaam()
    input.style.transform = 'scale(1.05)'
    input.style.borderColor = 'var(--accent)'
    setTimeout(() => { input.style.transform='scale(1)'; input.style.borderColor='' }, 200)
  }
  window.nieuweNaam = nieuweNaam

  window.switchTab = function(tab) {
    document.querySelectorAll('.tab').forEach((t, i) => {
      const names = ['inloggen','registreren','herstellen']
      t.classList.toggle('active', names[i] === tab)
    })
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'))
    document.getElementById('panel-'+tab).classList.add('active')
    if (tab === 'registreren') {
      setTimeout(() => { if (!document.getElementById('reg-username').value) nieuweNaam() }, 100)
    }
  }

  setTimeout(() => {
    if (document.getElementById('reg-username') && !document.getElementById('reg-username').value) nieuweNaam()
  }, 300)

  // Open direct het juiste tabblad bij login.html#herstellen
  ;(() => {
    const h = (location.hash || '').replace('#','')
    if (!['inloggen','registreren','herstellen'].includes(h)) return
    const schakel = () => { try { window.switchTab(h) } catch(e) { console.error('switchTab faalde:', e) } }
    schakel()
    setTimeout(schakel, 400)
    window.addEventListener('hashchange', () => {

  window.inloggen = async function() {
    const username = document.getElementById('login-username').value.trim()
    const wachtwoord = document.getElementById('login-wachtwoord').value
    const btn = document.getElementById('login-btn')
    const msg = document.getElementById('login-msg')

    if (!username || !wachtwoord) { toonBericht(msg,'error','Vul alle velden in.'); return }

    btn.disabled = true
    btn.innerHTML = '<span class="spinner"></span>Inloggen...'

    const nep_email = username.toLowerCase() + '@fibro.internal'
    await supabase.auth.signOut({ scope: 'local' })
    const { data, error } = await supabase.auth.signInWithPassword({ email: nep_email, password: wachtwoord })

    if (error) {
      toonBericht(msg,'error','Ongeldige gebruikersnaam of wachtwoord.')
      btn.disabled = false; btn.textContent = 'Inloggen'; return
    }

    // ── E2E: Controleer keypair na inloggen ──
    btn.innerHTML = '<span class="spinner"></span>🔒 Encryptie controleren...'
    await controleerKeypair(data.user.id)

    toonBericht(msg,'success','Ingelogd! Even laden...')

    // ── Push notificaties registreren ──
    try {
      if ('serviceWorker' in navigator && 'PushManager' in window) {
        const reg = await navigator.serviceWorker.register('./service-worker.js?v=95')
        await navigator.serviceWorker.ready
        const toestemming = await Notification.requestPermission()
        if (toestemming === 'granted') {
          const sub = await reg.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: 'BBTo5083-joPZ8FjJW0_lIMuyUWP3T6b6cul22b971RK033GrXdRzFyPUbSE8aoTADuQmdRtVOq1CI2n3v-RLyA'
          })
          await supabase.from('push_subscriptions').upsert({
            user_id: data.user.id,
            subscription: sub.toJSON()
          }, { onConflict: 'user_id,endpoint' })
        }
      }
    } catch(e) { console.log('Push registratie mislukt:', e) }

    await naInloggenFaceId(data.user.id, username)
    setTimeout(() => { window.location.href = 'index.html' }, 800)
  }

  function maakHerstelSleutel() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'
    const deel = n => Array.from({length:n}, () => chars[Math.floor(Math.random()*chars.length)]).join('')
    return 'FIBRO-'+deel(4)+'-'+deel(4)+'-'+deel(4)
  }

  function bepaalNiveau(jaar) {
    const leeftijd = new Date().getFullYear() - parseInt(jaar)
    if (leeftijd < 13) return 'kids'
    if (leeftijd < 18) return 'teens'
    return 'adults'
  }

  window.registreren = async function() {
    const username = document.getElementById('reg-username').value.trim()
    const wachtwoord = document.getElementById('reg-wachtwoord').value
    const jaar = document.getElementById('reg-jaar').value.trim()
    const akkoord = document.getElementById('reg-akkoord').checked
    const btn = document.getElementById('reg-btn')
    const msg = document.getElementById('reg-msg')

    if (!username || !wachtwoord || !jaar) { toonBericht(msg,'error','Vul alle velden in.'); return }
    if (!akkoord) { toonBericht(msg,'error','Je moet akkoord gaan met de spelregels.'); return }
    if (wachtwoord.length < 8) { toonBericht(msg,'error','Wachtwoord minimaal 8 tekens.'); return }
    const jaarNum = parseInt(jaar)
    if (jaarNum < 1900 || jaarNum > new Date().getFullYear()) { toonBericht(msg,'error','Geldig geboortejaar invullen.'); return }

    btn.disabled = true
    btn.innerHTML = '<span class="spinner"></span>🔒 Encryptie voorbereiden...'

    // Genereer keypair voor nieuwe gebruiker
    let keypair
    try {
      keypair = await genereerKeypair()
    } catch(e) {
      toonBericht(msg,'error','Encryptie aanmaken mislukt. Probeer opnieuw.')
      btn.disabled=false; btn.textContent='Account aanmaken'; return
    }

    btn.innerHTML = '<span class="spinner"></span>Account aanmaken...'

    const nep_email = username.toLowerCase() + '@fibro.internal'
    const metFaceId = await kanFaceIdGebruiken()
    const herstelsleutel = maakHerstelSleutel()
    const niveau = bepaalNiveau(jaar)

    const { data, error } = await supabase.auth.signUp({
      email: nep_email,
      password: wachtwoord,
      options: { data: { username, geboortejaar: jaarNum, niveau } }
    })

    if (error) {
      toonBericht(msg,'error', error.message.includes('already') ? 'Gebruikersnaam al in gebruik.' : error.message)
      btn.disabled=false; btn.textContent='Account aanmaken'; return
    }

    if (data.user) {
      // Sla private key op, public key naar Supabase
      slaPrivateKeyOp(data.user.id, keypair.privateKeyB64)
      await supabase.from('profiles').upsert({
        id: data.user.id,
        username,
        niveau,
        public_key: keypair.publicKeyB64
      })
      if (!metFaceId) {
      const hsHash = Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(herstelsleutel)))).map(b=>b.toString(16).padStart(2,'0')).join('')
      await supabase.rpc('zet_herstelsleutel', { hash_in: hsHash })
      // Sleutelkluis vullen: private key versleuteld met de herstelsleutel
      const kluisBlob = await versleutelPrivateKey(keypair.privateKeyB64, herstelsleutel)
      await supabase.from('sleutel_kluis').upsert({ user_id: data.user.id, blob: kluisBlob })
      }
    }

    if (metFaceId && data.user) { toonRegistratieFaceId(data.user.id, username, keypair.privateKeyB64); return }
    document.getElementById('reg-form').innerHTML = `
      <div style="text-align:center;padding:8px 0;">
        <div style="font-size:32px;margin-bottom:12px;">🎉</div>
        <div style="font-size:16px;color:var(--text);margin-bottom:8px;">Account aangemaakt!</div>
        <div class="e2e-badge" style="margin:0 auto 16px;">🔒 Encryptie sleutels aangemaakt</div>
        <div style="font-size:12px;color:var(--text-muted);margin-bottom:16px;">Bewaar je herstelsleutel op een veilige plek</div>
        <div style="background:var(--bg);border:1.5px solid var(--accent);border-radius:10px;padding:16px;font-size:18px;letter-spacing:2px;color:var(--accent);font-family:'DM Mono',monospace;margin-bottom:12px;">
          ${herstelsleutel}
        </div>
        <div style="font-size:11px;color:var(--danger);margin-bottom:20px;">⚠ Dit zie je maar één keer! Schrijf het op.</div>
        <button class="btn btn-primary" onclick="switchTab('inloggen')">Ga naar inloggen</button>
      </div>
    `
  }

window.formatHerstel = function(el) {
  let v = el.value.toUpperCase().replace(/[^A-Z0-9]/g, '')
  v = v.replace(/^FIBRO/, '')
  v = v.replace(/[^ABCDEFGHJKLMNPQRSTUVWXYZ23456789]/g, '')
  v = v.slice(0, 12)
  const d = []
  for (let i = 0; i < v.length; i += 4) d.push(v.slice(i, i + 4))
  el.value = d.join('-')
}

window.herstelMetSleutel = async function() {
    const msg = document.getElementById('herstel-msg')
    const username = document.getElementById('herstel-username').value.trim()
    const wachtwoord = (document.getElementById('herstel-wachtwoord')||{}).value || ''
    const ruweCode = document.getElementById('herstelsleutel-input').value

    if (!username || !wachtwoord) { toonBericht(msg,'error','Vul je naam en wachtwoord in.'); return }
    const code = normaliseerHerstelSleutel(ruweCode)
    if (!code) { toonBericht(msg,'error','Herstelsleutel klopt niet (FIBRO-XXXX-XXXX-XXXX).'); return }

    toonBericht(msg,'info','Bezig met herstellen, dit duurt even...')
    try {
      const nep_email = username.toLowerCase() + '@fibro.internal'
      const { data, error } = await supabase.auth.signInWithPassword({ email: nep_email, password: wachtwoord })
      if (error) { toonBericht(msg,'error','Naam of wachtwoord klopt niet.'); return }

      const userId = data.user.id
      const { data: kluis } = await supabase.from('sleutel_kluis').select('blob').eq('user_id', userId).maybeSingle()
      if (!kluis || !kluis.blob) { toonBericht(msg,'error','Geen sleutelkluis gevonden voor dit account.'); return }

      const priv = await ontsleutelPrivateKey(kluis.blob, code)
      slaPrivateKeyOp(userId, priv)
      sessionStorage.removeItem('fibro_sleutel_mist')
      toonBericht(msg,'success','Gelukt! Je berichten zijn weer leesbaar.')
      setTimeout(() => { window.location.href = 'index.html' }, 1200)
    } catch (e) {
      console.error(e)
      toonBericht(msg,'error','Herstelsleutel klopt niet voor dit account.')
    }
  }

  window.herstelMetFaceId = async function() {
    const msg = document.getElementById('herstel-msg')
    const username = document.getElementById('herstel-username').value.trim()
    const wachtwoord = (document.getElementById('herstel-wachtwoord') || {}).value || ''
    if (!username || !wachtwoord) { toonBericht(msg, 'error', 'Vul je naam en wachtwoord in (de herstelsleutel is niet nodig).'); return }
    if (!(await kanFaceIdGebruiken())) { toonBericht(msg, 'error', 'Deze browser kan Face ID-herstel niet gebruiken. Gebruik je herstelsleutel.'); return }
    toonBericht(msg, 'info', 'Inloggen...')
    const nep_email = username.toLowerCase() + '@fibro.internal'
    const { data, error } = await supabase.auth.signInWithPassword({ email: nep_email, password: wachtwoord })
    if (error) { toonBericht(msg, 'error', 'Naam of wachtwoord klopt niet.'); return }
    const userId = data.user.id
    const { data: prof } = await supabase.from('profiles').select('public_key').eq('id', userId).single()
    let dozen = []
    try { dozen = await lijstDozen(supabase, userId) } catch (e) {}
    if (!prof || !prof.public_key || !dozen.length) {
      toonBericht(msg, 'error', 'Dit account heeft nog geen Face ID-herstel. Gebruik je herstelsleutel.')
      return
    }
    toonBericht(msg, 'info', 'Bevestig met Face ID...')
    const gelukt = await ontgrendelVenster(userId, prof.public_key)
    if (gelukt) {
      toonBericht(msg, 'success', 'Gelukt! Je berichten zijn weer leesbaar.')
      setTimeout(() => { window.location.href = 'index.html' }, 800)
    } else {
      toonBericht(msg, 'info', 'Geannuleerd.')
    }
  }

  function toonBericht(el, type, tekst) {
    el.className = 'message '+type
    el.textContent = tekst
  }

  supabase.auth.getSession().then(({ data: { session } }) => {
    const params = new URLSearchParams(window.location.search)
    if (session && !params.get('logout')) {
      naInloggenFaceId(session.user.id, '').finally(() => {
        // Via 'Sleutel terugzetten' en nog steeds geen sleutel: op het tabblad Herstel blijven
        if (window.location.hash === '#herstellen' && !haalPrivateKeyOp(session.user.id)) return
        window.location.href = 'index.html'
      })
    }
  })

  async function laadWallpaper() {
    try {
      const db = await new Promise((res,rej) => {
        const r = indexedDB.open('FibroDB',2)
        r.onupgradeneeded = e => {
          const db = e.target.result
          if (!db.objectStoreNames.contains('fotos')) db.createObjectStore('fotos', { keyPath: 'id' })
        }
        r.onsuccess = e => res(e.target.result)
        r.onerror = () => rej()
      })
      const keys = await new Promise(res => {
        const r = db.transaction('fotos').objectStore('fotos').getAllKeys()
        r.onsuccess = e => res(e.target.result)
        r.onerror = () => res([])
      })
      const wallpaperKey = keys.find(k => k.startsWith('bg_wallpaper_'))
      if (!wallpaperKey) return
      const data = await new Promise(res => {
        const r = db.transaction('fotos').objectStore('fotos').get(wallpaperKey)
        r.onsuccess = e => res(e.target.result?.data||null)
        r.onerror = () => res(null)
      })
      if (data) {
        document.body.style.backgroundImage = 'url('+data+')'
        document.body.style.backgroundAttachment = 'fixed'
        document.body.style.backgroundSize = 'cover'
        document.body.style.backgroundPosition = 'center'
        document.body.classList.add('heeft-wallpaper')
      }
    } catch(e) {}
  }
  laadWallpaper()
