# Fibro TURN-server (coturn 4.6) -- de postbode bij het hek
# Staat op de VPS in /etc/turnserver.conf (eigenaar root, groep turnserver, 640).
# Het geheim (static-auth-secret) staat NIET in dit bestand en NIET in de repo:
# het wordt op de server onderaan toegevoegd en staat ook als secret in Supabase.

# --- Deuren ---
# Voordeur voor STUN en TURN (UDP en TCP)
listening-port=3478
# TLS op 443 komt later, samen met het domein (certificaat van Let's Encrypt).
# Tot dan geen TLS/DTLS-deuren (scheelt waarschuwingen in het logboek)
no-tls
no-dtls
# Deurtjes voor het doorgeven; gelijk houden aan de muur (ufw 49152:49999/udp)
min-port=49152
max-port=49999

# --- Wie mag erin ---
# Alleen met een tijdelijk pasje van Supabase (get-turn-credentials):
# gebruikersnaam = verloopt:uid, wachtwoord = base64(HMAC-SHA1(geheim, gebruikersnaam))
use-auth-secret
realm=fibro
fingerprint
stale-nonce=600

# --- Grenzen (geen open doorgeefluik) ---
# Hoeveel doorgeefplekken tegelijk per pasje, en voor de hele server
user-quota=12
total-quota=120
# Hoogstens 4 Mbit/s per doorgeefplek (500000 bytes per seconde, per richting)
max-bps=500000
# Hoogstens 100 Mbit/s voor de hele server (12500000 bytes per seconde)
bps-capacity=12500000
# Alleen doorgeven via UDP (zoals browsers doen)
no-tcp-relay
no-multicast-peers

# Niet doorgeven naar prive-adressen en speciale adressen
# (anders kan iemand via de postbode binnen het netwerk van de server komen).
# Het eigen adres van de server staat er bewust NIET in: als beide kanten de
# postbode gebruiken, praten de twee doorgeefplekken met elkaar.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=100::-100::ffff:ffff:ffff:ffff
denied-peer-ip=2001::-2001:1ff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2002::-2002:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# --- Niet te misbruiken als "versterker" ---
no-rfc5780
no-stun-backward-compatibility
response-origin-only-with-rfc5780

# --- Overig ---
# Geen beheer-ingang (telnet)
no-cli
# Logboek naar systemd: sudo journalctl -u coturn
log-file=stdout
# Niet vertellen welke software en versie dit is
no-software-attribute

# Hieronder zet de server zelf het geheim (alleen op de VPS):
