<!doctype html>
<html lang="nl" data-taal>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="theme-color" content="#1a0a2e">
<title data-t>Fibro — Setup</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="lettertypen/basis.css?v=1">
<link rel="stylesheet" href="setup-shortcuts.css?v=3">
<script src="huisregel.js?v=1"></script>
<script src="taal.js?v=46"></script>
<style>
:root{color-scheme:dark;--text:#f3e8ff}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 0,#51336d80,transparent 60%),#1a0a2e;color:var(--text);font:15px/1.6 'DM Sans',system-ui,sans-serif}main{max-width:510px;margin:0 auto;padding:40px 18px max(32px,env(safe-area-inset-bottom))}.setup-brand{display:flex;align-items:center;gap:12px;margin-bottom:26px}.setup-brand img{width:48px;height:48px;border-radius:13px;box-shadow:0 5px 16px #0005}.setup-brand strong{display:block;font-family:'Playfair Display',serif;font-style:italic;font-size:26px;color:#deb4ff}.setup-brand small{display:block;color:#ceb6e3;letter-spacing:.12em;text-transform:uppercase;font-size:11px}h1{font-size:26px;line-height:1.25;margin:0 0 12px}p.intro{color:#dfcfea;margin:0 0 25px}.setup-continue{display:block;padding:13px 20px;min-height:48px;background:linear-gradient(145deg,#efcaff,#bd82e9);border:1px solid #f0d6ff;border-radius:13px;box-shadow:inset 0 1px #fff9,0 4px 0 #69447f,0 9px 19px #0005;color:#271337;text-align:center;text-decoration:none;font-weight:750}.setup-continue:focus-visible{outline:3px solid #fff;outline-offset:4px}.setup-note{font-size:12px;color:#cbb5dd;text-align:center;margin-top:18px}.setup-footnote{font-size:11px;color:#bfa6d3;margin-top:28px;text-align:center}
</style>
</head>
<body>
<main>
  <header class="setup-brand"><img src="icon-192.png" alt="" width="48" height="48"><div><strong>Fibro</strong><small>Setup</small></div></header>
  <h1 data-t>Maak Fibro klaar op dit apparaat</h1>
  <p class="intro" data-t>Je account is klaar. Voeg hieronder de twee handige links toe.</p>
  <!-- v248: Fibro op het beginscherm (beginscherm.js): op een iPhone in Safari belangrijk (meldingen), op Android handig -->
  <section id="setup-beginscherm" hidden style="margin:0 0 18px;padding:14px 16px;border-radius:14px;border:1px solid rgba(192,132,252,0.5);background:rgba(192,132,252,0.1);text-align:left">
    <h2 id="setup-beginscherm-kop" style="font-size:16px;margin:0 0 6px"></h2>
    <p id="setup-beginscherm-tekst" style="font-size:14px;line-height:1.5;margin:0 0 12px"></p>
    <button type="button" id="setup-beginscherm-hoe" style="width:100%;min-height:44px;border-radius:12px;border:none;background:#c084fc;color:#1a0a2e;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit"></button>
  </section>
  <div id="setup-shortcuts-slot"></div>
  <a class="setup-continue" href="index.html" data-t>Open Fibro</a>
  <p class="setup-note" data-t>Je kunt dit overslaan en meteen verdergaan.</p>
  <p class="setup-footnote" data-t>Dit setupscherm maakt geen nieuwe sleutel aan.</p>
</main>
<script type="module" src="setup-shortcuts.js?v=4"></script>
<script type="module">
// v248: Fibro op het beginscherm zetten (alleen als Fibro nog niet als app draait)
import { toestel, openBeginschermUitleg } from './beginscherm.js?v=1'
const T = window.T || ((s) => s)
const t = toestel(), blok = document.getElementById('setup-beginscherm')
if (blok && !t.app && (t.ios || t.android)) {
  document.getElementById('setup-beginscherm-kop').textContent = T('\u{1F4F2} Zet Fibro op je beginscherm')
  document.getElementById('setup-beginscherm-tekst').innerHTML = t.ios
    ? T('Op de iPhone krijg je alleen zo meldingen. In de app log je één keer opnieuw in en zet je je sleutel terug met Face ID of je herstelcode.')
    : T('Dan opent Fibro als een gewone app, met meldingen.')
  const hoe = document.getElementById('setup-beginscherm-hoe')
  hoe.textContent = T('Laat zien hoe')
  hoe.onclick = () => openBeginschermUitleg({ reden: 'setup' })
  blok.hidden = false
}
</script>
</body>
</html>
