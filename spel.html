<!DOCTYPE html>
<html lang="nl" data-taal style="background:#1a0a2e">
<head>
<meta charset="UTF-8">

<script src="huisregel.js?v=1"></script>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title data-t>Fibro — Spel</title>
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">

<meta name="apple-mobile-web-app-capable" content="yes">

<link href="lettertypen/basis.css?v=1" rel="stylesheet">
<style>
* { box-sizing:border-box; margin:0; padding:0; }
:root { --bg:#1a0a2e; --card:rgba(255,255,255,0.06); --border:rgba(255,255,255,0.12); --accent:#c084fc; --accent2:#f0abfc; --text:#f3e8ff; --muted:#ffffff; }
html, body { height:100%; }
body { background:#08040f; color:var(--text); font-family:'DM Sans',system-ui,sans-serif; overflow:hidden; }
@keyframes vorPuls { from { transform:scale(1); } to { transform:scale(1.08); } }
.spel-scherm { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; }
.spel-scherm:has(.sch-spel) { justify-content:flex-start; overflow-y:auto; overscroll-behavior:contain; padding-block:48px 16px; }
.spel-scherm #spelInhoud:has(.sch-spel) { flex:0 0 auto; height:auto; margin-block:auto; }
.spel-sluit-btn { position:absolute; top:16px; right:16px; width:38px; height:38px; border-radius:50%; background:rgba(255,255,255,0.12); border:none; color:white; font-size:20px; cursor:pointer; z-index:10; display:flex; align-items:center; justify-content:center; }
.spel-titel-bar { position:absolute; top:16px; left:16px; font-size:14px; color:white; font-weight:600; opacity:0.8; }
#spelInhoud { width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
.niveau-kaart { display:flex; flex-direction:column; align-items:center; gap:14px; padding:24px; text-align:center; }
.niveau-icon { font-size:56px; }
.niveau-naam { font-size:20px; font-weight:600; color:white; }
.niveau-sub { font-size:13px; color:rgba(255,255,255,0.7); margin-bottom:6px; }
.niveau-btn { width:220px; padding:12px 0; border-radius:12px; border:0.5px solid var(--border); background:var(--card); color:white; font-size:15px; font-weight:600; cursor:pointer; font-family:inherit; }
.niveau-btn.gekozen { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#1a0a2e; border:none; }
.niveau-btn.levels { background:#050510; border:2px solid #00f0ff; color:#00f0ff; box-shadow:0 0 14px rgba(0,240,255,0.35); }
.niveau-btn.vriend { margin-top:4px; background:linear-gradient(135deg,#20b9ad,#42d392); border:1px solid rgba(182,255,227,0.58); color:#05231c; box-shadow:0 7px 20px rgba(34,197,148,0.22); }
.niveau-btn:active { transform:scale(0.96); }
.melding { color:white; text-align:center; padding:24px; line-height:1.5; }
.melding button { margin-top:16px; background:linear-gradient(135deg,var(--accent),var(--accent2)); border:none; border-radius:10px; padding:10px 22px; color:#1a0a2e; font-weight:600; cursor:pointer; }
.vriend-modal { position:fixed; inset:0; z-index:30; display:flex; align-items:flex-end; justify-content:center; padding:16px; background:rgba(3,1,8,0.72); backdrop-filter:blur(10px); }
.vriend-kaart { width:min(100%,390px); max-height:min(76dvh,580px); overflow:auto; padding:20px; border:1px solid rgba(182,255,227,0.35); border-radius:22px; background:linear-gradient(155deg,#162a2b,#151027); box-shadow:0 20px 60px rgba(0,0,0,0.56); }
.vriend-kop { display:flex; justify-content:space-between; align-items:start; gap:12px; margin-bottom:14px; }
.vriend-sluit { width:34px; height:34px; border:0; border-radius:50%; color:white; background:rgba(255,255,255,0.1); font-size:18px; cursor:pointer; }
.vriend-rij { width:100%; display:flex; align-items:center; gap:12px; margin-top:8px; padding:11px; color:white; text-align:left; border:1px solid rgba(255,255,255,0.1); border-radius:14px; background:rgba(255,255,255,0.055); cursor:pointer; font:inherit; }
.vriend-rij:hover { border-color:#42d392; background:rgba(66,211,146,0.12); }
.vriend-avatar { display:grid; width:38px; height:38px; place-items:center; overflow:hidden; border-radius:50%; background:rgba(255,255,255,0.1); font-size:20px; flex:none; }
.vriend-avatar img { width:100%; height:100%; object-fit:cover; }
</style>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="stijl.css?v=3">
</head>
<body>
<div class="spel-scherm" id="spelOverlay">
  <div class="spel-titel-bar" id="spelTitelBar"></div>
  <button class="spel-sluit-btn" id="sluitKnop" title="Terug" data-t-attr="title">✕</button>
  <div id="spelInhoud"></div>
</div>

<script type="module">
  import * as Bordgeluid from './bordgeluid.js?v=197'
  import { SOLO_SPELLEN, NIVEAUS, maakSoloKanaal } from './solo.js?v=241'
  import { supabase } from './supabase.js?v=95'
  import { startSpelUitnodigingLuisteraar } from './speluitnodiging.js?v=197'
  import { nieuweSpelSessie } from './spelsessie.js?v=1'

  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;')
  const inhoud = document.getElementById('spelInhoud')
  const titel = document.getElementById('spelTitelBar')
  let kanaal = null

  document.getElementById('sluitKnop').onclick = () => {
    if (kanaal) kanaal.sluit()
    location.href = 'index.html'
  }

  const spelId = new URLSearchParams(location.search).get('spel') || ''
  const spel = Object.prototype.hasOwnProperty.call(SOLO_SPELLEN, spelId) ? SOLO_SPELLEN[spelId] : null
  startSpelUitnodigingLuisteraar().catch(error => console.warn('[speluitnodiging]', error))

  // Record per account, alleen op dit toestel.
  function accountId() {
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i)
        if (k && k.startsWith('sb-') && k.endsWith('-auth-token')) {
          const id = JSON.parse(localStorage.getItem(k))?.user?.id
          if (id) return id
        }
      }
    } catch (e) {}
    return 'lokaal'
  }
  const recordSleutel = 'fibro_record_' + spelId + '_' + accountId()
  const solo = {
    record() { try { return parseInt(localStorage.getItem(recordSleutel), 10) || 0 } catch (e) { return 0 } },
    // Geeft true als dit een nieuw record is (en bewaart het dan).
    nieuweScore(n) {
      n = Math.floor(Number(n)) || 0
      if (n <= solo.record()) return false
      try { localStorage.setItem(recordSleutel, String(n)) } catch (e) {}
      return true
    },
    // 30 okt 2026: een spel kan zelf iets onthouden (Neo Paddle: welke levels open staan), per account op dit toestel
    lees(naam, standaard) { try { const w = localStorage.getItem(recordSleutel + '_' + naam); return w === null ? standaard : w } catch (e) { return standaard } },
    bewaar(naam, waarde) { try { localStorage.setItem(recordSleutel + '_' + naam, String(waarde)) } catch (e) {} },
  }


  if (!spel) {
    inhoud.innerHTML = '<div class="melding">' + T('Dit spel kan nog niet alleen gespeeld worden.') + '<br><button onclick="location.href=\'index.html\'">' + T('Terug') + '</button></div>'
  } else {
    document.title = 'Fibro — ' + spel.naam
    // Ghost Tag, Twin Snakes, Runner & Gunner en Neon Raiders hebben een eigen startscherm.
    if (spel.zonderKanaal) start('normaal')
    else if (spel.arcade) startScherm()
    else kiesNiveau()
  }

  // Arcadespellen: geen niveau, wel een startknop (dan mag het geluid meteen aan).
  function startScherm() {
    titel.textContent = spel.icon + ' ' + spel.naam
    inhoud.innerHTML = `
      <div class="niveau-kaart">
        <div class="niveau-icon">${esc(spel.icon)}</div>
        <div class="niveau-naam">${esc(spel.naam)}</div>
        <div class="niveau-sub">${T('Jouw record: {n}', { n: solo.record() })}</div>
        <button class="niveau-btn gekozen" id="startKnop">▶ Start</button>
      </div>`
    document.getElementById('startKnop').onclick = () => start('normaal')
  }

  function kiesNiveau() {
    const sleutel = 'fibro_solo_niveau_' + spelId
    let vorige = 'normaal'
    try { vorige = localStorage.getItem(sleutel) || 'normaal' } catch (e) {}
    const NAMEN = { makkelijk: T('Makkelijk'), normaal: T('Normaal'), moeilijk: T('Moeilijk') }
    titel.textContent = spel.icon + ' ' + spel.naam
    inhoud.innerHTML = `
      <div class="niveau-kaart">
        <div class="niveau-icon">${esc(spel.icon)}</div>
        <div class="niveau-naam">${esc(spel.naam)}</div>
        <div class="niveau-sub">${T('Tegen de computer. Kies een niveau:')}</div>
        ${NIVEAUS.map(n => `<button class="niveau-btn${n === vorige ? ' gekozen' : ''}" data-niveau="${n}">${NAMEN[n]}</button>`).join('')}
        ${spelId === 'schaken' ? `<button class="niveau-btn vriend" id="vriendKnop" type="button">${T('♟ Tegen een vriend')}</button>` : ''}
        ${spel.levels ? `<div class="niveau-sub" style="margin-top:10px">${T('Of speel alleen de levels:')}</div><button class="niveau-btn levels" id="levelsKnop" type="button">${T('🧱 Levels')}</button>` : ''}
      </div>`
    inhoud.querySelectorAll('.niveau-btn').forEach(knop => {
      knop.onclick = () => {
        const niveau = knop.dataset.niveau
        try { localStorage.setItem(sleutel, niveau) } catch (e) {}
        start(niveau)
      }
    })
    const vriendKnop = document.getElementById('vriendKnop')
    if (vriendKnop) vriendKnop.onclick = kiesVriendVoorSchaken
    const levelsKnop = document.getElementById('levelsKnop')
    if (levelsKnop) levelsKnop.onclick = startLevels
  }

  // 30 okt 2026: Neo Paddle heeft ook levels voor alleen (alle blokjes weg). Zonder computer en zonder kanaal.
  async function startLevels() {
    inhoud.innerHTML = '<div class="melding">' + T('Laden...') + '</div>'
    try {
      const m = await import(spel.levels)
      m.start({ solo, isActief: () => true })
    } catch (e) {
      console.error('[solo] levels starten mislukt', e)
      inhoud.innerHTML = '<div class="melding">' + T('Het spel kon niet starten.') + '<br><button onclick="location.reload()">' + T('Opnieuw proberen') + '</button></div>'
    }
  }

  async function kiesVriendVoorSchaken() {
    const modal = document.createElement('div')
    modal.className = 'vriend-modal'
    const kaart = document.createElement('section')
    kaart.className = 'vriend-kaart'
    kaart.setAttribute('role', 'dialog')
    kaart.setAttribute('aria-modal', 'true')
    const kop = document.createElement('div')
    kop.className = 'vriend-kop'
    const tekst = document.createElement('div')
    const titel = document.createElement('h2'); titel.textContent = T('Spelen tegen een vriend')
    const sub = document.createElement('p'); sub.textContent = T('Kies een vriend om uit te nodigen voor schaken.'); sub.style.cssText = 'margin-top:5px;color:rgba(255,255,255,.65);font-size:13px;line-height:1.4'
    tekst.append(titel, sub)
    const sluit = document.createElement('button'); sluit.className = 'vriend-sluit'; sluit.type = 'button'; sluit.textContent = '×'; sluit.setAttribute('aria-label', T('Sluiten'))
    sluit.onclick = () => modal.remove()
    kop.append(tekst, sluit)
    const lijst = document.createElement('div')
    lijst.textContent = T('Vrienden laden…'); lijst.style.cssText = 'color:rgba(255,255,255,.7);padding:10px 0;font-size:14px'
    kaart.append(kop, lijst); modal.append(kaart); document.body.append(modal)
    modal.onclick = event => { if (event.target === modal) modal.remove() }

    const { data: { user } } = await supabase.auth.getUser()
    if (!user) { lijst.textContent = T('Log in om een vriend uit te nodigen.'); return }
    const { data: relaties, error } = await supabase.from('friendships').select('user_id, friend_id').or(`user_id.eq.${user.id},friend_id.eq.${user.id}`).eq('status', 'accepted')
    if (error) { lijst.textContent = T('Je vrienden konden niet geladen worden. Probeer het opnieuw.'); return }
    const ids = (relaties || []).map(r => r.user_id === user.id ? r.friend_id : r.user_id).filter(Boolean)
    if (!ids.length) { lijst.textContent = T('Je hebt nog geen vrienden om uit te nodigen.'); return }
    const { data: vrienden, error: vriendFout } = await supabase.from('profiles').select('id,username,display_name,avatar_url,avatar_data').in('id', ids)
    if (vriendFout || !vrienden?.length) { lijst.textContent = T('Je vrienden konden niet geladen worden. Probeer het opnieuw.'); return }
    lijst.textContent = ''
    vrienden.sort((a, b) => String(a.display_name || a.username || '').localeCompare(String(b.display_name || b.username || ''))).forEach(vriend => {
      const knop = document.createElement('button'); knop.className = 'vriend-rij'; knop.type = 'button'
      const avatar = document.createElement('span'); avatar.className = 'vriend-avatar'
      if (/^data:image\/[a-z0-9.+-]+;base64,[A-Za-z0-9+/=]+$/i.test(String(vriend.avatar_data || ''))) { const img = document.createElement('img'); img.src = vriend.avatar_data; img.alt = ''; avatar.append(img) }
      else avatar.textContent = vriend.avatar_url || '👤'
      const naam = document.createElement('span'); naam.textContent = vriend.display_name || vriend.username || T('Vriend'); naam.style.cssText = 'font-weight:650;flex:1'
      const pijl = document.createElement('span'); pijl.textContent = T('Uitnodigen ›'); pijl.style.cssText = 'color:#85f3c4;font-size:12px'
      knop.append(avatar, naam, pijl)
      knop.onclick = () => verstuurSchaakUitnodiging(vriend, lijst)
      lijst.append(knop)
    })
  }

  async function verstuurSchaakUitnodiging(vriend, lijst) {
    const { data: { user } } = await supabase.auth.getUser()
    if (!user || !vriend?.id) return
    lijst.textContent = T('Uitnodiging voor schaken versturen…')
    const [{ data: profiel }, sessieId] = await Promise.all([
      supabase.from('profiles').select('username,avatar_url,avatar_data').eq('id', user.id).single(),
      Promise.resolve(nieuweSpelSessie())
    ])
    const kanaal = supabase.channel('speluitnodiging-' + vriend.id, { config: { private: true } })
    const verstuurd = await kanaal.send({ type: 'broadcast', event: 'speluitnodiging', payload: {
      van: user.id, vanNaam: profiel?.username || T('Vriend'), vanAvatar: profiel?.avatar_data || profiel?.avatar_url || '♟️', spelType: 'schaken', sessieId
    } })
    supabase.removeChannel(kanaal)
    if (verstuurd !== 'ok') { lijst.textContent = T('De uitnodiging kon niet verstuurd worden. Probeer het opnieuw.'); return }
    await supabase.from('messages').insert({ sender_id:user.id, receiver_id:vriend.id, content:'spelinvite:schaken:' + user.id + ':' + sessieId })
    const q = new URLSearchParams({ spelVriend:vriend.id, spelType:'schaken', sessieId, starterId:user.id })
    location.href = 'chat.html?' + q.toString()
  }

  // Toont rechts naast de titel hoeveel beeldjes per seconde de telefoon haalt.
  // v174: telt het spel zelf zijn getekende beeldjes (window.fibroBeeldjes, Ghost Tag
  // op hoogstens 30), dan die; anders elk beeldje van het scherm.
  function meetBeeldjes() {
    let n = 0, sinds = performance.now(), begin = window.fibroBeeldjes || 0
    const tel = nu => {
      n++
      if (nu - sinds >= 1000) {
        const eigen = typeof window.fibroBeeldjes === 'number' ? window.fibroBeeldjes - begin : n
        titel.textContent = spel.icon + ' ' + spel.naam + ' · ' + Math.round(eigen * 1000 / (nu - sinds)) + ' fps'
        n = 0; sinds = nu; begin = window.fibroBeeldjes || 0
      }
      requestAnimationFrame(tel)
    }
    requestAnimationFrame(tel)
  }

  async function start(niveau) {
    inhoud.innerHTML = '<div class="melding">' + T('Laden...') + '</div>'
    try {
      const m = await import(spel.bestand)
      // Zware spellen op de telefoon: tekenen op gewone scherpte in plaats van
      // dubbel. Bij pixelart zie je dat nauwelijks, en het scheelt veel rekenwerk.
      if (spel.gewoneScherpte && (window.devicePixelRatio || 1) > 1) {
        try { Object.defineProperty(window, 'devicePixelRatio', { configurable: true, get: () => 1 }) } catch (e) {}
      }
      // Dammen en schaken krijgen hun spelregels mee, net als in de chat.
      const motor = spel.motor ? await import(spel.motor) : null
      const extra = spel.motorNaam ? { [spel.motorNaam]: motor } : {}
      kanaal = spel.zonderKanaal ? null : maakSoloKanaal(spel.bot, niveau, motor)
      // Jij bent altijd speler 1 en begint de eerste ronde.
      m.start({ ...extra, Bordgeluid, spelKanaal: kanaal, benIkSpeler1: true, vriendNaam: T('Computer'), isActief: () => true, solo: spel.arcade ? solo : undefined })
      if (kanaal) kanaal.subscribe()
      if (spel.meetFps) meetBeeldjes()
    } catch (e) {
      console.error('[solo] starten mislukt', e)
      inhoud.innerHTML = '<div class="melding">' + T('Het spel kon niet starten.') + '<br><button onclick="location.reload()">' + T('Opnieuw proberen') + '</button></div>'
    }
  }
</script>
</body>
