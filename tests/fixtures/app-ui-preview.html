<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TEST · Fibro interface preview</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#090710;color:#f9f2ff;font:13px system-ui,sans-serif}
    header{display:flex;align-items:center;justify-content:center;gap:12px;min-height:52px;padding:8px;flex-wrap:wrap}
    strong{color:#ffdf73}select{padding:5px 8px;border:1px solid #85709a;border-radius:7px;background:#241a32;color:#fff}
    iframe{display:block;width:390px;height:760px;margin:0 auto 20px;border:1px solid #70588b;border-radius:12px;background:#1a0a2e}
  </style>
</head>
<body>
  <header><strong>TEST · Live app layout</strong><label>Page <select id="preview-page"><option value="style">Style · Widgets</option><option value="home">Home</option><option value="friends">Friends</option><option value="chat">Chat</option></select></label><label>Width <select id="preview-width"><option value="390">390px · phone</option><option value="1280">1280px · desktop</option></select></label><span>Uses the current account. No automatic saves.</span></header>
  <iframe id="app-preview" title="Fibro app preview"></iframe>
  <script>
    const routes = { style:'../../profiel.html#widgets', home:'../../index.html', friends:'../../vrienden.html', chat:'../../chat.html' }
    const frame = document.getElementById('app-preview')
    const page = document.getElementById('preview-page')
    document.getElementById('preview-width').addEventListener('change', event => { frame.style.width = event.target.value === '1280' ? '1280px' : '390px' })
    page.addEventListener('change', () => { frame.src = routes[page.value] || routes.style })
    frame.src = routes.style
  </script>
</body>
</html>
