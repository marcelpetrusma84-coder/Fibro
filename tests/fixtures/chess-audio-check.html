<!doctype html><html lang="nl"><head><meta charset="utf-8"><title>Schaakaudio · offline controle</title></head><body>
<h1>Web Audio-rendercontrole</h1><p id="result" role="status">Bezig…</p><table><thead><tr><th>Thema</th><th>Effect</th><th>Waarde</th><th>Piek</th><th>Energie</th></tr></thead><tbody id="cases"></tbody></table>
<script type="module">
import {renderCaptureSound} from '../../schaak-slaggeluid.js?v=2'
try{
  let count=0
  for(const theme of ['classic','wood'])for(const outcome of ['win','loss']){
    let previousEnergy=0
    for(const value of [1,3,5,9]){
      const context=new OfflineAudioContext(1,44100*3,44100)
      renderCaptureSound(context,{value,outcome,theme},.02)
      const buffer=await context.startRendering(),samples=buffer.getChannelData(0)
      let peak=0,energy=0
      for(const sample of samples){if(!Number.isFinite(sample))throw Error('Non-finite sample');peak=Math.max(peak,Math.abs(sample));energy+=sample*sample}
      if(peak<.005||peak>.85)throw Error('Silent or excessive output: '+peak)
      if(energy<=previousEnergy)throw Error('Capture weight does not increase the physical sound energy')
      previousEnergy=energy
      if(samples.slice(44100*2.6).some(sample=>Math.abs(sample)>.0001))throw Error('Unbounded sound tail')
      const row=document.createElement('tr');for(const text of [theme,outcome,value,peak.toFixed(4),energy.toFixed(3)]){const cell=document.createElement('td');cell.textContent=text;row.append(cell)}document.getElementById('cases').append(row);count++
    }
  }
  document.getElementById('result').textContent='PASS · '+count+' echte audio-renders: niet stil, begrensde pieken en staarten, toenemende energie per stukwaarde.'
}catch(error){document.getElementById('result').textContent='FAIL · '+error.message;console.error(error)}
</script></body></html>
