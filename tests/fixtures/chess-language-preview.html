<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fibro · Schaakinstellingen mobiel testen</title>
<style>*{box-sizing:border-box}body{margin:0;padding:18px;background:#101322;color:#edf1ff;font:14px system-ui}main{max-width:850px;margin:auto}h1{font-size:22px}p{color:#bdc8dc;line-height:1.5}nav{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}button{font:inherit;padding:10px;border:1px solid #a5c9f750;border-radius:9px;background:#29334a;color:inherit;cursor:pointer}button[aria-pressed=true]{border-color:#83e4cc;color:#a5f5df}iframe{display:block;width:390px;max-width:100%;height:780px;border:1px solid #92b5e554;border-radius:16px;background:#101322;box-shadow:0 15px 45px #0006}button:focus-visible{outline:3px solid #ffe09c;outline-offset:3px}</style></head><body><main>
<h1>Mobiele schaakinstellingen</h1><p>De echte lokale test, in een venster van 390 pixels breed. Wissel de taal in het instellingenmenu. Een andere test openen begint opnieuw; binnen een partij behoudt een taalwissel de zetten, selectie en instellingen.</p>
<nav aria-label="Schaakvariant"><button id="two" aria-pressed="false">Test met 2 spelers</button><button id="three" aria-pressed="true">Test met 3 spelers</button></nav>
<iframe id="phone" title="Fibro mobiele schaaktest" src="../../chat.html?test=FIBRO%20TEST&amp;players=3"></iframe>
<script>for(const [id,players] of [['two',2],['three',3]])document.getElementById(id).onclick=()=>{document.getElementById('phone').src='../../chat.html?test=FIBRO%20TEST&players='+players;for(const name of ['two','three'])document.getElementById(name).setAttribute('aria-pressed',String(id===name))}</script>
</main></body></html>
