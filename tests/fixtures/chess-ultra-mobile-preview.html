<!doctype html>
<html lang="nl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fibro · Ultra mobiel testen</title>
<style>*{box-sizing:border-box}body{margin:0;padding:18px;background:#101322;color:#edf1ff;font:14px system-ui}main{max-width:1000px;margin:auto}h1{font-size:22px}p{color:#bdc8dc;line-height:1.5}nav{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}button{font:inherit;padding:10px;border:1px solid #a5c9f750;border-radius:9px;background:#29334a;color:inherit;cursor:pointer}button:focus-visible{outline:3px solid #ffe09c;outline-offset:3px}iframe{display:block;width:390px;max-width:100%;height:820px;border:1px solid #92b5e554;border-radius:16px;background:#08040f;box-shadow:0 15px 45px #0006}</style></head>
<body><main><h1>Ultra op een klein scherm</h1><p>De echte schaakapp in een smaller venster. Kies Ultra en speel; de engine, instellingen en geluiden werken zoals in de app. De knoppen veranderen alleen de vensterbreedte.</p>
<nav aria-label="Vensterbreedte"><button data-width="320">320 px</button><button data-width="390">390 px</button><button data-width="900">Desktop</button></nav>
<iframe id="phone" title="Fibro Ultra mobiele preview" src="../../spel.html?spel=schaken&amp;preview=ultra-progress-mobile"></iframe>
<script>for(const button of document.querySelectorAll('[data-width]'))button.addEventListener('click',()=>{document.getElementById('phone').style.width=button.dataset.width+'px'})</script>
</main></body></html>
