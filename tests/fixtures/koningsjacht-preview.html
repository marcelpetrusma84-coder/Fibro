<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <base href="../../">
  <title>Koningsjacht — lokaal testvoorbeeld</title>
  <style>html,body,#spelInhoud{width:100%;height:100%;margin:0}body{background:#241309}.testlabel{position:fixed;left:8px;bottom:4px;z-index:80;padding:3px 7px;border-radius:6px;background:#191009dc;color:#ffe8b7;font:11px system-ui;pointer-events:none}</style>
</head>
<body>
  <div id="spelTitelBar" hidden></div>
  <main id="spelInhoud"></main>
  <span class="testlabel">LOKAAL TESTVOORBEELD</span>
  <script type="module">
    import { start } from './koningsjacht-ui.js?v=50'
    const { maakKoningsjachtScoreService } = await import('./koningsjacht-scores.js?v=1')
    const memory = new Map()
    const scoreService = maakKoningsjachtScoreService({ storage: { getItem: k => memory.get(k), setItem: (k,v) => memory.set(k,v) } })
    const params = new URLSearchParams(location.search)
    // De hologram-preview start direct in het futuristische schip. Dit wijzigt alleen de lokale fixture.
    if (params.get('voorbeeld') === 'ruimteschip-futuristisch') {
      const bewaard = JSON.parse(localStorage.getItem('fibro_koningsjacht_instellingen') || '{}')
      localStorage.setItem('fibro_koningsjacht_instellingen', JSON.stringify({ ...bewaard, scene: 'modern', modernInterior: 'futuristic' }))
      document.querySelector('.testlabel').textContent = 'LOKAAL TESTVOORBEELD · FUTURISTISCH RUIMTESCHIP'
    }
    // Direct speelbaar voorbeeld van de balk; uitsluitend op deze testpagina.
    if (params.get('voorbeeld') === 'levensbalk') {
      const K = await import('./koningsjacht.js?v=2')
      const s = K.nieuwSpel({ niveau: 'schildknaap' })
      s.kasteel = ['hB', ...s.kasteel.filter(id => id !== 'hB')]
      s.afleg.push(...s.kasteel.splice(-3)); s.verslagen = 3
      s.schade = 7; s.schild = 6
      if (!K.geldigeStand(s)) throw new Error('Ongeldige teststand')
      localStorage.setItem('fibro_koningsjacht_stand', JSON.stringify(s))
    }
    // Alleen deze fixture simuleert spelers. Geen account, uitnodiging, camera of productieserver.
    const speler = Number(params.get('speler'))
    if (speler === 1 || speler === 2) {
      const bc = new BroadcastChannel('koningsjacht-preview-' + (params.get('kanaal') || 'lokaal'))
      const handlers = new Map()
      bc.onmessage = ({ data }) => {
        if (data.speler !== speler) for (const fn of handlers.get(data.event) || []) fn({ payload: data.payload })
      }
      const kanaal = {
        on(_, { event }, fn) { const lijst = handlers.get(event) || []; lijst.push(fn); handlers.set(event, lijst); return this },
        send({ event, payload }) { bc.postMessage({ speler, event, payload }); return Promise.resolve('ok') }
      }
      document.querySelector('.testlabel').textContent += ' · SPELER ' + speler
      addEventListener('pagehide', () => bc.close(), { once: true })
      start({ scoreService, spelKanaal: kanaal, benIkSpeler1: speler === 1, vriendNaam: speler === 1 ? 'Testspeler 2' : 'Testspeler 1' })
    } else {
      start({ scoreService })
      if (['levensbalk', 'ruimteschip-futuristisch'].includes(params.get('voorbeeld'))) document.querySelector('.kj-verder').click()
    }
  </script>
</body>
</html>
