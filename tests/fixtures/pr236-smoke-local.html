<!doctype html>
<meta charset="utf-8">
<title>PR 236 multiplayercontrole</title>
<h1>PR 236 multiplayercontrole</h1>
<pre id="result" role="status">Bezig…</pre>
<div id="spelers" style="display:flex;gap:12px"></div>
<script type="module">
const result = document.querySelector('#result')
const spelers = document.querySelector('#spelers')
async function wacht(test, stap) {
  for (let i = 0; i < 140; i++) {
    const waarde = test()
    if (waarde) return waarde
    await new Promise(resolve => setTimeout(resolve, 50))
  }
  throw new Error(stap)
}
function maakSpeler(nummer, kanaal) {
  const frame = document.createElement('iframe')
  frame.width = 390
  frame.height = 844
  frame.src = 'koningsjacht-preview.html?speler=' + nummer + '&kanaal=' + kanaal
  spelers.append(frame)
  return selector => frame.contentDocument?.querySelector(selector)
}
function klik(knop) {
  knop.scrollIntoView({ block: 'nearest' })
  const r = knop.getBoundingClientRect()
  const doel = knop.ownerDocument.elementFromPoint(r.left + r.width / 2, r.top + r.height / 2)
  if (!knop.contains(doel)) throw new Error('Knop onbereikbaar: ' + knop.textContent.trim())
  knop.click()
}
result.textContent = ''
try {
  const modi = [['samen', 'Samen'], ['wedstrijd', 'Wedstrijd'], ['duel', 'Duel'], ['beleg', 'Belegering']]
  const filter = new URLSearchParams(location.search).get('modus')
  for (const [modus, titel] of modi.filter(([id]) => !filter || id === filter)) {
    const kanaal = modus + Date.now()
    const gast = maakSpeler(2, kanaal)
    const host = maakSpeler(1, kanaal)
    await wacht(() => gast('.kj-wacht'), 'Gast wacht op speltype')
    const keuze = await wacht(() => host('button[data-modus="' + modus + '"]'), 'Speltype aanwezig')
    klik(keuze)
    if (keuze.getAttribute('aria-pressed') !== 'true') throw new Error('Keuze niet geselecteerd')
    klik(host('button[data-niveau="schildknaap"]'))
    await wacht(() => gast('.kj-mode-popup-kop')?.textContent === titel, 'Gast ziet het juiste speltype')
    await wacht(() => gast('.kj-mode-popup-beeld')?.naturalWidth > 0, 'Speltypebeeld laadt')
    if (gast('.kt-tafel')) throw new Error('Gast startte voor bevestiging')
    klik(host('.kj-mode-popup-start'))
    klik(gast('.kj-mode-popup-sluit'))
    await wacht(() => host('.kt-hand .kt-kaart') && gast('.kt-hand .kt-kaart'), 'Beide spelers hebben kaarten')
    result.textContent += 'OK ' + titel + '\n'
    spelers.replaceChildren()
  }
  result.textContent += 'Spel geopend bij beide spelers.'
} catch (err) {
  result.textContent += 'FOUT ' + err.message
}
</script>
