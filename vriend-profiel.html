<script type="module">
  import { laadThema } from './thema.js?v=234'
  import * as GB from './gastenboekstijl.js?v=1'
  import { pasBlokstijlToe } from './blokstijl.js?v=95'
  import { supabase } from './supabase.js?v=95'
  import { haalVriendFotos } from './vriendfotos.js?v=2'
  import { initSync, vraagVriendVideo } from './sync.js?v=162'
  import { eisSessie, startBewaking } from './sessie.js?v=95'
  import { startMeldingen } from './meldingen.js?v=187'
  import { leesMood, isMoodSticker, tekenMoodSticker } from './moodsticker.js?v=236' // v171: een sticker als mood
  pasBlokstijlToe()

  var vriendId = null
  var huidigeUser = null
  var vriendData = null

  // ── IndexedDB voor vriend cache ──
  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open('FibroDB', 2)
      req.onupgradeneeded = e => {
        const db = e.target.result
        if (!db.objectStoreNames.contains('fotos')) db.createObjectStore('fotos', { keyPath: 'id' })
      }
      req.onsuccess = e => resolve(e.target.result)
      req.onerror = () => reject('DB fout')
    })
  }

  async function slaFotoOp(id, data) {
    const db = await openDB()
    return new Promise(resolve => {
      const tx = db.transaction('fotos', 'readwrite')
      tx.objectStore('fotos').put({ id, data })
      tx.oncomplete = resolve
    })
  }

  // v140: een foto die de vriend weghaalde, ook hier weghalen
  async function wisFotoUitDB(id) {
    try {
      const db = await openDB()
      return new Promise(resolve => {
        const tx = db.transaction('fotos', 'readwrite')
        tx.objectStore('fotos').delete(id)
        tx.oncomplete = resolve
        tx.onerror = resolve
        tx.onabort = resolve
      })
    } catch { }
  }

  async function laadFotoUitDB(id) {
    try {
      const db = await openDB()
      return new Promise(resolve => {
        const req = db.transaction('fotos').objectStore('fotos').get(id)
        req.onsuccess = e => resolve(e.target.result?.data || null)
        req.onerror = () => resolve(null)
      })
    } catch { return null }
  }

  // -- Gegevens van anderen veilig tonen (ontsmetten) --
  // Alles wat van een vriend komt (via P2P of Supabase) kan vervalst zijn.
  const vEsc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')
  const vAfb = v => { const u = String(v || '').trim(); return /^data:image\/[a-z0-9.+-]+;base64,[A-Za-z0-9+/=]+$/i.test(u) ? u : null }
  const vVideo = v => { const u = String(v || '').trim(); return /^data:video\/[a-z0-9.+-]+(;[a-z0-9.=+-]+)*;base64,[A-Za-z0-9+/=]+$/i.test(u) ? u : null }
  const vKleur = v => { const u = String(v || '').trim(); return /^(#[0-9a-f]{3,8}|[a-z]{3,30}|(rgba?|hsla?)\([0-9.,%\sdeg]+\)|(repeating-)?(linear|radial|conic)-gradient\([#0-9a-z.,%\s()-]+\))$/i.test(u) ? u : null }
  const vFont = v => { const u = String(v || '').trim(); return u && u.length < 200 && /^[\w\s,'"-]+$/.test(u) ? u : null }

  // ── Online check via laatst_gezien ──
  function isOnline(profiel) {
    try { if (localStorage.getItem('fibro_ik_offline') === '1') return false } catch (e) {}
    if (!profiel.online_status) return false
    if (!profiel.laatst_gezien) return false
    const sec = (Date.now() - new Date(profiel.laatst_gezien).getTime()) / 1000
    return sec < 300 // heartbeat elke 2 min (heartbeat.js)
  }

  // ── Wallpaper tonen ──
  // v204: alleen die van de vriend; je eigen achtergrond komt hier niet meer (thema.js kijkt naar data-vriend-profiel)
  function toonWallpaper(dataUrl) {
    dataUrl = vAfb(dataUrl)
    if (!dataUrl) return
    const bg = document.getElementById('wallpaperBg')
    bg.style.backgroundImage = `url(${dataUrl})`
    document.body.style.background = 'transparent'
    document.body.classList.add('heeft-wallpaper')
    // Maak kaarten iets donkerder voor leesbaarheid
    document.documentElement.style.setProperty('--card', 'rgba(0,0,0,0.65)')
    document.documentElement.style.setProperty('--border', 'rgba(255,255,255,0.15)')
  }
  // v204: de vriend heeft (nu) geen foto: een foto van de vorige keer weer weghalen (die bleef staan tot het volgende bezoek),
  // dan is zijn kleur of verloop (--bg) weer te zien
  function verbergWallpaper() {
    const bg = document.getElementById('wallpaperBg')
    if (bg) bg.style.backgroundImage = ''
    document.body.style.background = ''
    document.body.classList.remove('heeft-wallpaper')
    document.documentElement.style.removeProperty('--card')
    document.documentElement.style.removeProperty('--border')
  }

  // ── Avatar tonen (foto of emoji) ──
  function toonAvatar(dataUrl, emoji) {
    const el = document.getElementById('avatarEmoji')
    const veiligeAvatar = /^data:image\/(png|jpe?g|gif|webp);base64,[A-Za-z0-9+/=]+$/i.test(String(dataUrl||'').trim()) ? dataUrl : null
    if (veiligeAvatar) {
      el.innerHTML = `<img src="${veiligeAvatar}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`
    } else {
      el.textContent = emoji || '👤'
    }
  }

  // ── Weergavenaam: via P2P ontvangen en lokaal bewaard ──
  function _eigenUid() {
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i)
        if (k && k.startsWith('sb-') && k.endsWith('-auth-token')) {
          const v = JSON.parse(localStorage.getItem(k))
          if (v?.user?.id) return v.user.id
        }
      }
    } catch(e) {}
    return ''
  }
  function vriendNaam(username) {
    try {
      const n = String(localStorage.getItem('vriend_naam_' + vriendId + '_' + _eigenUid()) || '').trim()
      if (n) return n
    } catch(e) {}
    return username || 'Naamloos'
  }
  function heeftVriendNaam() {
    try {
      return !!String(localStorage.getItem('vriend_naam_' + vriendId + '_' + _eigenUid()) || '').trim()
    } catch(e) { return false }
  }

  // v179: het profielnummer van je vriend speelt vanzelf (profielmuziek.js), als het al op dit toestel staat (sync.js
  // haalt het over een rechtstreekse verbinding). Uit te zetten op Home bij ☰ > Instellingen > Muziek vanzelf afspelen.
  let profielMuziekGestart = false
  async function startVriendMuziek(naam) {
    try {
      if (!vriendId) return // v180: ook als 'Muziek van vrienden vanzelf' uit staat: dan het knopje met \u25B6
      const data = await laadFotoUitDB('vriend_' + vriendId + '_muziek_profiel')
      if (!data) return
      const m = await import('./profielmuziek.js?v=184')
      await m.speelProfielMuziek({ data, titel: T('Muziek van {naam}', { naam }), sleutel: 'vriend_' + vriendId, vriend: true })
    } catch (e) { console.warn('[profielmuziek]', e) }
  }

  // ── Profiel data tonen ──
  function toonProfielData(data) {
    const naam = vriendNaam(data.username)
    if (!profielMuziekGestart) { profielMuziekGestart = true; startVriendMuziek(naam) }
    document.getElementById('profielNaam').textContent = naam
    document.getElementById('profielUsername').textContent = heeftVriendNaam() ? '@' + (data.username || '') : ''
    document.getElementById('profielBio').textContent = data.bio || ''
    document.getElementById('paginaTitel').textContent = naam

    // Mood splitsen in emoji + tekst (v171: of een sticker, moodsticker.js: tik = beweging en geluid)
    const mood = data.mood || ''
    const ms = leesMood(mood)
    const moodEmoji = mood.match(/^\p{Emoji}/u)?.[0] || '💭'
    const moodTekst = (ms.code ? ms.tekst : mood.replace(/^\p{Emoji}\s*/u, '')) || T('Geen mood')
    const moodEl = document.getElementById('moodEmoji')
    if (ms.code) {
      if (moodEl.dataset.sticker !== ms.code) { moodEl.dataset.sticker = ms.code; tekenMoodSticker(moodEl, ms.code, { vriendId: data.id || vriendId }) }
    } else { delete moodEl.dataset.sticker; moodEl.textContent = moodEmoji }
    document.getElementById('moodTekst').textContent = moodTekst

    // Online status
    const online = isOnline(data)
    const dot = document.getElementById('onlineDot')
    dot.classList.toggle('online', online)
    document.getElementById('onlineLabel').textContent = online
      ? 'Online'
      : (data.offline_bericht ? `${isMoodSticker(data.offline_emoji) ? '' : (data.offline_emoji || '💤') + ' '}${data.offline_bericht}` : T('Offline'))

    // Kleuren
    if (vKleur(data.accent_kleur)) document.documentElement.style.setProperty('--accent', vKleur(data.accent_kleur))
    if (vKleur(data.accent_kleur2)) document.documentElement.style.setProperty('--accent2', vKleur(data.accent_kleur2))
    if (vKleur(data.achtergrond_kleur) && !data.wallpaper_data) {
      document.documentElement.style.setProperty('--bg', vKleur(data.achtergrond_kleur))
    }

    // Lettertype
    if (vFont(data.lettertype)) {
      const style = document.createElement('style')
      style.textContent = `* { font-family: ${vFont(data.lettertype)} !important; }`
      document.head.appendChild(style)
    }
  }

  function widgetDebug(tekst) {
    return // debug-badge uitgeschakeld (stap D af)
    let d = document.getElementById('widget-debug')
    if (!d) {
      d = document.createElement('div')
      d.id = 'widget-debug'
      d.style.cssText = 'position:fixed;bottom:110px;right:10px;background:rgba(0,0,0,0.8);color:#ff0;padding:6px 10px;border-radius:8px;font-size:12px;z-index:9999;font-family:monospace;max-width:260px'
      document.body.appendChild(d)
    }
    d.textContent = 'widgets: ' + tekst
  }

  async function toonVriendWidgets() {
    const layoutJson = await laadFotoUitDB('vriend_' + vriendId + '_layout')
    if (!layoutJson) { widgetDebug('niets in cache voor ' + vriendId.slice(0,8)) ; return }
    let layout
    try { layout = JSON.parse(layoutJson) } catch (e) { widgetDebug('JSON kapot: ' + String(layoutJson).slice(0,40)) ; return }
    const actief = (layout || []).filter(w => w.aan).sort((a,b) => (a.volgorde||0) - (b.volgorde||0))
    widgetDebug(layout.length + ' totaal, ' + actief.length + ' aan')
    if (!actief.length) return
    const grid = document.getElementById('vriendWidgetGrid')
    grid.innerHTML = ''
    const fotoAantal = { '3x3': 9, '2x2': 4, 'groot': 1, 'banner': 4, '1x3': 3, 'featured': 5, 'zwevend': 3, 'polaroid': 6 }
    for (const w of actief) {
      const el = document.createElement('div')
      el.className = 'widget-blok'
      el.style.gridColumn = 'span ' + Math.min(w.w || 2, 4)
      el.style.gridRow = 'span ' + (w.h || 1)
      // Foto-widget: probeer echte (P2P-gesyncte) foto's uit de cache te tonen
      const stijlAlias = { 'masonry': 'polaroid' }
      let stijl = (w.id || '').startsWith('fotos_') ? w.id.slice(6) : null
      if (stijl && stijlAlias[stijl]) stijl = stijlAlias[stijl]
      if (stijl && fotoAantal[stijl]) {
        const fotos = []
        for (let i = 0; i < fotoAantal[stijl]; i++) {
          const f = await laadFotoUitDB('vriend_' + vriendId + '_foto_pfoto_' + stijl + '_' + i)
          if (vAfb(f)) fotos.push(vAfb(f))
        }
        if (fotos.length) {
          const kolommenMap = { '3x3':3, '2x2':2, 'banner':4, '1x3':1, 'groot':1, 'zwevend':3, 'polaroid':3, 'featured':3 }
          const kolommen = kolommenMap[stijl] || 1
          const ratio = stijl === 'groot' ? '4/3' : (stijl === 'banner' ? '3/4' : '1/1')
          el.classList.add('widget-blok-naakt'); el.style.display='flex'; el.style.flexDirection='column'
          if (stijl === 'polaroid') {
            el.innerHTML = '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;">' +
              fotos.map((f,i) => '<div style="background:#f5f5f0;padding:5px 5px 16px;border-radius:3px;box-shadow:0 2px 8px rgba(0,0,0,0.4);transform:rotate(' + ((i%3)-1)*2 + 'deg);"><img src="' + f + '" style="width:100%;aspect-ratio:1/1;object-fit:cover;display:block;"></div>').join('') +
              '</div>'
          } else if (stijl === 'zwevend') {
            const POS = [
              { rot:-8, z:1, top:'6%',  left:'2%',  w:'40%' },
              { rot:4,  z:3, top:'14%', left:'32%', w:'42%' },
              { rot:9,  z:2, top:'4%',  left:'58%', w:'40%' }
            ]
            el.innerHTML = '<div style="position:relative;width:100%;padding-bottom:75%;">' +
              fotos.slice(0,3).map((f,i) => {
                const p = POS[i] || POS[0]
                return '<div style="position:absolute;top:' + p.top + ';left:' + p.left + ';width:' + p.w + ';z-index:' + p.z + ';transform:rotate(' + p.rot + 'deg);background:#f5f5f0;padding:5px 5px 14px;border-radius:2px;box-shadow:0 3px 10px rgba(0,0,0,0.5);"><img src="' + f + '" style="width:100%;aspect-ratio:1/1;object-fit:cover;display:block;"></div>'
              }).join('') +
              '</div>'
          } else if (stijl === 'featured' && fotos.length > 1) {
            el.innerHTML = '<div style="display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:4px;width:100%;aspect-ratio:16/9;max-height:100%;">' +
              '<img src="' + fotos[0] + '" style="grid-column:1/2;grid-row:1/3;width:100%;height:100%;object-fit:cover;border-radius:10px;display:block;min-height:0;">' +
              fotos.slice(1,5).map(f => '<img src="' + f + '" style="width:100%;height:100%;object-fit:cover;border-radius:8px;display:block;min-height:0;">').join('') +
              '</div>'
          } else {
            el.innerHTML = '<div style="display:grid;grid-template-columns:repeat(' + kolommen + ',1fr);gap:6px;width:100%;">' +
              fotos.map(f => '<img src="' + f + '" style="width:100%;aspect-ratio:' + ratio + ';object-fit:cover;border-radius:10px;display:block;">').join('') +
              '</div>'
          }
          grid.appendChild(el)
          continue
        }
      }
      // Muziek-widget: probeer echte (P2P-gesyncte) muziek uit de cache af te spelen
      if (w.id === 'muziek') {
        const gelukt = await renderVriendMuziek(el)
        if (gelukt) { grid.appendChild(el); continue }
      }
      if (w.id === 'video') {
        const gelukt = await renderVriendVideo(el, vriendId)
        if (gelukt) { grid.appendChild(el); continue }
      }
      if (w.id === 'quote') {
        const gelukt = await renderVriendQuote(el, vriendId)
        if (gelukt) { grid.appendChild(el); continue }
      }
      if (w.id === 'poll') {
        const gelukt = await renderVriendPoll(el, vriendId)
        if (gelukt) { grid.appendChild(el); continue }
      }
      if (w.id === 'afteltimer') {
        const gelukt = await renderVriendTimer(el, vriendId, 'aftel')
        if (gelukt) { grid.appendChild(el); continue }
      }
      if (w.id === 'opteltimer') {
        const gelukt = await renderVriendTimer(el, vriendId, 'optel')
        if (gelukt) { grid.appendChild(el); continue }
      }
      // Gastenboek-widget: dezelfde inhoud als op de homepagina
      if (w.id === 'gastenboek') {
        el.innerHTML = '<div class="widget-header"><span class="widget-icon-sm">📖</span><span class="widget-titel">' + T('Gastenboek') + '</span></div><div class="widget-inhoud gbw-inhoud" style="align-items:stretch;text-align:left;gap:8px;background:rgba(20,8,36,0.72);border-radius:12px;padding:10px;"></div>'
        grid.appendChild(el)
        await renderGastenboekWidget(el.querySelector('.gbw-inhoud'), vriendId, w.papier !== false) // v235: of zonder lijntjes
        continue
      }
      // v129: spel van de vriend: tikken = zelf spelen tegen de computer (zoals op Home)
      if ((w.id || '').startsWith('spel_')) {
        const spel = w.id.slice(5)
        el.innerHTML = '<div class="widget-inhoud" style="flex-direction:row;gap:10px;cursor:pointer"><span style="font-size:30px;line-height:1">' + vEsc(w.icon || '\u{1F3AE}') + '</span><span style="font-size:13px;font-weight:600;color:#fff">' + T('\u25B6 Spelen') + '</span></div>'
        el.style.cursor = 'pointer'
        el.onclick = () => { location.href = 'spel.html?spel=' + encodeURIComponent(spel) }
        grid.appendChild(el)
        continue
      }
      // v157: sticker van de vriend (stickerwidget.js): tik = beweging en geluid
      if (/^sticker_/.test(w.id || '')) {
        el.innerHTML = '<div class="widget-inhoud"></div>'
        grid.appendChild(el)
        try { await (await import('./stickerwidget.js?v=236')).tekenStickerWidget(el.querySelector('.widget-inhoud'), w.id, { vriendId }) }
        catch (e) { console.warn('[stickerwidget]', e); el.remove() }
        continue
      }
      // v129: poll/timer/quote zonder inhoud: zeggen dat er nog niets staat (in plaats van alleen een icoon)
      const leegTekst = { poll: T('Nog geen poll'), afteltimer: T('Nog geen datum'), opteltimer: T('Nog geen datum'), quote: T('Nog geen quote') }[w.id]
      el.innerHTML = '<div class="widget-header"><span class="widget-icon-sm">' + vEsc(w.icon || '🧩') + '</span><span class="widget-titel">' + vEsc(w.titel ? T(w.titel) : w.id) + '</span></div><div class="widget-inhoud">' + (leegTekst ? '<div style="font-size:13px;color:var(--muted)">' + leegTekst + '</div>' : '<div class="wi-icon">' + vEsc(w.icon || '🧩') + '</div>') + '</div>'
      grid.appendChild(el)
    }
    grid.style.display = ''
  }


  // ── Achtergrondfoto van vriend-widget (alleen tonen, niet bewerken) ──
  async function vriendAchtergrond(el, vriendId, wid) {
    const rec = await haalRecordVP('vriend_' + vriendId + '_wbg_' + wid)
    if (!rec || !vAfb(rec.data)) return
    let p = { s:100, x:50, y:50 }
    try { if (rec.pos) p = JSON.parse(rec.pos) } catch(e) {}
    el.style.position = 'relative'
    el.style.backgroundImage = 'linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.5)),url(' + vAfb(rec.data) + ')'
    el.style.backgroundSize = p.s + '% auto'
    el.style.backgroundPosition = p.x + '% ' + p.y + '%'
    el.style.backgroundRepeat = 'no-repeat'
  }

  async function haalRecordVP(id) {
    try {
      const db = await openDB()
      return await new Promise(res => {
        const r = db.transaction('fotos','readonly').objectStore('fotos').get(id)
        r.onsuccess = () => res(r.result || null)
        r.onerror = () => res(null)
      })
    } catch(e) { return null }
  }

  const escVW = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')

  // Poll van een vriend. De vraag en de antwoorden komen via P2P; de stemmen
  // staan op de server. Niemand kan zien wie wat gestemd heeft, ook wij niet.
  async function renderVriendPoll(el, vriendId) {
    const ruw = await laadFotoUitDB('vriend_' + vriendId + '_poll')
    if (!ruw) return false
    let p = null
    try { p = JSON.parse(ruw) } catch (e) { return false }
    if (!p || !p.vraag || !Array.isArray(p.opties) || p.opties.length < 2) return false
    await vriendAchtergrond(el, vriendId, 'poll')

    const teken = async () => {
      let tellers = {}, alGestemd = false, kanStemmen = !!p.id && navigator.onLine // v128: zonder internet niet wachten
      if (kanStemmen) {
        try {
          const [t, m] = await Promise.all([
            supabase.from('poll_tellers').select('optie, aantal').eq('eigenaar_id', vriendId).eq('poll_id', p.id),
            supabase.from('poll_stemmers').select('poll_id').eq('eigenaar_id', vriendId).eq('poll_id', p.id).eq('stemmer_id', huidigeUser.id)
          ])
          for (const r of (t.data || [])) tellers[r.optie] = r.aantal
          alGestemd = !!(m.data && m.data.length)
        } catch (e) { console.warn('[poll] tellers ophalen mislukt', e); kanStemmen = false }
      }
      const tot = Object.values(tellers).reduce((a, b) => a + b, 0)
      const toonPct = alGestemd || !kanStemmen
      const balken = p.opties.map((o, i) => {
        const n = tellers[i] || 0
        const pct = tot > 0 ? Math.round(n / tot * 100) : 0
        return '<div class="vpoll-opt" data-i="' + i + '" style="position:relative;border-radius:8px;overflow:hidden;border:0.5px solid var(--border);cursor:' + (toonPct ? 'default' : 'pointer') + '">'
          + '<div style="position:absolute;top:0;left:0;height:100%;width:' + (toonPct ? pct : 0) + '%;background:rgba(192,132,252,0.25)"></div>'
          + '<div style="position:relative;display:flex;justify-content:space-between;padding:8px 10px">'
          + '<span style="font-size:13px">' + escVW(o.tekst) + '</span>'
          + '<span style="font-size:12px;color:var(--accent);font-weight:600">' + (toonPct ? pct + '%' : '') + '</span>'
          + '</div></div>'
      }).join('')
      const onder = !navigator.onLine ? T('\u{1F4F4} Zonder internet kun je niet stemmen')
        : !kanStemmen ? T('Stemmen kan nog niet op deze poll')
        : alGestemd ? T('{n} stemmen', { n: tot })
        : T('Tik op je keuze')
      el.innerHTML = '<div style="position:relative;z-index:2;padding:10px 8px">'
        + '<div style="font-size:14px;font-weight:600;margin-bottom:8px">' + escVW(p.vraag) + '</div>'
        + '<div style="display:flex;flex-direction:column;gap:6px">' + balken + '</div>'
        + '<div style="font-size:11px;color:rgba(255,255,255,0.7);margin-top:8px">' + onder + '</div>'
        + '</div>'

      if (toonPct) return
      el.querySelectorAll('.vpoll-opt').forEach(knop => {
        knop.onclick = async () => {
          el.querySelectorAll('.vpoll-opt').forEach(k => { k.onclick = null })
          try {
            const { data, error } = await supabase.rpc('stem_op_poll', {
              eigenaar_in: vriendId, poll_id_in: p.id,
              optie_in: parseInt(knop.dataset.i, 10), aantal_opties: p.opties.length
            })
            if (error) { alert(T('Stemmen is niet gelukt. Probeer het later nog eens.')); console.error('[poll]', error) }
            else if (data === 'geen vriend') alert(T('Je kunt alleen stemmen op de poll van een vriend.'))
            else if (data && data !== 'ok' && data !== 'al gestemd') alert(T('Stemmen is niet gelukt: {fout}', { fout: data }))
          } catch (e) { console.error('[poll]', e) }
          await teken()
        }
      })
    }

    await teken()
    return true
  }

  async function renderVriendQuote(el, vriendId) {

  async function renderVriendTimer(el, vriendId, soort) {
    const ruw = await laadFotoUitDB('vriend_' + vriendId + '_' + soort)
    if (!ruw) return false
    let cfg = null
    try { cfg = JSON.parse(ruw) } catch(e) { return false }
    if (!cfg || !cfg.datum) return false
    await vriendAchtergrond(el, vriendId, soort)
    el.innerHTML = '<div style="text-align:center;position:relative;z-index:2;padding:8px 4px">'
      + '<div style="font-size:13px;font-weight:600;margin-bottom:8px;color:var(--accent);text-shadow:0 1px 4px rgba(0,0,0,0.7)">'
      + escVW(cfg.bericht || (soort === 'aftel' ? T('Aftellen') : T('Optellen'))) + '</div>'
      + '<div class="vt-cijfers" style="display:flex;gap:5px;justify-content:center;flex-wrap:wrap"></div></div>'
    const doel = el.querySelector('.vt-cijfers')
    const blok = (n,l) => '<div style="display:flex;flex-direction:column;align-items:center;background:rgba(192,132,252,0.15);border-radius:8px;padding:5px 7px;min-width:42px"><span style="font-size:18px;font-weight:700;color:var(--accent);font-family:monospace">' + String(n).padStart(2,'0') + '</span><span style="font-size:9px;color:rgba(255,255,255,0.8)">' + l + '</span></div>'
    let tr
    const upd = () => {
      if (!document.body.contains(doel)) { clearInterval(tr); return }
      const mom = new Date(cfg.datum + 'T' + (cfg.tijd || '00:00') + ':00')
      const diff = soort === 'aftel' ? (mom - new Date()) : (new Date() - mom)
      if (diff <= 0) {
        doel.innerHTML = soort === 'aftel' ? T('Het is zover!') : T('Nog niet begonnen')
        clearInterval(tr); return
      }
      const d = Math.floor(diff/86400000), h = Math.floor((diff%86400000)/3600000)
      const m = Math.floor((diff%3600000)/60000), s = Math.floor((diff%60000)/1000)
      doel.innerHTML = blok(d,T('dagen')) + blok(h,T('uur')) + blok(m,T('min')) + blok(s,T('sec'))
    }
    upd(); tr = setInterval(upd, 1000)
    return true
  }

  // ── Muziek-widget van vriend (P2P-gesyncte cache) ──
  async function renderVriendVideo(el, vriendId){
  try {
    const ruw = await laadFotoUitDB('vriend_' + vriendId + '_video_meta')
    if (!ruw) return false
    let meta = null
    try { meta = JSON.parse(ruw) } catch(e) { return false }
    if (!meta || !meta.thumb || !vAfb(meta.thumb)) return false
    const titel = String(meta.titel || 'Video').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    const duur = Math.floor(meta.duur/60) + ':' + String(Math.floor(meta.duur%60)).padStart(2,'0')
    el.innerHTML = '<div style="position:relative;width:100%;height:100%;border-radius:10px;overflow:hidden;background:#000;">'
      + '<img src="' + vAfb(meta.thumb) + '" style="width:100%;height:100%;object-fit:cover;">'
      + '<div class="vid-play-knop" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;cursor:pointer;background:rgba(0,0,0,0.25);">'
      + '<div style="width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,0.9);display:flex;align-items:center;justify-content:center;font-size:20px;color:#1a0a2e;">&#9654;</div></div>'
      + '<div style="position:absolute;bottom:0;left:0;right:0;padding:6px 10px;background:linear-gradient(transparent,rgba(0,0,0,0.8));font-size:11px;color:#fff;display:flex;justify-content:space-between;">'
      + '<span>' + titel + '</span><span>' + duur + '</span></div></div>'
    const knop = el.querySelector('.vid-play-knop')
    if (knop) knop.onclick = async () => {
      // Afspelen via een Blob-adres: iPhones spelen een lange data:-tekst slecht af.
      // Staat de video hier nog niet, dan wordt hij nu pas bij de vriend opgehaald (v112).
      el.innerHTML = '<div style="display:flex;flex-direction:column;width:100%;height:100%;gap:6px;">'
        + '<div class="vid-plek" style="position:relative;flex:1;min-height:0;border-radius:10px;overflow:hidden;background:#000;">'
        + '<div class="vid-melding" style="position:absolute;inset:0;z-index:2;pointer-events:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;padding:0 12px;text-align:center;">' + T('Video laden...') + '</div></div>'
        + '<div style="display:flex;justify-content:flex-start;"><button type="button" class="vid-sluit" style="background:rgba(255,255,255,0.12);color:#fff;border:0.5px solid rgba(255,255,255,0.14);border-radius:16px;padding:6px 14px;font-size:12px;cursor:pointer;">' + T('✕ Sluiten') + '</button></div></div>'
      const plek = el.querySelector('.vid-plek')
      const meld = t => { const m = el.querySelector('.vid-melding'); if (m) { m.textContent = t; m.style.display = t ? 'flex' : 'none' } }
      let url = null
      const stop = () => {
        const v = el.querySelector('video')
        if (v) { try { v.pause() } catch(e) {} v.removeAttribute('src'); try { v.load() } catch(e) {} }
        if (url) { try { URL.revokeObjectURL(url) } catch(e) {} url = null }
      }
      el.querySelector('.vid-sluit').onclick = () => { stop(); renderVriendVideo(el, vriendId) }
      let data = vVideo(await laadFotoUitDB('vriend_' + vriendId + '_video_data'))
      if (!data) {
        meld(T('Video ophalen bij je vriend...'))
        try {
          await vraagVriendVideo(vriendId, p => { if (plek.isConnected) meld(T('Video ophalen... {p}%', { p: Math.round(p * 100) })) })
        } catch (e) {
          const r = e && e.message
          if (r === 'afgebroken' || !plek.isConnected) return
          meld(r === 'offline' ? T('Je vriend is nu niet online. De video kan alleen worden opgehaald als jullie allebei Fibro open hebben.')
            : r === 'relay' ? T('Jullie zijn alleen via de relay-server verbonden. Video\u2019s worden daarom niet opgehaald (dat kost te veel data).')
            : r === 'geen-video' ? T('Je vriend heeft deze video niet meer.')
            : r === 'ander-tabblad' ? T('Fibro is ook in een ander tabblad open. Sluit dat en probeer het opnieuw.')
            : T('De video kon niet worden opgehaald. Probeer het zo nog eens.'))
          return
        }
        if (!plek.isConnected) return
        data = vVideo(await laadFotoUitDB('vriend_' + vriendId + '_video_data'))
        if (!data) { meld(T('De video kon niet worden opgehaald. Probeer het zo nog eens.')); return }
      }
      let blob = null
      try {
        // In stukjes omzetten: fetch() op een lange data:-tekst faalt op de iPhone bij grote video's
        const k = data.indexOf(','), type = data.slice(5, k).split(';')[0] || 'video/mp4'
        const STAP = 4194304, delen = [], tot = data.length - k - 1
        for (let i = k + 1; i < data.length; i += STAP) {
          const s = atob(data.slice(i, Math.min(i + STAP, data.length)))
          const u = new Uint8Array(s.length)
          for (let j = 0; j < s.length; j++) u[j] = s.charCodeAt(j)
          delen.push(u)
          meld(T('Video laden... {p}%', { p: Math.round(Math.min(1, (i + STAP - k - 1) / tot) * 100) }))
          await new Promise(r => setTimeout(r, 0))
        }
        blob = new Blob(delen, { type })
      } catch(e) { meld(T('Video kon niet worden geladen.')); return }
      if (!plek.isConnected) return
      url = URL.createObjectURL(blob)
      const v = document.createElement('video')
      v.controls = true; v.playsInline = true; v.setAttribute('playsinline', ''); v.preload = 'auto'
      v.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;'
      v.onloadedmetadata = () => { if (!v.videoWidth) meld(T('Dit toestel kan het beeld van deze video niet tonen (alleen geluid).')); else meld('') }
      v.onerror = () => { meld(v.error ? T('Deze video kan op dit toestel niet worden afgespeeld (fout {code}).', { code: v.error.code }) : T('Deze video kan op dit toestel niet worden afgespeeld.')) }
      v.src = url
      plek.appendChild(v)
      try { const p = v.play(); if (p && p.catch) p.catch(() => {}) } catch(e) {}
    }
    return true
  } catch(e) { return false }
}

async function renderVriendMuziek(el) {
    // Verzamel tracks: eerst playlist (Systeem 2), dan losse profiel-track (Systeem 1)
    let tracks = []
    const idxRuw = await laadFotoUitDB('vriend_' + vriendId + '_muziek_index')
    if (idxRuw) {
      try {
        const idxLijst = JSON.parse(idxRuw) || []
        for (let i = 0; i < idxLijst.length; i++) {
          const d = await laadFotoUitDB('vriend_' + vriendId + '_muziek_nr' + i)
          if (d) tracks.push({ naam: idxLijst[i].naam, artiest: idxLijst[i].artiest || '', data: d })
        }
      } catch(e) {}
    }
    const playlistJson = tracks.length ? null : await laadFotoUitDB('vriend_' + vriendId + '_muziek_playlist')
    if (playlistJson) {
      try {
        const p = JSON.parse(playlistJson)
        if (Array.isArray(p)) tracks = p.filter(t => t && t.data)
      } catch(e) {}
    }
    if (!tracks.length) {
      const los = await laadFotoUitDB('vriend_' + vriendId + '_muziek_profiel')
      if (los && String(los).startsWith('data:audio')) {
        tracks = [{ naam: 'Nummer', artiest: '', data: los }]
      }
    }
    if (!tracks.length) return false

    let idx = 0
    let audio = null
    const escH = vEsc
    const fmt = s => { if(!s||isNaN(s))return '0:00'; const m=Math.floor(s/60),sec=Math.floor(s%60); return m+':'+(sec<10?'0':'')+sec }

    const render = () => {
      const t = tracks[idx]
      el.innerHTML = `
        <div class="widget-header"><span class="widget-icon-sm">🎵</span><span class="widget-titel">${T('Muziek')}</span></div>
        <div class="widget-inhoud" style="align-items:stretch;text-align:left;gap:8px;">
          <div style="display:flex;align-items:center;gap:10px;">
            <div style="width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;overflow:hidden;">
              ${/^data:image\/(png|jpe?g|gif|webp);base64,[A-Za-z0-9+/=]+$/i.test(String(t.cover||'').trim()) ? '<img src="' + t.cover + '" style="width:100%;height:100%;object-fit:cover;border-radius:10px;">' : '🎵'}
            </div>
            <div style="flex:1;min-width:0;">
              <div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escH(t.naam || T('Nummer'))}</div>
              <div style="font-size:11px;color:rgba(255,255,255,0.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escH(t.artiest || '')}</div>
            </div>
          </div>
          <div>
            <div id="vm-balk" style="height:4px;background:rgba(255,255,255,0.1);border-radius:2px;cursor:pointer;">
              <div id="vm-prog" style="height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;"></div>
            </div>
            <div style="display:flex;justify-content:space-between;margin-top:3px;">
              <span id="vm-tijd" style="font-size:10px;color:rgba(255,255,255,0.7);">0:00</span>
              <span id="vm-duur" style="font-size:10px;color:rgba(255,255,255,0.7);">0:00</span>
            </div>
          </div>
          <div style="display:flex;align-items:center;justify-content:center;gap:14px;">
            ${tracks.length > 1 ? '<button id="vm-prev" style="background:none;border:none;font-size:18px;cursor:pointer;color:rgba(255,255,255,0.7);">⏮</button>' : ''}
            <button id="vm-play" style="width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;font-size:16px;cursor:pointer;color:#1a0a2e;display:flex;align-items:center;justify-content:center;">▶</button>
            ${tracks.length > 1 ? '<button id="vm-next" style="background:none;border:none;font-size:18px;cursor:pointer;color:rgba(255,255,255,0.7);">⏭</button>' : ''}
          </div>
        </div>`

      if (audio) { audio.pause(); audio.src = '' }
      audio = new Audio(t.data)
      // v180: voor geluidregelaar.js, en de knop volgt de speler
      audio.dataset.fibroGeluid = 'muziek'
      audio.dataset.fibroTitel = t.naam || ''
      { const a = audio
        a.onplay = () => { if (a !== audio) return; const b = el.querySelector('#vm-play'); if (b) b.textContent = '\u23F8' }
        a.onpause = () => { if (a !== audio) return; const b = el.querySelector('#vm-play'); if (b) b.textContent = '\u25B6' } }
      audio.ontimeupdate = () => {
        const prog = el.querySelector('#vm-prog'), tijd = el.querySelector('#vm-tijd')
        if (prog && audio.duration) prog.style.width = (audio.currentTime / audio.duration * 100) + '%'
        if (tijd) tijd.textContent = fmt(audio.currentTime)
      }
      audio.onloadedmetadata = () => {
        const d = el.querySelector('#vm-duur'); if (d) d.textContent = fmt(audio.duration)
      }
      audio.onended = () => {
        if (tracks.length > 1) { idx = (idx + 1) % tracks.length; render(); setTimeout(() => { if(audio){audio.play(); const b=el.querySelector('#vm-play'); if(b)b.textContent='⏸'} }, 100) }
        else { const b = el.querySelector('#vm-play'); if (b) b.textContent = '▶' }
      }

      const playBtn = el.querySelector('#vm-play')
      if (playBtn) playBtn.onclick = () => {
        if (!audio) return
        if (audio.paused) { audio.play(); playBtn.textContent = '⏸' }
        else { audio.pause(); playBtn.textContent = '▶' }
      }
      const prevBtn = el.querySelector('#vm-prev')
      if (prevBtn) prevBtn.onclick = () => { idx = (idx - 1 + tracks.length) % tracks.length; render(); setTimeout(() => { if(audio){audio.play(); const b=el.querySelector('#vm-play'); if(b)b.textContent='⏸'} }, 100) }
      const nextBtn = el.querySelector('#vm-next')
      if (nextBtn) nextBtn.onclick = () => { idx = (idx + 1) % tracks.length; render(); setTimeout(() => { if(audio){audio.play(); const b=el.querySelector('#vm-play'); if(b)b.textContent='⏸'} }, 100) }
      const balk = el.querySelector('#vm-balk')
      if (balk) balk.onclick = e => {
        if (!audio || !audio.duration) return
        const rect = balk.getBoundingClientRect()
        audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration
      }
    }
    render()
    return true
  }

  async function init() {
    await laadThema()
    // Eigen wallpaper hoort niet op het profiel van een vriend:
    document.body.style.backgroundImage = ''

    let { data: { session } } = await supabase.auth.getSession()
    if (!session) {
      const s2 = await eisSessie()
      if (!s2) return
      session = s2
    }
    startBewaking()
    huidigeUser = session.user
    initSync(huidigeUser.id)

    const params = new URLSearchParams(window.location.search)
    vriendId = params.get('id')
    // Blokstijl van de vriend tonen (v80); zonder gesyncte stijl blijft de eigen stijl staan
    ;(async () => {
      try {
        if (!vriendId) return
        const ruwBs = await laadFotoUitDB('vriend_' + vriendId + '_blokstijl')
        if (!ruwBs) return
        const bs = JSON.parse(ruwBs)
        const m = await import('./blokstijl.js?v=95')
        const eigen = m.haalBlokstijl()
        m.pasBlokstijlToe({ ...eigen, kleur: bs.kleur, doorzicht: bs.doorzicht, hoek: bs.hoek })
      } catch (e) { console.warn('[blokstijl] stijl van vriend toepassen mislukt', e) }
    })()
    if (!vriendId) { window.location.href = 'vrienden.html'; return }

    // v129: komen er nieuwe gegevens van deze vriend binnen (de sync), dan de widgets meteen bijwerken.
    // Niet terwijl er muziek of een video van de vriend speelt.
    let widgetsBezig = null, widgetsOpnieuw = false, widgetsTimer = null
    const verversWidgets = async () => {
      if (widgetsBezig) { widgetsOpnieuw = true; return }
      widgetsBezig = toonVriendWidgets().catch(e => console.warn('[widgets]', e))
      await widgetsBezig
      widgetsBezig = null
      if (widgetsOpnieuw) { widgetsOpnieuw = false; verversWidgets() }
    }
    const speeltIets = () => [...document.querySelectorAll('#vriendWidgetGrid audio, #vriendWidgetGrid video')].some(m => !m.paused)
    const later = () => {
      clearTimeout(widgetsTimer)
      widgetsTimer = setTimeout(() => { if (speeltIets()) later(); else verversWidgets() }, 800)
    }
    try {
      if ('BroadcastChannel' in window) {
        const kanaal = new BroadcastChannel('fibro-vriend-data')
        kanaal.onmessage = e => {
          const id = e && e.data && e.data.id
          if (typeof id === 'string' && id.startsWith('vriend_' + vriendId + '_') && !id.endsWith('_video_data')) later()
        }
      }
    } catch (e) {}

    verversWidgets()

    // ── Stap 1: Toon eerst cache (snel) ──
    const cacheKey = 'vriend_cache_' + vriendId + '_' + (huidigeUser?.id || 'anon')
    const cache = localStorage.getItem(cacheKey)
    let getoond = false
    if (cache) {
      try {
        const cached = JSON.parse(cache)
        toonProfielData({ ...cached, username: cached.naam }) // v128: de cache bewaart de naam als 'naam'
        getoond = true

        // Gecachede avatar tonen
        const cachedAvatar = await laadFotoUitDB('vriend_avatar_' + vriendId)
        toonAvatar(cachedAvatar, cached.avatar)

        // Gecachede wallpaper tonen
        const cachedWallpaper = await laadFotoUitDB('vriend_wallpaper_' + vriendId)
        if (cachedWallpaper) toonWallpaper(cachedWallpaper)
      } catch(e) {}
    }
    // v128: profiel nog nooit geopend? Dan wat de vriendenlijsten op dit toestel weten
    if (!getoond) {
      const b = bewaardeVriend()
      if (b) {
        toonProfielData(b)
        toonAvatar(await laadFotoUitDB('vriend_avatar_' + vriendId), b.avatar_url)
        getoond = true
      }
    }

    // v128: zonder internet niet op de server wachten (supabase-js probeert het zelf ~7 s opnieuw)
    if (!navigator.onLine) {
      toonZonderVerbinding(getoond, T('\u{1F4F4} Geen internet'))
      window.addEventListener('online', () => { haalVers(cacheKey) }, { once: true })
      return
    }
    if (!(await haalVers(cacheKey)) && !getoond) toonZonderVerbinding(false, T('\u26A0\uFE0F Laden lukte niet'))
  }

  // v128: profiel nog nooit geopend? Dan wat Vrienden of Chat op dit toestel bewaard hebben
  function bewaardeVriend() {
    const ik = huidigeUser.id
    try {
      const vp = JSON.parse(localStorage.getItem('fibro_vriendenpagina_' + ik) || 'null')
      const f = vp && Array.isArray(vp.data) && vp.data.find(x => x && x.profiles && x.profiles.id === vriendId)
      if (f) return f.profiles
    } catch (e) {}
    try {
      const cv = JSON.parse(localStorage.getItem('fibro_chatvrienden_' + ik) || 'null')
      const c = Array.isArray(cv) && cv.find(x => x && x.id === vriendId)
      if (c) return { username: c.username, avatar_url: c.avatar_url }
    } catch (e) {}
    return null
  }

  // v128: zonder verbinding weten we niet of de vriend online is
  function toonZonderVerbinding(getoond, tekst) {
    document.getElementById('onlineDot').classList.remove('online')
    document.getElementById('onlineLabel').textContent = tekst
    if (getoond) return
    const naam = vriendNaam(T('Vriend'))
    document.getElementById('profielNaam').textContent = naam
    document.getElementById('paginaTitel').textContent = naam
    delete document.getElementById('moodEmoji').dataset.sticker
    document.getElementById('moodEmoji').textContent = '\u{1F4F4}'
    document.getElementById('moodTekst').textContent = T('Dit profiel staat nog niet op dit toestel')
    toonAvatar(null, '\u{1F464}')
  }

  // ── Stap 2: Laad vers van Supabase ──
  // v132: eerst alleen de tekst en de kleuren (een paar KB). De avatar (±20 KB) en de
  // achtergrondfoto (gemiddeld 1,5 MB) alleen als de vriend zijn profiel sindsdien heeft
  // opgeslagen (updated_at is anders), of als ze niet (meer) op dit toestel staan.
  const KOLOMMEN_VRIEND = 'id,username,display_name,bio,mood,theme,avatar_url,created_at,updated_at,achtergrond_kleur,achtergrond_type,achtergrond_url,animatie,lettertype,accent_kleur,accent_kleur2,widgets,stickers,niveau,public_key,geblokkeerd,online_status,offline_emoji,offline_bericht,laatst_gezien,muziek_titel,muziek_artiest,profiel_quote,widget_layout,is_plus,is_moderator,toon_online'
  async function haalVers(cacheKey) {
    let oud = null
    try { oud = JSON.parse(localStorage.getItem(cacheKey) || 'null') } catch (e) {}
    let { data, error } = await supabase
      .from('profiles')
      .select(KOLOMMEN_VRIEND + ',avatar_versie,wallpaper_versie')
      .eq('id', vriendId)
      .single()
    if (error && error.code === '42703') { // v140: server nog niet bijgewerkt (nog geen foto-etiketten)
      ({ data, error } = await supabase.from('profiles').select(KOLOMMEN_VRIEND).eq('id', vriendId).single())
    }
    if (error && error.code === '42703') { // kolom bestaat niet (meer): dan alles, zoals vroeger
      ({ data, error } = await supabase.from('profiles').select('*').eq('id', vriendId).single())
    }

    if (error || !data) return false
    // v140: elke foto heeft een eigen etiket (avatar_versie, wallpaper_versie: de vingerafdruk die de
    // database zelf zet). Een foto wordt alleen opgehaald als zijn eigen etiket anders is, of als hij
    // niet (meer) op dit toestel staat: een nieuwe avatar haalt de achtergrond niet meer mee.
    // De eerste keer (nog geen etiket bewaard) geldt nog updated_at, zoals sinds v132; zonder
    // etiketten op de server ook (dan voor allebei).
    let fotosVersie = ''
    const etiket = { avatar: null, wallpaper: null } // etiket van de foto die nu op dit toestel staat (null: onbekend)
    const bewaard = { avatar: false, wallpaper: false } // staat al op dit toestel: niet opnieuw opslaan
    if ('avatar_data' in data || 'wallpaper_data' in data) {
      fotosVersie = data.updated_at || ''
      for (const s of ['avatar', 'wallpaper']) if ((s + '_versie') in data) etiket[s] = data[s + '_versie'] || ''
    } else {
      const metEtiket = 'avatar_versie' in data && 'wallpaper_versie' in data
      const zelfdeTijd = !!(oud && oud.fotos_versie && data.updated_at && oud.fotos_versie === data.updated_at)
      const fotos = { avatar: null, wallpaper: null }
      const nodig = []
      for (const s of ['avatar', 'wallpaper']) {
        const nu = metEtiket ? (data[s + '_versie'] || '') : null
        let goed = !!oud && (metEtiket && typeof oud[s + '_versie'] === 'string' ? oud[s + '_versie'] === nu : zelfdeTijd)
        if (goed && oud['heeft_' + s]) {
          fotos[s] = await laadFotoUitDB('vriend_' + s + '_' + vriendId)
          if (!fotos[s]) goed = false // stond er toch niet (meer)
        }
        if (goed) { etiket[s] = nu; bewaard[s] = true } else nodig.push(s)
      }
      fotosVersie = data.updated_at || ''
      if (nodig.length) {
        const kolommen = nodig.map(s => s + '_data').concat(metEtiket ? nodig.map(s => s + '_versie') : [])
        const r = await supabase.from('profiles').select(kolommen.join(',')).eq('id', vriendId).single()
        if (!r.error && r.data) {
          for (const s of nodig) {
            fotos[s] = r.data[s + '_data'] || null
            etiket[s] = metEtiket ? (r.data[s + '_versie'] || '') : null
          }
        } else {
          // ophalen lukte niet: wat er op dit toestel staat, en de volgende keer opnieuw proberen
          for (const s of nodig) {
            fotos[s] = await laadFotoUitDB('vriend_' + s + '_' + vriendId)
            bewaard[s] = true
            etiket[s] = null
          }
          fotosVersie = ''
        }
      }
      data = Object.assign({}, data, { avatar_data: fotos.avatar, wallpaper_data: fotos.wallpaper })
    }
    vriendData = data
    toonProfielData(data)

    // ── Avatar verwerken ──
    if (data.avatar_data && data.avatar_data.startsWith('data:')) {
      // Foto avatar uit Supabase
      toonAvatar(data.avatar_data, null)
      if (!bewaard.avatar) await slaFotoOp('vriend_avatar_' + vriendId, data.avatar_data)
    } else {
      toonAvatar(null, data.avatar_url || '👤')
      if (!bewaard.avatar) await wisFotoUitDB('vriend_avatar_' + vriendId)
    }

    // ── Wallpaper verwerken ──
    if (data.wallpaper_data && data.wallpaper_data.startsWith('data:')) {
      toonWallpaper(data.wallpaper_data)
      if (!bewaard.wallpaper) await slaFotoOp('vriend_wallpaper_' + vriendId, data.wallpaper_data)
    } else {
      verbergWallpaper() // v204
      if (!bewaard.wallpaper) await wisFotoUitDB('vriend_wallpaper_' + vriendId)
    }

    // ── Cache bijwerken ──
    try {
      localStorage.setItem(cacheKey, JSON.stringify({
        naam: data.username || '',
        bio: data.bio || '',
        mood: data.mood || '',
        avatar: data.avatar_url || '👤',
        accent_kleur: data.accent_kleur || '',
        accent_kleur2: data.accent_kleur2 || '',
        achtergrond_kleur: data.achtergrond_kleur || '',
        lettertype: data.lettertype || '',
        online_status: data.online_status || false,
        offline_emoji: data.offline_emoji || '',
        offline_bericht: data.offline_bericht || '',
        laatst_gezien: data.laatst_gezien || '',
        fotos_versie: fotosVersie, // v132: updated_at van de laatst opgehaalde foto's
        avatar_versie: etiket.avatar, // v140: etiket van de avatar op dit toestel (null: onbekend)
        wallpaper_versie: etiket.wallpaper,
        heeft_avatar: !!(data.avatar_data && data.avatar_data.startsWith('data:')),
        heeft_wallpaper: !!(data.wallpaper_data && data.wallpaper_data.startsWith('data:')),
        bijgewerkt: new Date().toISOString()
      }))
    } catch(e) {}
    return true
  }

  // Gastenboek als opengeslagen boek. Papier, liniatuur en kantlijn zitten
  // in de stijl hieronder; de gegevens komen uit guestbook_entries.
  async function renderGastenboekWidget(c, uid, papier = true) {
    // Gastenboek als opengeslagen boek, met bladzijden in plaats van scrollen.
    if (!c) return
    const escH = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')
    const veiligeAfbeelding = v => {
      const u = String(v||'').trim()
      return /^data:image\/(png|jpe?g|gif|webp);base64,[A-Za-z0-9+/=]+$/i.test(u) ? u : null
    }

    const wanneer = iso => {
      const s = Math.floor((Date.now() - new Date(iso)) / 1000)
      if (s < 60) return T('zojuist')
      if (s < 3600) return T('{n} min geleden', { n: Math.floor(s/60) })
      if (s < 86400) return T('{n} uur geleden', { n: Math.floor(s/3600) })
      if (s < 172800) return T('gisteren')
      if (s < 604800) return T('{n} dagen geleden', { n: Math.floor(s/86400) })
      return new Date(iso).toLocaleDateString(T.locale, { day:'numeric', month:'short' })
    }

    // De omslag-beweging staat één keer in de pagina.
    if (!document.getElementById('gb-boek-stijl')) {
      const st = document.createElement('style')
      st.id = 'gb-boek-stijl'
      st.textContent = `
        @keyframes gbBladerVooruit {
          from { transform: rotateY(0deg); opacity: 1 }
          50%  { transform: rotateY(-14deg); opacity: 0 }
          to   { transform: rotateY(0deg); opacity: 1 }
        }
        @keyframes gbBladerTerug {
          from { transform: rotateY(0deg); opacity: 1 }
          50%  { transform: rotateY(14deg); opacity: 0 }
          to   { transform: rotateY(0deg); opacity: 1 }
        }
        .gb-blad { transform-origin: left center }
        .gb-blad-vooruit { animation: gbBladerVooruit 340ms ease-in-out }
        .gb-blad-terug { animation: gbBladerTerug 340ms ease-in-out }
        @media (prefers-reduced-motion: reduce) {
          .gb-blad-vooruit, .gb-blad-terug { animation: none }
        }`
      document.head.appendChild(st)
    }

    // v128: de laatste stand bewaren, zodat het boek ook zonder internet gevuld is (zoals op Home).
    // Zonder internet niet eerst de server proberen (die probeert het een paar keer opnieuw).
    const gbSleutel = 'fibro_vriendgb_' + huidigeUser.id + '_' + uid
    let nietBewaard = false
    const leesGb = () => {
      try { const a = JSON.parse(localStorage.getItem(gbSleutel) || 'null'); return Array.isArray(a) ? a : null } catch (e) { return null }
    }
    const bewaarGb = lijst => {
      try {
        let s = JSON.stringify(lijst)
        // Te groot (foto's van de schrijvers): dan zonder foto, de emoji blijft
        if (s.length > 300000) s = JSON.stringify(lijst.map(e => Object.assign({}, e, { author: e.author ? { username: e.author.username, avatar_url: e.author.avatar_url } : e.author })))
        if (s.length <= 300000) localStorage.setItem(gbSleutel, s)
      } catch (e) {}
    }
    // v141: de foto's van de schrijvers komen niet meer bij elk bericht mee (tot 40 x 20 kB), maar
    // via vriendfotos.js, zoals in Vrienden en Chat: van dit toestel, en alleen opnieuw opgehaald als
    // die schrijver een andere avatar heeft (etiket avatar_versie; heeft de server nog geen
    // etiketten, dan updated_at). Het bewaarde boek heeft daardoor geen foto's meer nodig.
    const vulFotos = async (lijst, online) => {
      const wie = new Map()
      for (const e of lijst) {
        if (!e || !e.author_id || !e.author || wie.has(e.author_id)) continue
        const v = { id: e.author_id }
        if (online) { // alleen met internet mag vriendfotos.js iets ophalen
          v.updated_at = e.author.updated_at || ''
          if ('avatar_versie' in e.author) v.avatar_versie = e.author.avatar_versie
        }
        wie.set(e.author_id, v)
      }
      if (!wie.size) return lijst
      // zonder internet mag een foto uit een ouder bewaard boek nog als het toestel er geen heeft
      const zet = (l, m) => l.map(e => (e && e.author) ? Object.assign({}, e, { author: Object.assign({}, e.author,
        { avatar_data: m.get(e.author_id) || (online ? null : veiligeAfbeelding(e.author.avatar_data)) }) }) : e)
      try {
        const m = await haalVriendFotos(huidigeUser.id, [...wie.values()], nieuw => {
          if (!c.isConnected) return
          alles = zet(alles, nieuw)
          tekenBlad(null)
        })
        return zet(lijst, m)
      } catch (e) { console.warn('[gastenboek] vriendfoto\'s', e); return lijst }
    }
    const haal = async () => {
      nietBewaard = false
      if (navigator.onLine) {
        const vraag = velden => supabase
          .from('guestbook_entries')
          .select('*, author:author_id(' + velden + ')')
          .eq('profile_id', uid)
          .order('created_at', { ascending: false })
          .limit(40)
        let { data, error } = await vraag('username,avatar_url,updated_at,avatar_versie')
        if (error && error.code === '42703') ({ data, error } = await vraag('username,avatar_url,updated_at')) // server nog zonder foto-etiketten
        if (!error && Array.isArray(data)) { bewaarGb(data); return await vulFotos(data, true) }
      }
      const bewaard = leesGb()
      if (bewaard) return await vulFotos(bewaard, false)
      nietBewaard = !navigator.onLine
      return []
    }

    // v235: het uiterlijk staat in gastenboekstijl.js (ook gebruikt door Home)
    c.style.cssText += ';' + GB.containerStijl(papier)
    c.innerHTML = GB.binnenHtml({ papier, lijstId: 'gbwLijst', navId: 'gbwLijst-nav', invoerId: 'gbwInvoer', knopId: 'gbwKnop', plaatsHouder: T('Schrijf iets in het boek...'), plaatsenTitel: T('Plaatsen') })
    const opDeLijntjes = GB.houdOpDeLijntjes(c, c.querySelector('#gbwLijst'), c.querySelector('#gbwLijst-nav'), papier)

    let alles = []
    let blad = 0

    const bladen = () => Math.max(1, Math.ceil(alles.length / 4))

    const tekenBericht = e => GB.berichtHtml({
      papier, avSrc: veiligeAfbeelding(e.author?.avatar_data), avTekst: escH(e.author?.avatar_url || '\u270D'),
      naam: escH(e.author?.username || '?'), tijd: escH(wanneer(e.created_at)), tekst: escH(e.content)
    })

    const tekenNav = () => {
      const nav = c.querySelector('#gbwLijst-nav')
      if (!nav) return
      if (alles.length <= 4) { nav.innerHTML = ''; opDeLijntjes(true); return }
      const knop = (richting, teken, uit) =>
        `<button data-blader="${richting}" style="${GB.bladerKnopStijl(papier, uit)}" ${uit?'disabled':''}>${teken}</button>`
      nav.innerHTML =
        knop('terug', '\u2039', blad === 0) +
        `<span style="margin:0 auto">${T('blz. {n} van {m}', { n: blad + 1, m: bladen() })}</span>` +
        knop('vooruit', '\u203A', blad >= bladen() - 1)
      nav.querySelectorAll('[data-blader]').forEach(b => {
        b.addEventListener('click', () => blader(b.dataset.blader))
      })
      opDeLijntjes(true)
    }

    const tekenBlad = richting => {
      const l = c.querySelector('#gbwLijst')
      if (!l) return
      if (!alles.length) {
        l.innerHTML = GB.leegHtml(papier, nietBewaard ? T('\u{1F4F4} Geen internet. Dit gastenboek staat nog niet op dit toestel.') : T('Dit boek is nog leeg.'))
        tekenNav()
        return
      }
      const begin = blad * 4
      l.innerHTML = alles.slice(begin, begin + 4).map(tekenBericht).join('')
      tekenNav()
      if (richting) {
        l.classList.remove('gb-blad-vooruit', 'gb-blad-terug')
        void l.offsetWidth
        l.classList.add(richting === 'vooruit' ? 'gb-blad-vooruit' : 'gb-blad-terug')
      }
    }

    const blader = richting => {
      const nieuw = richting === 'vooruit' ? blad + 1 : blad - 1
      if (nieuw < 0 || nieuw >= bladen()) return
      blad = nieuw
      tekenBlad(richting)
    }

    // v129: vegen in het boek om te bladeren (naar links = volgende blz., naar rechts = vorige).
    // data-geen-swipe: dan gaat swipe.js op het boek niet naar een andere pagina.
    c.setAttribute('data-geen-swipe', '')
    ;(() => {
      const l = c.querySelector('#gbwLijst')
      if (!l) return
      let x0 = null, y0 = 0
      l.addEventListener('touchstart', e => { if (e.touches.length !== 1) { x0 = null; return } x0 = e.touches[0].clientX; y0 = e.touches[0].clientY }, { passive: true })
      l.addEventListener('touchend', e => {
        if (x0 === null) return
        const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0
        x0 = null
        if (Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy) * 1.2) return
        blader(dx < 0 ? 'vooruit' : 'terug')
      }, { passive: true })
      l.addEventListener('touchcancel', () => { x0 = null }, { passive: true })
    })()
    alles = await haal()
    tekenBlad(null)
    // v128: is er weer internet, dan het boek opnieuw ophalen
    window.addEventListener('online', async () => { if (!c.isConnected) return; alles = await haal(); blad = 0; tekenBlad(null) })

    const stuur = async () => {
      const inp = c.querySelector('#gbwInvoer')
      if (!inp) return
      const t = inp.value.trim()
      if (!t || t.length > 300) return
      if (!navigator.onLine) { inp.placeholder = T('\u{1F4F4} Geen internet, probeer het straks nog eens'); return } // v128: tekst blijft staan
      inp.value = ''
      const { error } = await supabase.from('guestbook_entries').insert({
        profile_id: uid,
        author_id: huidigeUser.id,
        content: t
      })
      if (error) { console.warn('[gastenboek] plaatsen mislukt', error); inp.value = t; return } // v128: tekst terug in het vakje
      alles = await haal()
      blad = 0
      tekenBlad(null)
    }

    c.querySelector('#gbwKnop')?.addEventListener('click', stuur)
    c.querySelector('#gbwInvoer')?.addEventListener('keydown', e => { if (e.key === 'Enter') stuur() })
  }

  async function laadGastenboek() {
    const { data, error } = await supabase
      .from('guestbook_entries')
      .select('*, author:author_id(username, avatar_url, avatar_data)')
      .eq('profile_id', vriendId)
      .order('created_at', { ascending: false })
      .limit(10)

    const container = document.getElementById('gbEntries')

    if (error || !data || data.length === 0) {
      container.innerHTML = '<div style="font-size:12px;color:var(--muted);padding:8px 0;">Nog geen berichten.</div>'
      return
    }

    // Gastenboekberichten komen van andere gebruikers: altijd ontsnappen.
    const gbEsc = v => String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')
    const gbAfbeelding = v => {
      const u = String(v||'').trim()
      return /^data:image\/(png|jpe?g|gif|webp);base64,[A-Za-z0-9+/=]+$/i.test(u) ? u : null
    }
    container.innerHTML = data.map(entry => {
      const avSrc = gbAfbeelding(entry.author?.avatar_data)
      const avatarHtml = avSrc
        ? `<img src="${avSrc}" style="width:100%;height:100%;object-fit:cover;">`
        : gbEsc(entry.author?.avatar_url || '👤')
      const tijd = tijdGeleden(entry.created_at)
      return `
        <div class="gb-entry">
          <div class="gb-av">${avatarHtml}</div>
          <div>
            <div class="gb-name">${gbEsc(entry.author?.username || 'Onbekend')}</div>
            <div class="gb-msg">${gbEsc(entry.content)}</div>
            <div class="gb-time">${gbEsc(tijd)}</div>
          </div>
        </div>
      `
    }).join('')
  }

  window.sendGb = async function() {
    const input = document.getElementById('gbInput')
    const tekst = input.value.trim()
    if (!tekst) return
    const { error } = await supabase.from('guestbook_entries').insert({
      profile_id: vriendId,
      author_id: huidigeUser.id,
      content: tekst
    })
    if (!error) {
      input.value = ''
    }
  }

  // v205: hier geen 'Vriendschap beeindigen' meer (op verzoek van Marcel). Een vriend verwijderen of blokkeren kan op
  // Vrienden: lang op de vriend drukken (vraagOntvrienden, kiesVriendActie in persoonblok.js).

  window.naarChat = function() {
    // chat.html opent het gesprek zelf op basis van ?vriend=<id>; naam en avatar
    // haalt hij uit de vriendenlijst, dus die hoeven niet in de link.
    window.location.href = vriendId ? 'chat.html?vriend=' + encodeURIComponent(vriendId) : 'chat.html'
  }

  function tijdGeleden(datum) {
    const diff = Math.floor((new Date() - new Date(datum)) / 1000)
    if (diff < 60) return 'Zojuist'
    if (diff < 3600) return Math.floor(diff/60) + ' minuten geleden'
    if (diff < 86400) return Math.floor(diff/3600) + ' uur geleden'
    return Math.floor(diff/86400) + ' dagen geleden'
  }

  init()

startMeldingen()
</script>
