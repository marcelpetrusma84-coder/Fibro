* { box-sizing:border-box; margin:0; padding:0; }

.invite-btn { font-size:15px; padding:10px 20px; min-height:44px; border-radius:22px; background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#1a0a2e; border:none; cursor:pointer; font-weight:700; } /* v250: groter, makkelijker te raken */

.search-input { width:100%; background:var(--card); border:0.5px solid var(--border); border-radius:20px; padding:8px 14px; color:var(--text); font-size:12px; outline:none; }

.f-avatar { width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; border:1.5px solid var(--border); position:relative; }
.f-avatar.purple { border-color:rgba(192,132,252,0.4); background:rgba(192,132,252,0.1); }
.f-avatar.blue { border-color:rgba(56,189,248,0.4); background:rgba(56,189,248,0.1); }

.bottom-nav { display:flex; justify-content:space-around; padding:12px 0; border-top:0.5px solid var(--border); background:rgba(0,0,0,0.3); position:fixed; bottom:0; width:100%; max-width:480px; z-index:10; padding-bottom:env(safe-area-inset-bottom,12px); backdrop-filter:blur(12px); }

.modal-overlay {

.timer-ring {

.timer-countdown.expired { color:#ff5c5c; }

/* Progress bar */
.progress-bar {
  width:100%;

  background:rgba(255,255,255,0.1);
  border-radius:2px;
  margin-bottom:20px;
  overflow:hidden;
}

.progress-fill {
  height:100%;
  background:linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius:2px;
  transition:width 1s linear;
}

/* Token code */
.token-code {
  background:rgba(192,132,252,0.1);
  border:1px dashed rgba(192,132,252,0.3);
  border-radius:8px;
  padding:10px;
  font-size:11px;
  color:var(--accent);
  letter-spacing:1px;
  margin-bottom:20px;
  word-break:break-all;
}

/* Buttons */
.modal-btn {
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  font-family:"DM Sans",sans-serif;
  font-size:13px;

  margin-bottom:8px;

.modal-btn-primary {

}

.modal-btn-primary:hover { opacity:0.9; transform:translateY(-1px); }
.modal-btn-primary:disabled { opacity:0.4; cursor:not-allowed; transform:none; }

.modal-btn-ghost {
  background:transparent;
  color:#fff;
  border:1px solid var(--border);
}

.modal-btn-ghost:hover { color:var(--text); border-color:var(--muted); }

/* Status bericht */
.modal-status {

.modal-status.error { background:rgba(255,92,92,0.1); color:#ff5c5c; border:1px solid rgba(255,92,92,0.2); display:block; }
.modal-status.success { background:rgba(192,132,252,0.1); color:var(--accent); border:1px solid rgba(192,132,252,0.2); display:block; }

/* Verlopen staat */
.expired-overlay {

.expired-overlay.show { display:flex; }

<script type="module">

  import { laadThema } from './thema.js?v=235'
  import { pasBlokstijlToe } from './blokstijl.js?v=95'
  import { supabase } from './supabase.js?v=95'
  import { startMeldingen } from './meldingen.js?v=188'
  import { startHeartbeat } from './heartbeat.js?v=117'
  import { wisVriendData } from './opruimen.js?v=95'
  import { blokkeerPersoon, kiesVriendActie, kiesGeblokkeerdActie, deblokkeerPersoon, verwijderGeblokkeerde, haalGeblokkeerden } from './persoonblok.js?v=3'
  import { initSync } from './sync.js?v=255'
  import { bewaardeSessieZonderInternet } from './offline.js?v=146'
  import { haalVriendFotos, zetAvatar } from './vriendfotos.js?v=2'
  pasBlokstijlToe()

  function isGebruikerOnline(profiel) {
    try { if (localStorage.getItem('fibro_ik_offline') === '1') return false } catch (e) {}
    if (!navigator.onLine) return false // v127: zonder internet weten we het niet
    if (!profiel || !profiel.online_status) return false // bugtest 3 nov: profiel kan leeg zijn (niet zichtbaar)
    if (!profiel.laatst_gezien) return false
    const sec = (Date.now() - new Date(profiel.laatst_gezien).getTime()) / 1000
    return sec < 300 // heartbeat elke 2 min (heartbeat.js)
  }

  // v203 (sneller): wie is er ingelogd op dit toestel? Alleen om meteen de lijst van de vorige keer te kunnen tonen,
  // zoals Home dat met zijn kop doet; de echte inlog komt daarna (supabase.auth.getSession).
  function uidVanToestel() {
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i)
        if (k && k.startsWith('sb-') && k.endsWith('-auth-token')) {
          const v = JSON.parse(localStorage.getItem(k) || 'null')
          if (v && v.user && typeof v.user.id === 'string') return v.user.id
        }
      }
    } catch (e) {}
    return null
  }
  function bewaardeLijst(userId) {
    try {
      const b = JSON.parse(localStorage.getItem('fibro_vriendenpagina_' + userId) || 'null')
      if (b && Array.isArray(b.data)) return { data: b.data, geblokkeerd: Array.isArray(b.geblokkeerd) ? b.geblokkeerd : [] }
    } catch (e) {}
    return null
  }

  async function init() {
    // v203: meteen de lijst van de vorige keer (van dit toestel), zonder op de server te wachten; de verse komt erna
    const snelId = uidVanToestel()
    const snel = snelId && bewaardeLijst(snelId)
    if (snel && (snel.data.length || snel.geblokkeerd.length)) tekenLijst(snelId, snel.data, snel.geblokkeerd, true)
    // v127: zonder internet eerst de bewaarde lijst tonen, zonder op de server te wachten
    // (een bijna verlopen inlogpas kan anders tot 30 seconden ophouden)
    const zonderNet = bewaardeSessieZonderInternet()
    if (zonderNet) await laadVrienden(zonderNet.user.id)
    await laadThema()
    let { data: { session } } = await supabase.auth.getSession()
    if (!session) session = zonderNet || bewaardeSessieZonderInternet()
    if (!session) { window.location.href = 'login.html'; return }
    startHeartbeat().catch(e => console.warn('[heartbeat]', e))
    if (!zonderNet) await laadVrienden(session.user.id)
    initSync(session.user.id)
  }

  async function laadVrienden(userId) {
    // v140: met het etiket van de avatar (avatar_versie); heeft de server dat nog niet, dan zonder
    const VELDEN = 'id, username, display_name, bio, avatar_url, mood, online_status, offline_emoji, offline_bericht, laatst_gezien, updated_at'
    const vraag = velden => supabase
      .from('friendships')
      .select('friend_id, profiles!friendships_friend_id_fkey(' + velden + ')')
      .eq('user_id', userId)
      .eq('status', 'accepted')
    // v203 (sneller): de geblokkeerden tegelijk vragen, niet pas als de vriendenlijst binnen is
    const geblokBelofte = navigator.onLine ? haalGeblokkeerden() : null
    if (geblokBelofte) geblokBelofte.catch(() => {}) // (wordt hieronder alleen gebruikt als de lijst lukt)
    // v246: ook profiel_versie (sql/profiel-versie.sql); bestaat die kolom nog niet, dan zonder
    // v250: ook de profielachtergrond (achtergrond_kleur en wallpaper_versie): een andere achtergrond is een update
    let antwoord = navigator.onLine
      ? await vraag(VELDEN + ', avatar_versie, profiel_versie, achtergrond_kleur, wallpaper_versie')
      : { data: null, error: { message: 'geen internet' } }
    if (antwoord.error && antwoord.error.code === '42703') antwoord = await vraag(VELDEN + ', avatar_versie, profiel_versie')
    if (antwoord.error && antwoord.error.code === '42703') antwoord = await vraag(VELDEN + ', avatar_versie')
    if (antwoord.error && antwoord.error.code === '42703') antwoord = await vraag(VELDEN)
    let { data, error } = antwoord

    const container = document.getElementById('vriendenLijst')

    // v127: de lijst bewaren; lukt ophalen niet (geen internet), dan de bewaarde lijst
    const lijstSleutel = 'fibro_vriendenpagina_' + userId
    let geblokkeerd = []
    if (!error && data) {
      volgAchtergronden(userId, data)
      geblokkeerd = await (geblokBelofte || haalGeblokkeerden())
      try { localStorage.setItem(lijstSleutel, JSON.stringify({ data, geblokkeerd })) } catch (e) {}
    } else {
      let bewaard = null
      try { bewaard = JSON.parse(localStorage.getItem(lijstSleutel) || 'null') } catch (e) {}
      if (bewaard && Array.isArray(bewaard.data)) {
        data = bewaard.data
        geblokkeerd = Array.isArray(bewaard.geblokkeerd) ? bewaard.geblokkeerd : []
        error = null
      }
    }
    if (error && !navigator.onLine) {
      laatsteLijst = null
      container.innerHTML = '<div style="padding:40px 20px;text-align:center;color:var(--muted);font-size:15px;line-height:1.8;">' + T('📴 Geen internet.<br>Je vriendenlijst staat nog niet op dit toestel. Open Vrienden een keer met internet.') + '</div>'
      return
    }
    if (error || !data || (data.length === 0 && geblokkeerd.length === 0)) {
      laatsteLijst = null
      container.innerHTML = '<div style="padding:40px 20px;text-align:center;color:var(--muted);font-size:15px;line-height:1.8;">' + T('👥 Nog geen vrienden.<br>Klik op <strong style="color:var(--accent)">+ Uitnodigen</strong> om iemand uit te nodigen!') + '</div>'
      return
    }
    tekenLijst(userId, data, geblokkeerd, false)
  }

  // v203: de lijst tekenen, uit laadVrienden gehaald, zodat ook de bewaarde lijst meteen kan. Is de lijst precies
  // hetzelfde als wat er al staat (meestal: de bewaarde lijst klopte nog), dan blijft alles staan zoals het is (geen
  // knipperen, een vinger op een rij blijft op die rij); alleen de foto's worden dan nog nagekeken.
  // vanToestel: de lijst van de vorige keer; dan alleen foto's van dit toestel, niets van de server.
  let laatsteLijst = null
  // v246: heeft deze vriend iets nieuws op zijn profiel? Uit sync.js (fibro_syncbij_<ik>_<vriend> = { t, v, oud, nieuw })
  // en de vingerafdruk die de vriend op de server zet (profiel_versie).
  //   'onderweg': op de server staat een andere vingerafdruk dan wat hier binnen is (en ook geen eerdere) -> nog niet binnen
  //   'nieuw':    er kwam iets nieuws binnen dat je nog niet bekeken hebt (vriend-profiel.html zet het uit)
  // v250: een andere profielachtergrond (kleur, verloop, wallpaper of eigen foto) van een vriend. Per vriend
  // fibro_achtergrondbij_<ik>_<vriend> = { s, nieuw }. De eerste keer is het beginpunt; vriend-profiel.html zet nieuw uit.
  function volgAchtergronden(userId, data) {
    for (const f of data || []) {
      const p = f && f.profiles
      if (!p || typeof p.id !== 'string' || !('achtergrond_kleur' in p)) continue
      const s = String(p.achtergrond_kleur || '') + '|' + String(p.wallpaper_versie || '')
      const sl = 'fibro_achtergrondbij_' + userId + '_' + p.id
      try {
        const vorig = JSON.parse(localStorage.getItem(sl) || 'null')
        if (!vorig || typeof vorig.s !== 'string') localStorage.setItem(sl, JSON.stringify({ s, nieuw: false }))
        else if (vorig.s !== s) localStorage.setItem(sl, JSON.stringify({ s, nieuw: true }))
      } catch (e) {}
    }
  }
  function achtergrondNieuw(p, userId) {
    try { return !!(JSON.parse(localStorage.getItem('fibro_achtergrondbij_' + userId + '_' + p.id) || 'null') || {}).nieuw } catch (e) { return false }
  }
  function profielStand(p, userId) {
    if (achtergrondNieuw(p, userId)) return 'nieuw'
    let bij = null
    try { bij = JSON.parse(localStorage.getItem('fibro_syncbij_' + userId + '_' + p.id) || 'null') } catch (e) {}
    if (!bij || typeof bij !== 'object' || typeof bij.v !== 'string') return ''
    const bekend = [bij.v].concat(Array.isArray(bij.oud) ? bij.oud : [])
    // v250: alleen een vingerafdruk van het belangrijke deel ('p2-'); die van een oudere Fibro ('p1-') telt niet
    if (typeof p.profiel_versie === 'string' && p.profiel_versie.startsWith('p2-') && !bekend.includes(p.profiel_versie)) return 'onderweg'
    return bij.nieuw ? 'nieuw' : ''
  }
  // v248: wanneer kwamen de foto's en widgets van deze vriend voor het laatst rechtstreeks binnen (stond eerst op het
  // profiel van de vriend, nu hier in de lijst). 0 = nog nooit.
  function bijgewerktOp(p, userId) {
    try {
      const bij = JSON.parse(localStorage.getItem('fibro_syncbij_' + userId + '_' + p.id) || 'null')
      return typeof bij === 'number' ? bij : Number(bij && bij.t) || 0
    } catch (e) { return 0 }
  }
  function syncWanneer(t) {
    const d = new Date(t), nu = new Date(), s = Math.floor((nu - d) / 1000)
    if (s < 60) return T('zojuist')
    if (s < 3600) return T('{n} min geleden', { n: Math.floor(s / 60) })
    const tijd = d.toLocaleTimeString(T.locale, { hour: '2-digit', minute: '2-digit' })
    const gisteren = new Date(nu); gisteren.setDate(nu.getDate() - 1)
    if (d.toDateString() === nu.toDateString()) return T('vandaag {tijd}', { tijd })
    if (d.toDateString() === gisteren.toDateString()) return T('gisteren {tijd}', { tijd })
    return d.toLocaleDateString(T.locale, { day: 'numeric', month: 'short' }) + ' ' + tijd
  }
  let laatsteTeken = null
  window.addEventListener('fibro-sync-bijgewerkt', () => { if (laatsteTeken) tekenLijst(...laatsteTeken) })
  setInterval(() => { if (laatsteTeken && !document.hidden) tekenLijst(...laatsteTeken) }, 60000) // "9 min geleden" bijhouden
  window.addEventListener('storage', e => { if (laatsteTeken && e.key && e.key.startsWith('fibro_syncbij_')) tekenLijst(...laatsteTeken) })
  function tekenLijst(userId, data, geblokkeerd, vanToestel) {
    laatsteTeken = [userId, data, geblokkeerd, vanToestel]
    // bugtest 3 nov: zonder zichtbaar profiel (de server geeft dan profiles: null) liep de hele lijst vast
    data = (data || []).filter(f => f && f.profiles)
    const container = document.getElementById('vriendenLijst')
    const gesorteerd = [...data].sort((a, b) => (isGebruikerOnline(b.profiles) ? 1 : 0) - (isGebruikerOnline(a.profiles) ? 1 : 0))
    const online = gesorteerd.filter(f => isGebruikerOnline(f.profiles))
    const offline = gesorteerd.filter(f => !isGebruikerOnline(f.profiles))

    // Alles wat een ander invult (naam, avatar, mood, status) moet ontsnapt
    // worden voordat het via innerHTML op het scherm komt.
    const vEsc = v => String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')

    // v246: de regel onder de naam als een vriend iets nieuws op zijn profiel heeft
    // v248: en anders wanneer zijn foto's en widgets voor het laatst binnenkwamen
    function profielRegel(stand, t) {
      if (stand === 'nieuw') return '<div class="profiel-stand nieuw" style="font-size:12px;font-weight:600;color:var(--accent2,#7ee0ff);margin-top:2px;">\u2728 ' + T('Profiel geüpdatet') + (t ? ' <span style="font-weight:400;opacity:0.75">\u00B7 ' + vEsc(syncWanneer(t)) + '</span>' : '') + '</div>'
      if (stand === 'onderweg') return '<div class="profiel-stand onderweg" style="font-size:12px;color:rgba(255,255,255,0.55);margin-top:2px;line-height:1.3;white-space:normal;">\u{1F504} ' + T('Profiel geüpdatet · zie je zodra jullie allebei online zijn') + '</div>'
      return '<div class="profiel-stand bijgewerkt" style="font-size:12px;color:rgba(255,255,255,0.5);margin-top:2px;">' +
        vEsc(t ? T('Bijgewerkt: {wanneer}', { wanneer: syncWanneer(t) }) : T('Nog niet bijgewerkt')) + '</div>'
    }
    function bouwRij(f) {
      const p = f.profiles
      const avatar = vEsc(p.avatar_url || '👤')
      // Weergavenaam komt via P2P binnen en staat lokaal; anders de username.
      let p2pNaam = ''
      try { p2pNaam = String(localStorage.getItem('vriend_naam_' + p.id + '_' + userId) || '').trim() } catch(e) {}
      const heeftWeergavenaam = !!p2pNaam
      const naam = vEsc(p2pNaam || p.username)
      const bio = vEsc(p.bio || '')
      const online = isGebruikerOnline(p)
      const stipKleur = online ? '#22c55e' : '#6b7280'
      const statusTekst = online
        ? (p.mood ? '<span style="font-size:12px;color:var(--accent2);font-style:italic;">' + vEsc(p.mood) + '</span>' : '')
        : '<span style="font-size:12px;color:var(--muted);">' + (p.offline_bericht ? vEsc((p.offline_emoji || '💤') + ' ' + p.offline_bericht) : T('Offline')) + '</span>'
      return '<div class="friend-row" data-vid="' + vEsc(p.id) + '" style="display:flex;align-items:center;gap:12px;padding:13px 14px;margin:6px 14px;background:var(--blok-kleur,var(--card));border:0.5px solid var(--border);border-radius:var(--blok-hoek,14px);transform:var(--blok-kantel,none);transition:transform 0.15s;backdrop-filter:blur(12px);cursor:pointer;">' +
        '<div style="position:relative;flex-shrink:0;">' +
        '<div class="vriend-foto" data-fid="' + vEsc(p.id) + '" data-emoji="' + avatar + '" style="width:46px;height:46px;border-radius:50%;background:rgba(192,132,252,0.15);border:1.5px solid rgba(192,132,252,0.3);display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden;">' + avatar + '</div>' +
        '<span style="position:absolute;bottom:1px;right:1px;width:11px;height:11px;border-radius:50%;background:' + stipKleur + ';border:2px solid #0a0014;display:block;"></span>' +
        '</div>' +
        '<div style="flex:1;min-width:0;">' +
        '<div style="font-size:14px;font-weight:600;color:#f3e8ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + naam + '</div>' +
        (heeftWeergavenaam ? '<div style="font-size:12px;color:rgba(255,255,255,0.45);margin-top:1px;">@' + vEsc(p.username || '') + '</div>' : '') +
        profielRegel(profielStand(p, userId), bijgewerktOp(p, userId)) +
        '</div>' +
        '<div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">' +
        // v201: geen slotje meer op Vrienden. Deze lijst haalt public_key niet op (VELDEN), dus het slotje stond hier
        // altijd open, ook al lang voor v200. In de Chat-lijst staat het open slotje nog wel, alleen als het echt zo is.
        '<span class="chat-knop" data-cid="' + vEsc(p.id) + '" data-cnaam="' + vEsc(p2pNaam || p.username) + '" data-cav="' + vEsc(p.avatar_url || '👤') + '" style="position:relative;display:inline-flex;align-items:center;">' +
        '<span style="font-size:22px;line-height:1;cursor:pointer;">💬</span>' +
        '<span style="position:absolute;bottom:-1px;right:-2px;width:9px;height:9px;border-radius:50%;background:' + stipKleur + ';border:1.5px solid rgba(0,0,0,0.5);"></span>' +
        '</span>' +
        '</div>' +
        '</div>'
    }

    function bouwGeblokkeerdRij(g) {
      let p2pNaam = ''
      try { p2pNaam = String(localStorage.getItem('vriend_naam_' + g.id + '_' + userId) || '').trim() } catch(e) {}
      const naam = p2pNaam || g.username || T('onbekend')
      return '<div class="blok-rij" data-bid="' + vEsc(g.id) + '" data-bnaam="' + vEsc(naam) + '" style="display:flex;align-items:center;gap:12px;padding:13px 14px;margin:6px 14px;background:var(--blok-kleur,var(--card));border:0.5px solid var(--border);border-radius:var(--blok-hoek,14px);opacity:0.6;cursor:pointer;">' +
        '<div style="width:46px;height:46px;border-radius:50%;background:rgba(248,113,113,0.12);border:1.5px solid rgba(248,113,113,0.35);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;">🚫</div>' +
        '<div style="flex:1;min-width:0;">' +
        '<div style="font-size:14px;font-weight:600;color:#f3e8ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + vEsc(naam) + '</div>' +
        '<div style="font-size:12px;color:rgba(255,255,255,0.45);margin-top:1px;">' + T('Geblokkeerd · tik voor opties') + '</div>' +
        '</div>' +
        '</div>'
    }

    let html = ''
    // v248: de uitleg één keer bovenaan, niet bij elke vriend
    if (data.length > 0) html += '<div class="sync-uitleg" style="font-size:12px;line-height:1.4;color:rgba(255,255,255,0.55);margin:10px 18px 2px;">' +
      vEsc(T("Nieuwe foto's en widgets van vrienden komen binnen als jullie allebei online zijn.")) + '</div>'
    if (online.length > 0) html += '<div class="section-label">🟢 Online (' + online.length + ')</div>' + online.map(bouwRij).join('')
    if (offline.length > 0) html += '<div class="section-label">' + T('⚫ Offline ({n})', { n: offline.length }) + '</div>' + offline.map(bouwRij).join('')
    if (geblokkeerd.length > 0) html += '<div class="section-label">' + T('🚫 Geblokkeerd ({n})', { n: geblokkeerd.length }) + '</div>' + geblokkeerd.map(bouwGeblokkeerdRij).join('')
    const zelfde = html === laatsteLijst && !!container.querySelector('.friend-row, .blok-rij')
    laatsteLijst = html
    if (!zelfde) container.innerHTML = html

    // v134: avatarfoto's van vrienden (vriendfotos.js): eerst wat op dit toestel staat, nieuwe later
    const zetFotos = (fotos) => {
      for (const el of container.querySelectorAll('.vriend-foto[data-fid]')) {
        const f = fotos.get(el.dataset.fid)
        if (f || el.dataset.foto) zetAvatar(el, el.dataset.emoji, f)
      }
    }
    // v203: bij de lijst van de vorige keer alleen de foto's van dit toestel (zonder updated_at haalt vriendfotos.js niets)
    const fotoVrienden = data.map(f => f && f.profiles).filter(Boolean).map(p => vanToestel ? { id: p.id } : p)
    haalVriendFotos(userId, fotoVrienden, zetFotos).then(zetFotos).catch(e => console.warn('[vrienden] vriendfoto\'s', e))
    if (zelfde) return // alles staat er al, met de knoppen

    // Klikgedrag via listeners in plaats van onclick-attributen
    container.querySelectorAll('.friend-row').forEach(rij => {
      rij.style.cursor = 'pointer'
      var langIndrukken = null
      var wasLang = false

      function startDruk() {
        wasLang = false
        clearTimeout(langIndrukken)
        langIndrukken = setTimeout(function () {
          wasLang = true
          rij.style.outline = '1px solid var(--accent)'
          try { if (navigator.vibrate) navigator.vibrate(30) } catch (e) {}
          vraagOntvrienden(rij, userId)
        }, 600)
      }
      function stopDruk() {
        clearTimeout(langIndrukken)
        setTimeout(function () { rij.style.outline = '' }, 200)
      }

      rij.addEventListener('pointerdown', startDruk)
      rij.addEventListener('pointerup', stopDruk)
      rij.addEventListener('pointerleave', stopDruk)
      rij.addEventListener('pointercancel', stopDruk)
      rij.addEventListener('contextmenu', function (e) { e.preventDefault() })

      rij.addEventListener('click', e => {
        if (wasLang) { e.preventDefault(); e.stopPropagation(); wasLang = false; return }
        window.location.href = 'vriend-profiel.html?id=' + encodeURIComponent(rij.dataset.vid)
      })
    })
    container.querySelectorAll('.blok-rij').forEach(rij => {
      rij.addEventListener('contextmenu', function (e) { e.preventDefault() })
      rij.addEventListener('click', () => vraagGeblokkeerde(rij, userId))
    })
    container.querySelectorAll('.chat-knop').forEach(knop => {
      knop.addEventListener('click', e => {
        e.stopPropagation()
        window.location.href = 'chat.html?id=' + encodeURIComponent(knop.dataset.cid) +
          '&naam=' + encodeURIComponent(knop.dataset.cnaam) +
          '&avatar=' + encodeURIComponent(knop.dataset.cav)
      })
    })
  }

  async function vraagOntvrienden(rij, mijnId) {
    var vriendId = rij.dataset.vid
    var chatKnop = rij.querySelector('.chat-knop')
    var naam = chatKnop ? String(chatKnop.dataset.cnaam || '').trim() : ''
    if (!naam) naam = T('deze vriend')

    var keuze = await kiesVriendActie(naam)
    if (keuze === 'blokkeren') {
      if (!confirm(T('{naam} blokkeren?\n\n{naam} kan je dan geen berichten meer sturen, je profiel niet meer zien en ziet jou niet meer in de vriendenlijst. {naam} krijgt hier geen melding van.\n\nJe vindt {naam} daarna onderaan je vriendenlijst. Daar kun je ook weer deblokkeren.', { naam }))) return
      if (!(await blokkeerPersoon(vriendId))) { alert(T('Het is niet gelukt. Probeer het later opnieuw.')); return }
      await laadVrienden(mijnId)
      return
    }
    if (keuze !== 'verwijderen') return

    if (!confirm(T('{naam} uit je vriendenlijst halen?\n\nJullie verdwijnen allebei uit elkaars lijst. Berichten sturen en bellen kan daarna niet meer. Opnieuw toevoegen kan alleen met een nieuwe uitnodigingslink.', { naam }))) return

    var res = await supabase
      .from('friendships')
      .delete()
      .or('and(user_id.eq.' + mijnId + ',friend_id.eq.' + vriendId + '),and(user_id.eq.' + vriendId + ',friend_id.eq.' + mijnId + ')')
      .select()

    if (res.error) { alert(T('Het is niet gelukt: {fout}', { fout: res.error.message })); return }
    if (!res.data || res.data.length === 0) { alert(T('Er is niets verwijderd.')); return }

    await wisVriendData(vriendId, mijnId)

    rij.remove()
    alert(T('{naam} staat niet meer in je vriendenlijst.\n\nDe foto\'s, muziek en widgets van deze vriend zijn van dit apparaat verwijderd.', { naam }))
  }

  async function vraagGeblokkeerde(rij, mijnId) {
    var id = rij.dataset.bid
    var naam = String(rij.dataset.bnaam || '').trim() || T('deze persoon')
    var keuze = await kiesGeblokkeerdActie(naam)
    if (keuze === 'deblokkeren') {
      if (!(await deblokkeerPersoon(id))) { alert(T('Het is niet gelukt. Probeer het later opnieuw.')); return }
      await laadVrienden(mijnId)
      return
    }
    if (keuze !== 'verwijderen') return
    if (!confirm(T('{naam} verwijderen?\n\nDe blokkade wordt opgeheven en jullie zijn geen vrienden meer. Opnieuw toevoegen kan alleen met een nieuwe uitnodigingslink.', { naam }))) return
    if (!(await verwijderGeblokkeerde(id))) { alert(T('Het is niet gelukt. Probeer het later opnieuw.')); return }
    await wisVriendData(id, mijnId)
    await laadVrienden(mijnId)
  }

  init()


startMeldingen()

  const MEE_SPELLEN = [

    ['pinball', '🐍', 'Twin Snakes'], ['endlessrunner', '🏃', 'Runner & Gunner'], ['flappybird', '🦇', 'Flapper'], ['shmup', '🚀', 'Neon Raiders'],
  ]
  // Het adres van de uitnodigingspagina staat alleen hier (later: eigen domein)

  {
    const kies = document.getElementById('uitSpel')

  async function genereerInvite() {

    // Haal ingelogde gebruiker op

    // Genereer uniek token: 16 willekeurige tekens via crypto.getRandomValues
    const TEKENS = 'abcdefghijklmnopqrstuvwxyz234567'

    // v182: achter het hekje de (korte) vingerafdruk van mijn sleutel. Wat na # staat gaat nooit naar een server;

    try {
      const priv = user ? haalPrivateKeyOp(user.id) : null
      if (priv) vinger = (await sleutelVingerafdruk(await eigenPubliekeSleutel(priv))).slice(0, 32)
    } catch (e) { vinger = '' }
    const meeSpel = document.getElementById('uitSpel').value
    const spelDeel = MEE_SPELLEN.some(s => s[0] === meeSpel) ? '&spel=' + encodeURIComponent(meeSpel) : '' // v250
    // v265: je weergavenaam achter het hekje (#n=), zodat de uitnodiging hem laat zien; gaat nooit naar een server
    const naamDeel = (() => { const n = user ? eigenNaam(user.id) : ''; return n ? 'n=' + encodeURIComponent(n) : '' })()
    const hekje = [vinger ? 's=' + vinger : '', naamDeel].filter(Boolean).join('&')
    const inviteUrl = UITNODIGING_ADRES + '?token=' + token + spelDeel + (hekje ? '#' + hekje : '')
    const linkVeld = document.getElementById('invite-link')
    if (linkVeld) linkVeld.value = inviteUrl
    deelTekst = maakDeelTekst(user ? eigenNaam(user.id) : '', meeSpel, DUUR)
    try { document.getElementById('deel-link-btn').scrollIntoView({ block: 'nearest' }) } catch (e) {}

    // Maak QR code
    document.getElementById('qr-container').innerHTML = ''
    new QRCode(document.getElementById('qr-container'), {
      text: inviteUrl,
      width: 200,
      height: 200,
      colorDark: '#1a0a2e',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.H
    })

    // Start timer (v250: gerekend vanaf de eindtijd, zodat hij ook klopt als de telefoon even sliep)
    const eindTijd = Date.parse(verlooptOm)
    secondsLeft = DUUR
    updateTimer()
    timerInterval = setInterval(() => {
      secondsLeft = Math.max(0, Math.ceil((eindTijd - Date.now()) / 1000))
      updateTimer()
      if (secondsLeft <= 0) {
        clearInterval(timerInterval)
        toonVerlopen()
      }
    }, 1000)
  }

  // ========================
  // TIMER UPDATEN
  // ========================
  function updateTimer() {
    const display = document.getElementById('timer-display')
    const progress = document.getElementById('progress-fill')

    display.textContent = tijdTekst(secondsLeft)

    // Kleur aanpassen
    display.className = 'timer-countdown'
    if (secondsLeft <= 60) display.classList.add('expired')
    else if (secondsLeft <= 300) display.classList.add('warning')

    // Progress bar
    const percentage = (secondsLeft / DUUR) * 100
    progress.style.width = percentage + '%'
  }

  // v250: 2 d 23:59:59, 23:59:59 of 59:59
  function tijdTekst(sec) {
    const t = Math.max(0, Math.floor(sec)), d = Math.floor(t / 86400), u = Math.floor(t % 86400 / 3600), m = Math.floor(t % 3600 / 60), s = t % 60
    const tw = n => String(n).padStart(2, '0')
    if (d > 0) return T('{d} d', { d }) + ' ' + tw(u) + ':' + tw(m) + ':' + tw(s)
    if (u > 0) return tw(u) + ':' + tw(m) + ':' + tw(s)
    return tw(m) + ':' + tw(s)
  }

  // ========================
  // VERLOPEN WEERGAVE
  // ========================
  function toonVerlopen() {
    document.getElementById('expired-overlay').classList.add('show')
    document.getElementById('timer-display').className = 'timer-countdown expired'
    document.getElementById('timer-display').textContent = '00:00'
    document.getElementById('progress-fill').style.width = '0%'
  }

  // ========================
  // NIEUWE INVITE
  // ========================
  window.kopieerInviteLink = function() {
    const veld = document.getElementById('invite-link')
    veld.select()
    navigator.clipboard.writeText(veld.value).then(() => {
      const btn = document.getElementById('kopieer-link-btn')
      const orig = btn.textContent
      btn.textContent = T('Gekopieerd!')
      setTimeout(() => btn.textContent = orig, 2000)
    }).catch(() => { prompt(T('Kopieer deze link:'), veld.value) })
  }

  // v258: delen via het deelmenu van de telefoon. De zin erbij legt uit wat de link is (een losse link lijkt op spam).
  // Je eigen naam staat lokaal (fibro_profiel_<id>.naam, zoals op het beginscherm), anders je gebruikersnaam.
  let deelTekst = ''
  function eigenNaam(uid) {
    try { const n = String(JSON.parse(localStorage.getItem('fibro_profiel_' + uid) || '{}').naam || '').trim(); if (n) return n.slice(0, 40) } catch (e) {}
    try { const p = JSON.parse(localStorage.getItem('fibro_profielcache_' + uid) || 'null'); if (p) return String(p.display_name || p.username || '').trim().slice(0, 40) } catch (e) {}
    return ''
  }
  function maakDeelTekst(naam, spelId, duur) {
    const spel = (MEE_SPELLEN.find(s => s[0] === spelId) || [])[2] || ''
    const duurNaam = { 3600: '1 uur', 86400: '1 dag', 259200: '3 dagen', 604800: '7 dagen' }[duur] || '3 dagen'
    const zin = naam
      ? (spel ? T('{naam} nodigt je uit voor Stekky en daagt je uit voor een potje {spel}!', { naam, spel }) : T('{naam} nodigt je uit voor Stekky!', { naam }))
      : (spel ? T('Je bent uitgenodigd voor Stekky en voor een potje {spel}!', { spel }) : T('Je bent uitgenodigd voor Stekky!'))
    return zin + ' ' + T('Tik binnen {duur} op de link om vrienden te worden:', { duur: T(duurNaam) })
  }
  window.deelInviteLink = async function() {
    const url = document.getElementById('invite-link').value
    if (!url || secondsLeft <= 0) return
    // De link staat in de tekst zelf: zo komt hij in elke app mee (sommige apps laten een los url-veld weg)
    const volledig = deelTekst + '\n' + url
    if (typeof navigator.share === 'function') {
      try { await navigator.share({ text: volledig }); return }
      catch (e) { if (e && e.name === 'AbortError') return } // zelf weggetikt
    }
    // Geen deelmenu (computer, sommige apps) of delen lukte niet: de hele uitnodiging kopieren
    const btn = document.getElementById('deel-link-btn')
    try {
      await navigator.clipboard.writeText(volledig)
      btn.textContent = T('✅ Gekopieerd! Plak het in WhatsApp of een bericht.')
      setTimeout(() => { btn.textContent = T('📤 Delen') }, 3500)
    } catch (e) { prompt(T('Kopieer deze tekst:'), volledig) }
  }

  window.nieuweInvite = async function() {
    await genereerInvite()
  }

  // ========================
  // STATUS BERICHT
  // ========================
  function toonStatus(type, tekst) {
    const el = document.getElementById('modal-status')
    el.className = 'modal-status ' + type
    el.textContent = tekst
  }
</script>

<script>
function filterVrienden() {
  var query = document.getElementById("searchInput").value.toLowerCase();
  var rows = document.querySelectorAll(".friend-row");
  rows.forEach(function(row) {
    var naam = row.querySelector(".f-name").textContent.toLowerCase();
    row.style.display = naam.indexOf(query) !== -1 ? "flex" : "none";
  });
  document.querySelectorAll(".section-label").forEach(function(l) {
    l.style.display = query ? "none" : "block";
  });
}
</script>
